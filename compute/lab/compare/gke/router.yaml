# The sandbox router, as Agent Sandbox's own deployment files at v1.0.7 set
# it up (namespace agent-sandbox-system, label app=sandbox-router, which the
# template's managed network policy lets in), plus an internal load balancer
# so the benchmark client, on its own VM in the zone, reaches it.
#
#   base=https://raw.githubusercontent.com/kubernetes-sigs/agent-sandbox/v1.0.7/sandbox-router/deploy
#   kubectl create namespace agent-sandbox-system
#   for f in serviceaccount rbac service; do kubectl apply -f $base/$f.yaml; done
#   curl -fsSL $base/deployment.yaml | sed 's|sandbox-router-go:latest|sandbox-router-go:v1.0.7|' | kubectl apply -f -
#   kubectl apply -f router.yaml
apiVersion: v1
kind: Service
metadata:
  name: sandbox-router-internal
  namespace: agent-sandbox-system
  annotations:
    networking.gke.io/load-balancer-type: Internal
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app.kubernetes.io/name: sandbox-router
    app.kubernetes.io/component: sandbox-router
  ports:
    - name: proxy
      port: 8080
      targetPort: proxy
      protocol: TCP
