# compute-guard.service on a machine the host shares with other work, such
# as a hypervisor that also runs other VMs (ADR 26). install.sh installs
# it as /etc/systemd/system/compute-guard.service.d/shared-machine.conf
# when host.env sets COMPUTE_MACHINE=shared, and removes it otherwise.
#
# There the guard feeds systemd's watchdog of this service instead of the
# machine's, whose reset would end the machine's other work too. systemd
# kills a guard that stops feeding it for the lease terms' watchdog
# timeout (3 s), and after every end of the guard, however it ended, runs
# its stop hook, which kills every VM, as the reset would, and restarts the
# agent if it runs (which starts a new guard with it). An upgrade hands the
# guard over instead (compute-host hand-over-guard): then the hook leaves
# the VMs to the new guard, which systemd starts next and which must feed
# its watchdog within the same timeout.
#
# A guard asked to stop ends at its first step that may feed the
# watchdog, at once while the lease is valid, otherwise once it has stopped
# the VMs; systemd's watchdog does not run while it stops, so the stop is
# bounded by its own timeout, which leaves the hook time to see the VMs
# gone. systemd itself is outside this: let it feed the machine's hardware
# watchdog (RuntimeWatchdogSec=), which resets the machine only if systemd
# stops (docs/operations.md, A host that shares its machine).
[Service]
ExecStart=
ExecStart=/opt/compute/current/compute-host guard --watchdog service
WatchdogSec=3s
WatchdogSignal=SIGKILL
TimeoutStopSec=15s
ExecStopPost=/opt/compute/current/compute-host guard-stopped
