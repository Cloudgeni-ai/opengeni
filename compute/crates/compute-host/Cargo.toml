[package]
name = "compute-host"
description = "The Opengeni compute host agent: runs sandboxes as microVMs and sleeps and wakes them"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "compute-host"
path = "src/main.rs"

[dependencies]
anyhow = "1"
blake3 = "1.8"
bytes = "1"
clap = { version = "4", features = ["derive"] }
compute-core = { path = "../compute-core" }
compute-engine = { path = "../compute-engine" }
compute-fleet = { path = "../compute-fleet" }
compute-guest = { path = "../compute-guest" }
compute-image = { path = "../compute-image" }
compute-link = { path = "../compute-link" }
compute-pager = { path = "../compute-pager" }
compute-protocol = { path = "../compute-protocol" }
compute-storage = { path = "../compute-storage" }
futures = "0.3"
getrandom = { version = "0.3", features = ["std"] }
object_store = { version = "0.12.4", features = ["aws", "azure", "gcp"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-manual-roots", "rustls-tls-native-roots"] }
rustix = { version = "1", features = ["event", "fs", "mm", "net", "param", "process", "thread", "time"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
rustls-webpki = { version = "0.103", default-features = false, features = ["ring", "std"] }
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "linux")'.dependencies]
tikv-jemallocator = { version = "0.7", features = [
    "background_threads",
    "unprefixed_malloc_on_supported_platforms",
] }

[dev-dependencies]
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rcgen = "0.13"
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

[lints]
workspace = true
