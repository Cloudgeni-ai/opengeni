[package]
name = "compute-host"
description = "The Opengeni compute host agent: runs sandboxes as microVMs and sleeps and wakes them"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "compute-host"
path = "src/main.rs"

[dependencies]
anyhow = "1"
blake3 = "1.8"
clap = { version = "4", features = ["derive"] }
compute-core = { path = "../compute-core" }
compute-engine = { path = "../compute-engine" }
compute-storage = { path = "../compute-storage" }
futures = "0.3"
object_store = { version = "0.12.4", features = ["aws", "azure", "gcp"] }
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[lints]
workspace = true
