[package]
name = "compute-engine"
description = "The operations an Opengeni compute host needs from a VM program, and a Firecracker driver"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
rustix = { version = "1", features = ["event", "fs", "process", "std"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "net", "process", "rt", "sync", "time"] }
tokio-util = "0.7"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
