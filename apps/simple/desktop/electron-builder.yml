appId: ai.opengeni.simple
productName: Opengeni Simple
electronVersion: 44.7.2
directories:
  output: release
files:
  - main.cjs
  - welcome.html
  - package.json
  # The bundled main-process module and the window's preload (bundle.ts).
  - out/computer.cjs
  - out/preload.cjs
  - "!**/node_modules/**"
# The app has no runtime dependencies; never pick up the monorepo's.
npmRebuild: false
extraResources:
  - from: build/simple-server
    to: simple-server
  - from: build/dist
    to: dist
mac:
  target:
    - target: zip
      arch: [arm64]
  icon: build/icon.png
  category: public.app-category.productivity
  identity: null
  # Opens the app with --hidden at login while this computer is connected (bundle.ts).
  extraFiles:
    - from: build/LaunchAgents
      to: Library/LaunchAgents
protocols:
  - name: Opengeni sign-in
    schemes: [opengeni]
