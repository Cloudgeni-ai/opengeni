[package]
name = "opengeni-speakers"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Tells speakers apart in meeting audio (diarization) and computes voice embeddings, on CPU through ONNX Runtime."
publish = false

[[bin]]
name = "opengeni-speakers"
path = "src/main.rs"

[dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "copy-dylibs", "tls-rustls"] }
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
