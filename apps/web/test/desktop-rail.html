<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Desktop sidebar preview</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // `?bar=<px>`: the window bar height the shell reports on macOS, 44 as
      // the current shell does; `?bar=none` for shells that don't report it.
      // `?zoom=<factor>`: the page zoom the shell reports.
      const params = new URLSearchParams(location.search);
      const platform = params.get("platform") || "macos";
      const bar = params.get("bar") || "44";
      const zoom = Number(params.get("zoom") || "1");
      if (platform !== "browser")
        window.opengeniDesktop = {
          version: 1,
          platform,
          capabilities: [],
          ...(platform === "macos" && bar !== "none"
            ? { windowBarHeight: Number(bar), zoomFactor: () => zoom }
            : {}),
        };
    </script>
    <script type="module" src="/test/desktop-rail-fixture.tsx"></script>
  </body>
</html>
