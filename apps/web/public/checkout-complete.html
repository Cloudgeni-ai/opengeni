<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Checkout complete · Opengeni</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: light dark;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        --bg: #f7f7f7;
        --surface: #ffffff;
        --border: #e4e4e4;
        --fg: #171717;
        --muted: #525252;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141414;
          --surface: #1a1a1a;
          --border: #363636;
          --fg: #f5f5f5;
          --muted: #a6a6a6;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        color: var(--fg);
        background: var(--bg);
      }
      main {
        box-sizing: border-box;
        width: min(420px, 100%);
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--surface);
        padding: 28px;
      }
      h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
      }
      p {
        margin: 8px 0 0;
        font-size: 14px;
        line-height: 1.5;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">You're all set</h1>
      <p id="body">
        Go back to the chat or page you came from. Your credits show up there in a few seconds. You
        can close this tab.
      </p>
    </main>
    <script>
      if (new URLSearchParams(location.search).get("checkout") === "cancelled") {
        document.getElementById("title").textContent = "Checkout cancelled";
        document.getElementById("body").textContent =
          "Nothing was charged. Go back to the chat or page you came from to continue. You can close this tab.";
      }
      // When Opengeni opened this tab for checkout, the browser lets it close
      // itself; a tab opened from a link stays, with this message.
      setTimeout(() => window.close(), 1500);
    </script>
  </body>
</html>
