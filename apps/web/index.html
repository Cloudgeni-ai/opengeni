<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="referrer" content="no-referrer" />
    <script id="opengeni-setup-account-bootstrap">
      // Normalize setup authority in the browser because HTTP servers never
      // receive URL fragments. This must remain the first executable head
      // content so query and fragment can be rejected together and scrubbed
      // before any subresource can inherit a query-bearing Referer. Hand the
      // singular canonical token to the SPA once through non-enumerable process
      // memory. Keep this parser in lockstep with src/setup-account-token.ts.
      (() => {
        if (window.location.pathname !== "/setup-account") return;
        const query = new URLSearchParams(window.location.search);
        const fragment = new URLSearchParams(window.location.hash.slice(1));
        const candidates = [...fragment.getAll("token"), ...query.getAll("token")];
        const candidate = candidates.length === 1 ? candidates[0] : null;
        query.delete("token");
        fragment.delete("token");
        const search = query.toString();
        const hash = fragment.toString();
        window.history.replaceState(
          null,
          "",
          `/setup-account${search ? `?${search}` : ""}${hash ? `#${hash}` : ""}`,
        );
        const robots = document.createElement("meta");
        robots.name = "robots";
        robots.content = "noindex,nofollow";
        document.head.append(robots);
        if (candidate && /^[A-Za-z0-9_-]{43}$/.test(candidate)) {
          Object.defineProperty(window, "__OPENGENI_SETUP_ACCOUNT_TOKEN__", {
            configurable: true,
            value: candidate,
          });
        }
      })();
    </script>
    <script id="opengeni-appearance-bootstrap">
      // Apply before styles paint; keep in sync with src/lib/appearance.tsx.
      (() => {
        let preference = "system";
        try {
          preference = localStorage.getItem("opengeni.appearance") || "system";
        } catch {}
        const theme =
          preference === "light" || preference === "dark"
            ? preference
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        document.documentElement.dataset.ogTheme = theme;
        document.documentElement.classList.toggle("dark", theme === "dark");
      })();
    </script>
    <meta
      name="description"
      content="Open-source cloud agents. Work on research, documents, and code, and keep the conversation, context, and results together."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Opengeni" />
    <meta property="og:title" content="Opengeni" />
    <meta
      property="og:description"
      content="Open-source cloud agents. Work on research, documents, and code, and keep the conversation, context, and results together."
    />

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Opengeni: infrastructure for agents that actually finish the job" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

  </head>

  </body>
