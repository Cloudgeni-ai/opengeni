<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Opengeni Browser</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header>
        <img class="brand-mark" src="icons/brand-mark.svg" alt="" width="28" height="22" />
        <div>
          <h1><span class="wordmark">Opengeni</span><span class="product">Browser</span></h1>
          <p class="status"><span class="signal" aria-hidden="true"></span><span data-state role="status">Connecting…</span></p>
        </div>
      </header>
      <p class="detail" data-detail>Connecting this Chrome profile to your machine agent.</p>
      <form>
        <label for="profile-label">Profile label</label>
        <div class="field">
          <input
            id="profile-label"
            data-profile-label
            maxlength="200"
            placeholder="e.g. Work, Personal"
            autocomplete="off"
          />
          <button type="submit">Save</button>
        </div>
        <small>Used only to recognize this profile in Opengeni.</small>
      </form>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
