# Packaging for the Opengeni desktop app. The bundle in dist/ has no runtime
# dependencies (scripts/build.ts inlines everything but Electron), so the app
# archive holds only dist/ and package.json.
appId: ai.opengeni.desktop
productName: Opengeni
copyright: Copyright © Opengeni
directories:
  output: release
  buildResources: resources
files:
  - dist/**
  - "!dist/**/*.map"
  - package.json
includeSubNodeModules: false
npmRebuild: false
nodeGypRebuild: false
asar: true
electronLanguages: [en]
protocols:
  - name: Opengeni
    schemes: [opengeni]
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  loadBrowserProcessSpecificV8Snapshot: false
  grantFileProtocolExtraPrivileges: false
publish:
  provider: github
  owner: Cloudgeni-ai
  repo: opengeni
  releaseType: release
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]
  icon: resources/icon.png
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  minimumSystemVersion: "12.0"
  extendInfo:
    NSMicrophoneUsageDescription: Opengeni uses the microphone when you dictate or talk to an agent.
    NSCameraUsageDescription: Opengeni uses the camera when you share a photo with an agent.
  notarize: true
dmg:
  artifactName: Opengeni-${version}-mac.${ext}
  writeUpdateInfo: false
zip:
  artifactName: Opengeni-${version}-mac.${ext}
win:
  target:
    - target: nsis
      arch: [x64, arm64]
  icon: resources/icon.png
nsis:
  oneClick: true
  perMachine: false
  artifactName: Opengeni-${version}-windows-${arch}.${ext}
linux:
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
    - target: rpm
      arch: [x64, arm64]
  icon: resources/icon.png
  category: Development
  executableName: opengeni
  artifactName: Opengeni-${version}-linux-${arch}.${ext}
  desktop:
    entry:
      MimeType: x-scheme-handler/opengeni;
