# Packaging for the Opengeni desktop app. scripts/build.ts inlines everything
# but Electron into dist/ and writes a dependency-free package.json there, so
# dist/ is the whole app archive.
appId: ai.opengeni.desktop
productName: Opengeni
copyright: Copyright © Opengeni
electronVersion: 44.7.2
directories:
  output: release
  buildResources: resources
  app: dist
files:
  - "**/*"
  - "!**/*.map"
  - "!**/node_modules/**"
npmRebuild: false
nodeGypRebuild: false
asar: true
electronLanguages: [en]
# The system audio helper for meeting recordings (audio-capture/), built for
# each platform and architecture by scripts/build-audio-capture.ts.
extraResources:
  - from: build/audio-capture/${os}-${arch}
    to: audio-capture
protocols:
  - name: Opengeni
    schemes: [opengeni]
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  loadBrowserProcessSpecificV8Snapshot: false
  grantFileProtocolExtraPrivileges: false
# A publish target makes electron-builder write latest-mac.yml. The app sets its
# real feed at runtime: the newest desktop-v release (see src/main.ts).
publish:
  provider: generic
  url: https://github.com/Cloudgeni-ai/opengeni/releases
mac:
  category: public.app-category.productivity
  artifactName: Opengeni-${version}-mac.${ext}
  target:
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]
  icon: resources/icon.png
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  minimumSystemVersion: "12.0"
  # The launch agent that opens the app hidden at login (scripts/build.ts).
  extraFiles:
    - from: build/LaunchAgents
      to: Library/LaunchAgents
  # Privacy usage descriptions: the microphone (dictation, voice chats and
  # meeting recordings) and system-audio recording (a meeting recording that
  # includes the computer's audio); macOS asks about each when the person first
  # starts one. Electron's own Info.plist also declares the camera and
  # Bluetooth; nothing in the app uses them, the window refuses them
  # (packages/desktop/src/main/web-permissions.ts), so a null removes each key.
  # Screen Recording and Accessibility (App-shots, computer use) need no key and
  # are asked for only from Settings. See apps/desktop/test/mac-privacy.test.ts.
  extendInfo:
    NSMicrophoneUsageDescription: Opengeni uses the microphone when you dictate, talk to an agent or record a meeting.
    NSAudioCaptureUsageDescription: Opengeni records your computer's audio, such as the other people in a call, when you include it in a meeting recording.
    NSCameraUsageDescription: null
    NSBluetoothAlwaysUsageDescription: null
    NSBluetoothPeripheralUsageDescription: null
  notarize: true
dmg:
  writeUpdateInfo: false
win:
  target:
    - target: nsis
      arch: [x64, arm64]
  icon: resources/icon.png
nsis:
  oneClick: true
  perMachine: false
  artifactName: Opengeni-${version}-windows-${arch}.${ext}
linux:
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
    - target: rpm
      arch: [x64, arm64]
  icon: resources/linux-icons
  category: Development
  executableName: opengeni
  artifactName: Opengeni-${version}-linux-${arch}.${ext}
  synopsis: Work with your agents from the desktop
  description: Opengeni for Linux. Chat with agents, follow sessions and the inbox, and let agents use this computer.
  # Debian packages need a maintainer; there is no maintainer mailbox.
  maintainer: Opengeni
  vendor: Opengeni
  desktop:
    entry:
      Name: Opengeni
      Comment: Work with your agents
      MimeType: x-scheme-handler/opengeni;
      StartupWMClass: opengeni
