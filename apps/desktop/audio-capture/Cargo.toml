[package]
name = "opengeni-audio-capture"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Records the audio other apps play (system audio) for the Opengeni desktop app's meeting recorder, as raw PCM on stdout."
publish = false

[[bin]]
name = "opengeni-audio-capture"
path = "src/main.rs"

[dependencies]

[target.'cfg(target_os = "macos")'.dependencies]
cidre = { version = "0.29", default-features = false, features = ["core_audio", "dispatch", "blocks", "macos_14_2"] }
libloading = "0.9"

[target.'cfg(target_os = "windows")'.dependencies]
wasapi = "0.26"

[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.9"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
