# Project name comes from COMPOSE_PROJECT_NAME (set by scripts/dev-stack.sh per
# worktree). Do not hardcode `name:` here — that forces every checkout to share
# one Postgres/NATS/Temporal/object-storage volume set.

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: opengeni
      POSTGRES_USER: opengeni
      POSTGRES_PASSWORD: opengeni
    ports:
      - "${OPENGENI_POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opengeni -d opengeni"]
      interval: 5s
      timeout: 5s
      retries: 20

  nats:
    image: nats:2-alpine
    command: ["-c", "/etc/nats/opengeni.conf"]
    ports:
      - "${OPENGENI_NATS_HOST_PORT:-4222}:4222"
      - "${OPENGENI_NATS_MONITOR_HOST_PORT:-8222}:8222"
    volumes:
      - "${OPENGENI_NATS_CONFIG_FILE:-./deploy/nats/local-development.conf}:/etc/nats/opengeni.conf:ro"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 20

  temporal:
    image: temporalio/auto-setup:1.28
    environment:
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
      NO_PROXY: "localhost,127.0.0.1,postgres,temporal,frontend,history,matching,worker"
      no_proxy: "localhost,127.0.0.1,postgres,temporal,frontend,history,matching,worker"
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: opengeni
      POSTGRES_PWD: opengeni
      POSTGRES_SEEDS: postgres
      BIND_ON_IP: 0.0.0.0
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/docker.yaml
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${OPENGENI_TEMPORAL_HOST_PORT:-7233}:7233"

  garage:
    image: dxflrs/garage:v2.3.0@sha256:866bd13ed2038ba7e7190e840482bc27234c4afaf77be8cfa439ae088c1e4690
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: GK0123456789abcdef0123456789abcdef
      GARAGE_DEFAULT_SECRET_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      GARAGE_DEFAULT_BUCKET: opengeni-files
    ports:
      - "${OPENGENI_GARAGE_HOST_PORT:-3900}:3900"
    volumes:
      - ./deploy/garage/local.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  garage-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      garage:
        condition: service_healthy
    environment:
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
      NO_PROXY: "localhost,127.0.0.1,garage"
      no_proxy: "localhost,127.0.0.1,garage"
    volumes:
      - ./deploy/garage/cors.xml:/cors.xml:ro
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "for i in $$(seq 1 30); do
         mc alias set local http://garage:3900 GK0123456789abcdef0123456789abcdef 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef &&
         mc cors set local/opengeni-files /cors.xml &&
         exit 0;
         sleep 2;
       done;
       exit 1"

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: ["minio"]
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "${OPENGENI_MINIO_HOST_PORT:-9000}:9000"
      - "${OPENGENI_MINIO_CONSOLE_HOST_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    profiles: ["minio"]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      all_proxy: ""
      NO_PROXY: "localhost,127.0.0.1,minio"
      no_proxy: "localhost,127.0.0.1,minio"
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "for i in $$(seq 1 30); do
         mc alias set local http://minio:9000 minioadmin minioadmin &&
         mc mb --ignore-existing local/opengeni-files &&
         exit 0;
         sleep 2;
       done;
       exit 1"

volumes:
  postgres-data:
  garage-meta:
  garage-data:
  minio-data:
