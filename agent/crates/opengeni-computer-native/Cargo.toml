[package]
name = "opengeni-computer-native"
description = "Native AX/AT-SPI computer adapter used by the placement-local OpenGeni computer controller."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = { workspace = true }
arboard = { workspace = true }
base64 = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "io-std", "macros", "process", "rt", "rt-multi-thread", "sync", "time"] }
uuid = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
atspi = { workspace = true }
async-lock = { workspace = true }
async-signal = { workspace = true }
image = { workspace = true }
indexmap = { workspace = true }
opengeni-agent-platform = { path = "../opengeni-agent-platform" }
opengeni-agent-proto = { path = "../opengeni-agent-proto" }
proc-macro-crate = { workspace = true }
x11rb = { workspace = true }
zbus = { workspace = true }
zvariant = { workspace = true }
zvariant_utils = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
image = { workspace = true }
opengeni-agent-macos-ffi = { path = "../opengeni-agent-macos-ffi" }

[dev-dependencies]
image = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
