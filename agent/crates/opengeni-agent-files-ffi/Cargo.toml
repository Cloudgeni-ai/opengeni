[package]
name = "opengeni-agent-files-ffi"
description = "Descriptor-based native filesystem metadata inspection behind a safe API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# Native ACL inspection needs a small audited FFI boundary. The platform and
# all other callers retain the workspace-wide unsafe_code = forbid policy.
[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
doc_markdown = "allow"
