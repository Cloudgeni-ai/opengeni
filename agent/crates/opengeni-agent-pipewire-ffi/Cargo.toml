[package]
name = "opengeni-agent-pipewire-ffi"
description = "Leaf FFI that receives compositor screen-cast frames from the session PipeWire daemon."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# This leaf crate is the complete audited unsafe boundary for PipeWire video
# capture. libpipewire is loaded at runtime (never linked), so X11-only hosts and
# statically linked builds keep working and report a typed unavailable error.
[lints.rust]
missing_docs = "warn"
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
doc_markdown = "allow"

[dependencies]
thiserror = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
