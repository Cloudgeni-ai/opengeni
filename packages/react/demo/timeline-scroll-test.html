    <title>Timeline scroll regression</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
      body {
        background: #f4f6f8;
        color: #18212f;

      .timeline-test-shell {
        display: flex;

      [data-timeline-row] {
        border: 1px solid #d7dde5;

        padding: 8px;
