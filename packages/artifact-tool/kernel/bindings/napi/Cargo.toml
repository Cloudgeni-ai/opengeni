[package]
name = "opengeni-artifact-kernel-napi"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Node-API byte adapter for the OpenGeni artifact kernel"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
noop = ["napi/noop", "napi-derive/noop"]

[dependencies]
napi = { version = "3.12.0", default-features = false, features = ["dyn-symbols", "napi8"] }
napi-derive = "3.6.2"
opengeni-artifact-kernel-binding-protocol = { path = "../protocol" }

[build-dependencies]
napi-build = "2.4.0"

[dev-dependencies]
sha2 = "0.10.9"
opengeni-artifact-kernel = { path = "../.." }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
