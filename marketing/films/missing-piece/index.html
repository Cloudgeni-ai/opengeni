<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OpenGeni — The Missing Piece</title>
    <style>
      @font-face {
        font-family: "Archivo";
        src: url("assets/fonts/Archivo.woff2") format("woff2");
        font-weight: 100 900;
        font-stretch: 62% 125%;
        font-display: block;
      }
      @font-face {
        font-family: "DM Sans";
        src: url("assets/fonts/DMSans.woff2") format("woff2");
        font-weight: 100 1000;
        font-display: block;
      }
      @font-face {
        font-family: "JetBrains Mono";
        src: url("assets/fonts/JetBrainsMono.woff2") format("woff2");
        font-weight: 100 800;
        font-display: block;
      }
      @font-face {
        font-family: "Inter";
        src: url("assets/fonts/Inter.woff2") format("woff2");
        font-weight: 100 900;
        font-display: block;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: #1d1d1b;
      }
      body.render {
        background: #f4f3ec;
        overflow: hidden;
      }
      * {
        box-sizing: border-box;
      }
      #root {
        -webkit-font-smoothing: antialiased;
        text-rendering: geometricPrecision;
        font-kerning: normal;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="dist/main.js"></script>
  </body>
</html>
