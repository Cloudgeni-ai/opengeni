# Optional independent operator job; never uses application/runtime credentials.
# Retains latest nightly + a Sunday weekly checkpoint. See docs/backups.md.
backup:
  enabled: false
  schedule: "15 3 * * *"
  checkSchedule: "0 12 * * *"
  timeZone: UTC
  existingSecret: ""
  existingClaim: ""
  image:
    repository: opengeni-backup
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent

global:
  # Default to the public GHCR images so a vanilla `helm install` pulls the
  # released Opengeni images with no extra config. Per-cloud example values
  # override this with their own registry. The image tags below are left empty
  # and resolve to the chart appVersion (see the opengeni.image helper).
  imageRegistry: "ghcr.io/cloudgeni-ai"
  imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  name: ""
  annotations: {}
  automountServiceAccountToken: false

# Optional read-only, same-cluster Kubernetes inventory for the OpenSandbox
# backend. These values are inert unless config.OPENGENI_SANDBOX_BACKEND is
# exactly "opensandbox". The control worker receives one explicit projected
# token; the ServiceAccount's global automount default remains false.
opensandbox:
  kubernetesInventory:
    enabled: true
    namespace: opensandbox

# Optional release-local Pod priority tiers. They do not reserve or cap CPU or
# memory. They tell the kubelet which Opengeni roles to evict first when the
# node is under pressure. `Never` keeps priority from preempting a running pod
# merely to admit another one.
priorityClasses:
  enabled: false
  preemptionPolicy: Never
  tiers:
    presentation:
      value: 1000
      description: Restartable browser and live-stream presentation.
    execution:
      value: 2000
      description: Restartable turn execution with durable Temporal recovery.
    control:
      value: 3000
      description: API, machine transport, and orchestration control.
    durable:
      value: 4000
      description: Durable database, workflow, object storage, and upgrade gates.

networkPolicy:
  enabled: false
  egress:
    enabled: false
    # Environment-specific rules appended after Opengeni's canonical recording
    # and alert rules. This list never replaces the built-in safety catalog.
    rules: []
  ingressController:
    namespaceSelector: {}
    podSelector: {}
  # Optional: allow a metrics scraper (Prometheus) to reach GET /metrics on the
  # relay's internal relay.metricsPort (its wss port when that is null) and the
  # API's internal api.metricsPort, and on computeControl.metrics.port. Leave
  # unset to omit those rules (the relay has no other ingress source than the
  # ingress controller). When the
  # kube-prometheus ServiceMonitor scrapes from a separate namespace, set both
  # selectors here.
  monitoring: {}
    # namespaceSelector:
    #   matchLabels:
    #     kubernetes.io/metadata.name: monitoring
    # podSelector: {}

config:
  # Bun uses mimalloc. Immediate decommit returns unused native JSON/network
  # arenas to Linux instead of retaining a long turn's peak RSS indefinitely.
  # Set PURGE_DELAY=-1 to restore allocator-default retention if throughput on
  # a particular host matters more than resident memory.
  MIMALLOC_PURGE_DELAY: "0"
  MIMALLOC_PURGE_DECOMMITS: "1"
  OPENGENI_SERVICE_NAME: opengeni
  OPENGENI_ENVIRONMENT: production
  OPENGENI_DEPLOYMENT_REVISION: dev
  OPENGENI_API_HOST: 0.0.0.0
  OPENGENI_API_PORT: "8000"
  OPENGENI_WORKER_HTTP_PORT: "8001"
  OPENGENI_TEMPORAL_NAMESPACE: default
  OPENGENI_TEMPORAL_TASK_QUEUE: opengeni-runs-ts
  OPENGENI_STARTUP_DEPENDENCY_RETRY_ATTEMPTS: "30"
  OPENGENI_STARTUP_DEPENDENCY_RETRY_INITIAL_DELAY_MS: "1000"
  OPENGENI_STARTUP_DEPENDENCY_RETRY_MAX_DELAY_MS: "5000"
  OPENGENI_AUTH_REQUIRED: "false"
  OPENGENI_AUTH_ALLOW_HEALTH: "true"
  OPENGENI_AUTH_ALLOW_METRICS: "false"
  # Client source address for every API rate limit and auth session record.
  # "0" keys on the transport peer and ignores X-Forwarded-For. Behind
  # ingress-nginx whose controller Service uses externalTrafficPolicy: Local,
  # with direct API access blocked (networkPolicy.enabled), set "1". See
  # docs/deployment.md "API request source and auth rate limits". Optionally
  # restrict the trusted proxy to the controller's address range with
  # OPENGENI_API_TRUSTED_PROXY_CIDRS (comma-separated CIDRs).
  OPENGENI_API_TRUSTED_PROXY_HOPS: "0"
  OPENGENI_WEB_ALLOWED_HOSTS: ""
  OPENGENI_PRODUCT_ACCESS_MODE: local
  # Rolling-safe default. First deploy the compatible web handler, dedicated
  # setup-account Ingress, and SPA query fallback everywhere. In a later
  # release/config change, set this to "query" for mail-gateway-compatible
  # invitation links. See docs/deployment.md before rollback.
  OPENGENI_ORGANIZATION_USER_SETUP_EMAIL_TOKEN_TRANSPORT: fragment
  # Query transport additionally requires a separately proven controller/edge
  # error-log policy. Access-log and OpenTelemetry annotations do not sanitize
  # ingress-nginx's error_log request line. Query mode also requires the chart's
  # dedicated setupAccountIngress to remain enabled so the request cannot fall
  # through the ordinarily logged/traced primary Ingress.
  OPENGENI_ORGANIZATION_USER_SETUP_QUERY_EDGE_SANITIZATION_CONFIRMED: "false"
  # See docs/deployment.md.
  OPENGENI_BILLING_MODE: disabled
  # The offer and both new resource charges require separate operator activation.
  OPENGENI_VERIFIED_SIGNUP_TRIAL_CREDITS_ENABLED: "false"
  OPENGENI_SANDBOX_WARM_BILLING_MODE: usage_only
  OPENGENI_SANDBOX_WARM_RATE_MICROS_PER_SECOND_JSON: '{}'
  OPENGENI_DOCUMENT_EMBEDDING_BILLING_MODE: usage_only
  OPENGENI_DOCUMENT_EMBEDDING_CREDITS_ACTIVATED_AT: ""
  OPENGENI_DOCUMENT_EMBEDDING_RATE_MICROS_PER_MILLION_BYTES: "0"
  OPENGENI_ENTITLEMENTS_MODE: none
  OPENGENI_USAGE_LIMITS_MODE: none
  # Reviewed code/env catalog by default. Before changing this to "database",
  # apply the drained maintenance migration
  # 0389_model_catalog_and_gateway_custom_models.sql and follow the
  # compatibility-first catalog cutover in docs/deployment.md; do not expose
  # database-only membership during a mixed code/database rollout.
  OPENGENI_MODEL_CATALOG_SOURCE: code
  # Optional non-secret JSON values may be supplied here:
  # OPENGENI_MODEL_COST_POLICY_JSON: '{"model-id":"free"}'
  # OPENGENI_MODEL_NOTES_JSON: '{"model-id":"One-line agent guidance."}'
  # Code-mode replacement for the managed Gateway/OpenRouter/Opper model lists
  # (catalog-document entry schemas, no pricing; ignored in database mode).
  # See docs/model-providers.md "Code-mode managed model lists":
  # OPENGENI_MANAGED_MODELS_JSON: '{"opperModels":[{"upstreamModelId":"aws/claude-opus-5-5",...}]}'
  # Default for new work while an organization holds Opengeni credits and has
  # no connected subscription (see docs/model-providers.md):
  # OPENGENI_CREDITS_DEFAULT_MODEL: gpt-6-luna
  # OPENGENI_CREDITS_DEFAULT_REASONING_EFFORT: xhigh
  OPENGENI_STATIC_ENTITLEMENTS_JSON: "{}"
  OPENGENI_STATIC_USAGE_LIMITS_JSON: "{}"
  OPENGENI_OBJECT_STORAGE_BACKEND: s3-compatible
  OPENGENI_OBJECT_STORAGE_BUCKET: opengeni-files
  OPENGENI_OBJECT_STORAGE_REGION: us-east-1
  OPENGENI_OBJECT_STORAGE_S3_PROVIDER: Other
  OPENGENI_OBJECT_STORAGE_FORCE_PATH_STYLE: "true"
  OPENGENI_SANDBOX_BACKEND: modal
  OPENGENI_SANDBOX_PREPARATION_PROFILES: none

# Digest-pinned Modal Computer/Browser box. Defaults to Opengeni's public image
# and overwrites config.OPENGENI_MODAL_IMAGE_REF. Override it with another image
# built from docker/desktop.Dockerfile, never the headless opengeni-sandbox image.
desktop:
  imageRef: "opengenipublicneuacr.azurecr.io/opengeni-desktop@sha256:5bb54a1a6d0c6e99f058290718e55c13193fde3dcbcb54568ce95ddef0768805"

secret:
  create: false
  existingSecret: opengeni-runtime
  # Provide OPENGENI_ACCESS_KEY for deployment shared-key access.
  # Provide OPENGENI_DELEGATION_SECRET for managed deployments and configured
  # deployments without shared-key auth. Configured shared-key deployments may
  # reuse OPENGENI_ACCESS_KEY; local mode has a local-only default.
  # Provide Better Auth, Resend, Stripe, GitHub App, model-provider, database,
  # NATS, Temporal, sandbox, and object-storage secrets through this secret or
  # an ExternalSecret. Never commit real secrets in values.
  # OPENGENI_OPENROUTER_API_KEY enables the deployment-managed reviewed
  # OpenRouter catalog. It belongs here, never in config or catalog JSON.
  # OPENGENI_OPPER_API_KEY likewise enables the reviewed Opper catalog
  # (default: Claude Opus 5.5 EU).
  # Google Drive release-readiness configuration is demonstrated in
  # values.google-drive-readiness.example.yaml. When enabled, this Secret must
  # provide OPENGENI_INTEGRATIONS_STATE_SECRET,
  # OPENGENI_ENVIRONMENTS_ENCRYPTION_KEY, OPENGENI_GOOGLE_DRIVE_CLIENT_ID, and
  # OPENGENI_GOOGLE_DRIVE_CLIENT_SECRET. Never pass those values through Helm
  # values or command-line --set arguments.
  # For Temporal Cloud, configure OPENGENI_TEMPORAL_HOST and
  # OPENGENI_TEMPORAL_NAMESPACE, then place OPENGENI_TEMPORAL_API_KEY in this
  # secret; the API key automatically enables TLS.
  #
  # Bring-your-own-compute (selfhosted) SECRET keys — set these in the runtime
  # secret (NOT this file) when selfhosted.enabled=true. They thread into the
  # api/worker via `envFrom: secretRef`, into the relay via explicit secretKeyRef,
  # and into the chart-managed NATS via env-var expansion:
  #   OPENGENI_ENROLLMENT_SIGNING_SECRET        HMAC the control plane signs the
  #                                             `oge_` enrollment bearer with and
  #                                             the callout responder verifies it
  #                                             with (falls back to
  #                                             OPENGENI_DELEGATION_SECRET).
  #   OPENGENI_STREAM_TOKEN_SECRET              HMAC the relay verifies the viewer
  #                                             `ogs_` stream token with (already
  #                                             used by sandbox workspace).
  #   OPENGENI_SELFHOSTED_RELAY_TOKEN_SECRET    HMAC the relay verifies the agent
  #                                             `ogr_` producer token with (may be
  #                                             omitted to reuse the stream secret).
  #   OPENGENI_SELFHOSTED_NATS_CALLOUT_ACCOUNT_SEED   the callout account SEED the
  #                                             control plane signs user JWTs with.
  #   OPENGENI_SELFHOSTED_NATS_CALLOUT_PUBLIC_KEY     the PUBLIC half of the seed —
  #                                             the nats-server callout `issuer`.
  #   OPENGENI_SELFHOSTED_NATS_CONTROL_PASSWORD       the control-plane NATS login.
  #   OPENGENI_SELFHOSTED_NATS_CALLOUT_PASSWORD       the callout responder login.
  stringData: {}

externalSecret:
  enabled: false
  apiVersion: external-secrets.io/v1
  refreshInterval: 1h
  secretStoreRef:
    name: ""
    kind: ClusterSecretStore
  target:
    creationPolicy: Owner
    deletionPolicy: Retain
  data: []
  dataFrom: []

api:
  # Kubernetes EnvVars for the API only; not inherited by hooks/web/artifact roles.
  extraEnv: []
  # Additional Kubernetes volumes and mounts for the API container (for example TLS Secrets).
  extraVolumes: []
  extraVolumeMounts: []
  enabled: true
  replicaCount: 2
  # Surge a replacement before removing a serving pod so capacity never drops during a
  # rollout, and drain each terminating pod (preStop) before the server stops.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  image:
    repository: opengeni-api
    # Empty tag resolves to the chart appVersion via the opengeni.image helper.
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  containerPort: 8000
  # Dedicated internal Prometheus listener (OPENGENI_API_METRICS_PORT). GET
  # /metrics is then served only here, never on containerPort, so an ingress
  # that forwards every path to the API cannot publish it. It gets its own
  # ClusterIP Service (never a NodePort) for the ServiceMonitor and scrape
  # annotations. Set null to keep the legacy /metrics on containerPort.
  metricsPort: 9464
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 2Gi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  podAnnotations: {}
  priorityClassName: ""
  terminationGracePeriodSeconds: 30
  # Seconds a terminating pod keeps serving in-flight requests after it leaves the Service
  # endpoints and before SIGTERM. 0 omits the hook (clusters older than k8s 1.30).
  preStopDrainSeconds: 10
  topologySpreadConstraints:
    enabled: true
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
  nodeSelector: {}
  tolerations: []
  affinity: {}
  probes:
    readiness:
      enabled: true
      path: /traffic-readyz
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
    liveness:
      enabled: true
      path: /healthz
      initialDelaySeconds: 20
      periodSeconds: 20
      timeoutSeconds: 2
      failureThreshold: 3
    startup:
      enabled: false
      path: /healthz
      periodSeconds: 5
      failureThreshold: 30
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  service:
    type: ClusterIP
    port: 8000
    # Optional fixed NodePort for single-node/private-edge deployments.
    nodePort: null
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

worker:
  # Kubernetes EnvVars shared by control and turn workers only.
  extraEnv: []
  # Shared by control and turn workers; appended to any built-in volumes and mounts.
  extraVolumes: []
  extraVolumeMounts: []
  enabled: true
  image:
    repository: opengeni-worker
    # Empty tag resolves to the chart appVersion via the opengeni.image helper.
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  command: []
  containerPort: 8001
  control:
    replicaCount: 2
    priorityClassName: ""
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 1
        maxUnavailable: 0
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
    podDisruptionBudget:
      enabled: true
      minAvailable: 1
    autoscaling:
      enabled: false
      minReplicas: 2
      maxReplicas: 6
      targetCPUUtilizationPercentage: 70
      targetMemoryUtilizationPercentage: null
      customMetrics: []
      behavior: {}
  turns:
    replicaCount: 4
    priorityClassName: ""
    # Surge a replacement before removing an old pod, so turn capacity never
    # drops while old pods drain their in-flight turns.
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 1
        maxUnavailable: 0
    # Kubernetes grace for turn pods; null uses worker.terminationGracePeriodSeconds.
    # A draining turn worker stops polling at once, lets in-flight turns finish
    # naturally for shutdown.graceSeconds, then cancels the rest with
    # WORKER_SHUTDOWN (recoverable checkpoint), force-stops at
    # shutdown.forceSeconds and exits within 10s of that, before this grace.
    terminationGracePeriodSeconds: null
    shutdown:
      # null derives both from the pod grace, keeping 15s between each phase:
      # force = grace period - 15, natural drain = force - 15 (90s / 105s at
      # the default 120s). Explicit values must keep the natural drain at least
      # 10s before the force time and the force time more than 10s before the
      # pod grace. A key in `config` owns that variable instead.
      graceSeconds: null
      forceSeconds: null
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 4Gi
    podDisruptionBudget:
      enabled: true
      # Bound voluntary eviction to one turn pod. This does not govern HPA or
      # Deployment deletion and does not guarantee checkpoint completion.
      maxUnavailable: 1
    autoscaling:
      enabled: false
      minReplicas: 4
      maxReplicas: 20
      targetCPUUtilizationPercentage: 70
      targetMemoryUtilizationPercentage: null
      # Requires a custom.metrics.k8s.io adapter that maps the per-pod
      # Prometheus gauge under this exact name. Leave disabled otherwise: an
      # unavailable metric makes the HPA report ScalingActive=False.
      slotSaturationMetric:
        enabled: false
        name: opengeni_turn_slot_saturation_ratio
        targetAverageValue: "750m"
      # Schema-v1 source contract. Requires the new SDK all-activity producer,
      # Prometheus Operator, UID-complete kube-state-metrics and a verified
      # Namespace custom.metrics adapter. Adds demand8/queued8/busy1 alongside
      # CPU70/memory80/agent-inflight8; fixes up0,+4/30s and disables downscale.
      # This target is experimental, not demonstrated mixed-activity capacity.
      queueDemand:
        enabled: false
        schemaVersion: 1
        targetAverageValue: "8"
      customMetrics: []
      behavior: {}
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  podAnnotations: {}
  priorityClassName: ""
  # Worker shutdown stops polling at once. Turn workers then let in-flight
  # turns finish naturally (default 90s, worker.turns.shutdown) before the
  # recoverable WORKER_SHUTDOWN checkpoint and force-stop at 105s; control
  # workers keep 5s natural completion and a 100s force time. Both exit before
  # this 120s Kube grace. The checkpoint does not prove writer quiescence:
  # forced termination may leave uncertain writers and delayed receipt-gated
  # recovery. See docs/worker-autoscaling.md before enabling downscale.
  terminationGracePeriodSeconds: 120
  topologySpreadConstraints:
    enabled: true
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
  nodeSelector: {}
  tolerations: []
  affinity: {}
  probes:
    readiness:
      enabled: true
      path: /readyz
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
    liveness:
      enabled: true
      path: /healthz
      initialDelaySeconds: 20
      periodSeconds: 20
      timeoutSeconds: 2
      failureThreshold: 3
  service:
    type: ClusterIP
    port: 8001

# Native, isolated Office-file materialization. This is a distinct workload,
# database identity, executable, and image; it never runs inside turn/control
# workers. Its selected credentials Secret must provide
# OPENGENI_ARTIFACT_MATERIALIZER_DATABASE_URL for the dedicated
# opengeni_artifact_materializer login. Only that URL and the selected optional
# object-storage credential keys are projected; ordinary application secrets are
# never inherited. Disabled until an immutable per-platform artifact runtime
# bundle has been built into the materializer image.
artifactMaterializer:
  enabled: false
  replicaCount: 1
  # null preserves the cluster default. false selects a pod user namespace;
  # node kernel/runtime support is required. See docs/deployment.md before
  # selecting procMount: Unmasked or a node-local AppArmor profile.
  hostUsers: null
  # Defaults to secret.existingSecret for backward-compatible secret ownership,
  # while still projecting only these dedicated keys into the workload.
  credentialsSecret: ""
  databaseUrlSecretKey: OPENGENI_ARTIFACT_MATERIALIZER_DATABASE_URL
  objectStorageAccessKeyIdSecretKey: OPENGENI_OBJECT_STORAGE_ACCESS_KEY_ID
  objectStorageSecretAccessKeySecretKey: OPENGENI_OBJECT_STORAGE_SECRET_ACCESS_KEY
  objectStorageAzureConnectionStringSecretKey: OPENGENI_OBJECT_STORAGE_AZURE_CONNECTION_STRING
  objectStorageAzureAccountNameSecretKey: OPENGENI_OBJECT_STORAGE_AZURE_ACCOUNT_NAME
  objectStorageAzureAccountKeySecretKey: OPENGENI_OBJECT_STORAGE_AZURE_ACCOUNT_KEY
  objectStorageGcsCredentialsJsonSecretKey: OPENGENI_OBJECT_STORAGE_GCS_CREDENTIALS_JSON
  image:
    repository: opengeni-artifact-materializer
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  containerPort: 9465
  batchSize: 8
  concurrency: 2
  leaseMs: 120000
  renewMs: 30000
  pollMs: 1000
  maxAttempts: 20
  childMemoryBytes: 536870912
  childCpuMs: 60000
  childOpenFiles: 64
  childProcesses: 64
  childFileBytes: 536870912
  wallMs: 120000
  maxSourceBytes: 536870912
  maxOutputBytes: 536870912
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 4Gi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  podAnnotations: {}
  priorityClassName: ""
  terminationGracePeriodSeconds: 150
  nodeSelector: {}
  tolerations: []
  affinity: {}
  probes:
    readiness:
      enabled: true
      path: /readyz
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    liveness:
      enabled: true
      path: /healthz
      initialDelaySeconds: 20
      periodSeconds: 20
      timeoutSeconds: 3
      failureThreshold: 3
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  service:
    type: ClusterIP
    port: 9465

# Durable transaction/snapshot live-hint delivery. This is a distinct process,
# image, and database identity. Its selected credentials Secret must provide
# OPENGENI_ARTIFACT_OUTBOX_DATABASE_URL for the dedicated
# opengeni_artifact_outbox_dispatcher login.
artifactOutboxDispatcher:
  enabled: false
  replicaCount: 1
  # Defaults to secret.existingSecret. Only the dedicated database URL and the
  # optional NATS control password are projected into this process.
  credentialsSecret: ""
  databaseUrlSecretKey: OPENGENI_ARTIFACT_OUTBOX_DATABASE_URL
  natsControlPasswordSecretKey: OPENGENI_SELFHOSTED_NATS_CONTROL_PASSWORD
  image:
    repository: opengeni-artifact-outbox-dispatcher
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  containerPort: 9466
  databasePoolSize: 4
  batchSize: 32
  concurrency: 8
  leaseMs: 30000
  renewMs: 10000
  pollMs: 500
  publishTimeoutMs: 5000
  retryBaseMs: 500
  retryMaxMs: 60000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  podAnnotations: {}
  priorityClassName: ""
  terminationGracePeriodSeconds: 60
  nodeSelector: {}
  tolerations: []
  affinity: {}
  probes:
    readiness:
      enabled: true
      path: /readyz
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
    liveness:
      enabled: true
      path: /healthz
      initialDelaySeconds: 20
      periodSeconds: 20
      timeoutSeconds: 2
      failureThreshold: 3
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
  service:
    type: ClusterIP
    port: 9466

web:
  enabled: true
  # Server-side target for the public React reference demo's same-origin
  # /demo-api proxy. Empty uses this release's in-cluster API service when the
  # API is enabled; set an explicit http(s) URL only for split deployments.
  demoApiBaseUrl: ""
  # Optional dedicated Secret containing `api-key` and/or `access-key` data
  # entries. It is mounted read-only; do not reuse the full runtime Secret.
  demoApiCredentialsSecret: ""
  replicaCount: 2
  # Surge a replacement before removing a serving pod so capacity never drops during a
  # rollout, and drain each terminating pod (preStop) before the server stops.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  image:
    repository: opengeni-web
    # Empty tag resolves to the chart appVersion via the opengeni.image helper.
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  containerPort: 3000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  podAnnotations: {}
  priorityClassName: ""
  terminationGracePeriodSeconds: 30
  # Seconds a terminating pod keeps serving in-flight requests after it leaves the Service
  # endpoints and before SIGTERM. 0 omits the hook (clusters older than k8s 1.30).
  preStopDrainSeconds: 10
  # Keep serving the content-hashed assets (lazy route chunks, stylesheets) of
  # previous web builds after a rollout, so a tab still running an older build
  # does not fail to load them. Each previous image runs once per pod as an init
  # container that copies its asset directories into a pod-local emptyDir; the
  # server answers an asset it lacks from there, newest build first. `helm
  # upgrade` finds the previous images by looking up the live web Deployment:
  # its image plus the images it already carried (annotation
  # opengeni.ai/previous-web-images). Offline renders (`helm template`) cannot
  # look up, so they carry nothing unless `images` is set; `helm rollback`
  # restores the earlier revision's chain. Every new web pod (scale-ups, node
  # replacement) pulls the carried images, so keep them in the registry. During
  # the rollout itself see ingress.webAssetsIngress.
  previousAssets:
    enabled: true
    # Most previous builds carried, newest first. 0 disables carrying.
    maxImages: 2
    # Explicit previous web image references, newest first, for offline
    # renders. A non-empty list replaces the live lookup; it is still
    # de-duplicated, capped at maxImages and never includes the deployed image.
    images: []
    # Where a web image keeps its built dist.
    distPath: /app/apps/web/dist
    # Optional size limit for the shared emptyDir, for example 1Gi. Empty
    # leaves it unbounded.
    sizeLimit: ""
  topologySpreadConstraints:
    enabled: true
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
  nodeSelector: {}
  tolerations: []
  affinity: {}
  probes:
    readiness:
      enabled: true
      path: /
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
    liveness:
      enabled: true
      path: /
      initialDelaySeconds: 20
      periodSeconds: 20
      timeoutSeconds: 2
      failureThreshold: 3
    startup:
      enabled: false
      path: /
      periodSeconds: 5
      failureThreshold: 30
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  service:
    type: ClusterIP
    port: 3000
    # Optional fixed NodePort for single-node/private-edge deployments.
    nodePort: null
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

# Bring-your-own-compute stream relay. A stateless wss byte
# pump: the agent (producer) and the viewer (consumer) both dial IN over wss
# through the ingress, and the relay splices their pty/desktop streams. It holds
# NO cluster state and makes NO cluster egress. Disabled by default — the whole
# selfhosted feature is flag-gated off (see config.OPENGENI_SANDBOX_SELFHOSTED_ENABLED)
# so existing deploys are unaffected. Enable together with the ingress relay host,
# nats.authCallout, and the runtime-secret keys below.
relay:
  enabled: false
  replicaCount: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  image:
    repository: opengeni-relay
    # Empty tag resolves to the chart appVersion via the opengeni.image helper.
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  # The wss listener port. The container, service targetPort, and the relay's
  # OPENGENI_RELAY_BIND all derive from this single value.
  containerPort: 8443
  # Dedicated internal Prometheus listener (OPENGENI_RELAY_METRICS_BIND). GET
  # /metrics is then served only here, never on containerPort, so an ingress
  # that forwards every path of the public relay host cannot publish it. It gets
  # its own ClusterIP Service (never a NodePort) for the ServiceMonitor and
  # scrape annotations. Must differ from containerPort. Requires a relay image
  # from this chart's release or later (an older relay ignores the bind and its
  # scrape target goes down). Set null to keep the legacy /metrics on
  # containerPort, including when pinning an older relay image.
  metricsPort: 9464
  # The runtime-secret keys the relay's two HMAC token secrets are read from.
  # The producer (ogr_) secret falls back to the viewer (ogs_) stream-token secret
  # inside the relay when the relay key is absent, so a single OPENGENI_STREAM_TOKEN_SECRET
  # can back both planes.
  streamTokenSecretKey: OPENGENI_STREAM_TOKEN_SECRET
  relayTokenSecretKey: OPENGENI_SELFHOSTED_RELAY_TOKEN_SECRET
  # Non-secret relay tuning knobs (defaults match the relay binary's own defaults).
  tuning:
    ringFrames: 1024
    spliceBuffer: 256
    rateBurstBytes: 16777216
    rateBytesPerSec: 8388608
    pairTimeoutSecs: 120
  extraEnv: []
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
  podSecurityContext:
    runAsNonRoot: true
    # The distroless:nonroot base runs as uid/gid 65532.
    runAsUser: 65532
    runAsGroup: 65532
    fsGroup: 65532
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
  podAnnotations: {}
  priorityClassName: ""
  # In-flight streams drain on SIGTERM (the relay's own handler stops the listener
  # then drains). Give the pod real room so resumable streams keep splicing through
  # a rolling deploy / node drain. The preStop sleep holds the pod past the
  # endpoints-controller propagation so the ingress stops sending NEW dials first.
  terminationGracePeriodSeconds: 120
  preStopDrainSeconds: 15
  topologySpreadConstraints:
    enabled: true
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: ScheduleAnyway
  # Optional dedicated node pool for the relay edge (values-gated, default off for
  # staging — the relay co-schedules on the platform nodes). Set both to pin the
  # relay to an isolated, internet-facing edge pool.
  nodeSelector: {}
  tolerations: []
  affinity: {}
  probes:
    readiness:
      enabled: true
      path: /healthz
      initialDelaySeconds: 3
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
    liveness:
      enabled: true
      path: /healthz
      initialDelaySeconds: 10
      periodSeconds: 20
      timeoutSeconds: 2
      failureThreshold: 3
  podDisruptionBudget:
    enabled: true
    minAvailable: 1
  service:
    type: ClusterIP
    port: 8443
    # Optional fixed NodePort for single-node/private-edge deployments.
    nodePort: null
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    # The relay is bandwidth/connection bound more than CPU bound; memory is a
    # second cheap signal that needs no metrics adapter. For connection-count or
    # bytes-spliced scaling, wire customMetrics (needs a Prometheus adapter).
    targetMemoryUtilizationPercentage: 80
    customMetrics: []
    behavior: {}

# Kubernetes deletes each finished one-shot chart Job (migrate, catalog-import,
# and the disposable object-storage initializers) and its pods this many seconds
# after it completes or fails. Helm hooks already delete succeeded hook Jobs;
# this bounds the failed ones, which otherwise linger until the next hook run.
# Keep it long enough to read a failed Job's logs. null (or 0) omits the
# field, so finished Jobs are kept until something else deletes them.
jobTtlSecondsAfterFinished: 86400

migrations:
  enabled: true
  priorityClassName: ""
  image:
    repository: opengeni-api
    # Empty tag resolves to the chart appVersion via the opengeni.image helper.
    # Production and every drained maintenance rollout must also set an exact
    # sha256 digest; never cross the drain boundary using a mutable tag/cache.
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  secret:
    # Separate secret for migration/admin-only settings:
    # OPENGENI_MIGRATIONS_DATABASE_URL, the comma-separated exact API/worker
    # login list OPENGENI_MIGRATION_APPLICATION_DATABASE_ROLES, plus the exact
    # application username/password consumed by db:provision-roles. During a
    # role rotation, include old and new identities in the login list only for
    # drain detection; the exact application username/password names the sole
    # target role provisioned after migration. Maintenance migrations 0402,
    # 0403, and 0404 require this complete list even when MCP OAuth stays disabled.
    # Production must not reuse the runtime Secret here; API/worker receive only
    # the restricted URL.
    # Empty reuse is retained only for disposable conformance fixtures.
    existingSecret: ""
  # The pre-upgrade hook is the rollout gate: schema first, then exact runtime
  # grants, then a connection through the restricted runtime identity. Helm
  # does not begin replacing API/worker pods unless all three steps succeed.
  # Job-scoped config (and chart-managed runtime Secret) snapshots follow these
  # hook events at weight -1 relative to this Job, using incoming release values.
  # Externally managed Secrets must be updated before invoking Helm.
  command:
    - /bin/sh
    - -ec
    - bun run db:migrate && bun run db:provision-roles && bun run db:assert-runtime-posture
  backoffLimit: 6
  annotations:
    helm.sh/hook: post-install,pre-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    helm.sh/hook-weight: "-5"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Import the reviewed, committed integrations snapshot into the global
# capability catalog after installs and upgrades. The importer fingerprints the
# snapshot and exits without database or object-storage writes when that exact
# revision has already completed successfully.
catalogImport:
  enabled: true
  snapshotPath: /app/data/catalog/integrations-snapshot.json
  # Skip network logo fetches for the uncurated long tail so deployment success
  # stays independent of hundreds of third-party logo hosts. Curated connectors
  # still get their logos: the importer copies the vendored assets committed
  # under data/catalog/logos/ into object storage regardless of this flag. Set
  # false to also fetch, validate, and self-host the long tail during import.
  skipLogos: true
  backoffLimit: 3
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    # Migrations use -5 and the disposable MinIO bucket initializer uses 5.
    helm.sh/hook-weight: "10"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Embedded Postgres for disposable conformance stacks and the persistent non-HA
# single-machine profile. Multi-node deployments should use managed Postgres,
# an existing database, or an upstream Postgres operator.
postgres:
  enabled: false
  priorityClassName: ""
  image:
    repository: pgvector/pgvector
    # PostgreSQL 18 on Debian bookworm: the same OS release (and so the same
    # glibc collations) as the earlier pg17 default, which keeps text indexes
    # valid across an in-place upgrade.
    tag: pg18-bookworm
    pullPolicy: IfNotPresent
  # In-place major-version upgrade of an existing data directory. A data
  # directory from an older major refuses to start until this is enabled (or
  # postgres.image.tag is set back to that major). When enabled, an init
  # container runs pg_upgrade --link from fromImage's binaries, keeps the old
  # directory beside the new one as pgdata.pre-upgrade-from-<major>, and then
  # starts the new server. Plan a short outage and a backup first. fromImage
  # must be the old major on the same OS release as postgres.image, and every
  # extension library the old databases use must exist in postgres.image.
  # Before Helm changes the StatefulSet, a pre-upgrade hook Job rehearses the
  # upgrade: it copies the running server's schema (no rows) into a scratch
  # cluster of the old major and runs the new pg_upgrade --check against it.
  # If the check fails, the release fails and the running server keeps
  # serving; the Job's log names the objects to change.
  # After the upgrade, run `vacuumdb --all --analyze-in-stages
  # --missing-stats-only`, then `vacuumdb --all --analyze-only`, and ALTER
  # EXTENSION ... UPDATE for each extension, then turn this off again.
  majorUpgrade:
    enabled: false
    fromImage:
      repository: pgvector/pgvector
      tag: pg17
    preflight:
      activeDeadlineSeconds: 1800
      resources: {}
  auth:
    database: opengeni
    username: opengeni
    password: opengeni
    existingSecret: ""
    passwordKey: POSTGRES_PASSWORD
  runtime:
    # When set, API/worker/migration Jobs read the restricted runtime URL from
    # this Secret instead of constructing an owner URL from postgres.auth.
    existingSecret: ""
    databaseUrlKey: OPENGENI_DATABASE_URL
  # Server settings, as `postgres` arguments, for example
  # ["-c", "max_connections=400"] when Temporal, the API, the workers and
  # computeControl share this server.
  args: []
  service:
    port: 5432
  persistence:
    enabled: true
    size: 20Gi
    storageClassName: ""
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi
  podSecurityContext:
    fsGroup: 999
  securityContext: {}
  # PostgreSQL server settings passed as `-c name=value`, in name order. Empty
  # keeps the image defaults, which suit only small disposable stacks; a
  # persistent single-node install should size memory and planner settings for
  # its host, for example:
  #   max_connections: 200
  #   shared_buffers: 4GB
  #   effective_cache_size: 12GB
  #   random_page_cost: 1.1
  #   shared_preload_libraries: pg_stat_statements
  # Raise postgres.resources.limits.memory with shared_buffers.
  parameters: {}

# Embedded Temporal for disposable conformance stacks and the persistent non-HA
# single-machine profile. Multi-node deployments should use Temporal Cloud, an
# existing Temporal endpoint, or the official Temporal chart.
temporal:
  enabled: false
  priorityClassName: ""
  image:
    repository: temporalio/auto-setup
    tag: "1.28"
    pullPolicy: IfNotPresent
  service:
    port: 7233
  postgres:
    host: ""
    port: 5432
    username: opengeni
    existingSecret: ""
    passwordKey: POSTGRES_PASSWORD
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi
  podSecurityContext:
    runAsNonRoot: false
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL

# Embedded MinIO for disposable conformance stacks and an explicit opt-in
# object-storage fixture. Multi-node deployments should use Azure Blob, AWS S3,
# GCS, or another external object store. Enable at most one of garage or minio.
minio:
  enabled: false
  priorityClassName: ""
  image:
    repository: minio/minio
    tag: RELEASE.2025-09-07T16-13-09Z
    pullPolicy: IfNotPresent
  mcImage:
    repository: minio/mc
    tag: RELEASE.2025-08-13T08-35-41Z
    pullPolicy: IfNotPresent
  auth:
    rootUser: minioadmin
    rootPassword: minioadmin
    existingSecret: ""
    accessKeyKey: MINIO_ROOT_USER
    secretKeyKey: MINIO_ROOT_PASSWORD
  bucket: opengeni-files
  publicEndpoint: ""
  sandboxEndpoint: ""
  corsAllowOrigin: ""
  service:
    apiPort: 9000
    consolePort: 9001
  # Optional one-port edge service. Keep the ordinary MinIO service private;
  # this exposes only the signed object API, never the admin console.
  edgeService:
    enabled: false
    type: ClusterIP
    nodePort: null
  persistence:
    enabled: true
    size: 20Gi
    storageClassName: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

# Embedded Garage for local Compose, the persistent non-HA single-machine
# profile, and local-Kubernetes smoke. This is the same fixture class as MinIO:
# not production HA object storage. Chart default remains off. Enable at most
# one of garage or minio. The image has no shell; garage.toml is mounted.
garage:
  enabled: false
  priorityClassName: ""
  image:
    repository: dxflrs/garage
    tag: v2.3.0
    digest: sha256:866bd13ed2038ba7e7190e840482bc27234c4afaf77be8cfa439ae088c1e4690
    pullPolicy: IfNotPresent
  corsImage:
    repository: curlimages/curl
    tag: "8.16.0"
    digest: sha256:463eaf6072688fe96ac64fa623fe73e1dbe25d8ad6c34404a669ad3ce1f104b6
    pullPolicy: IfNotPresent
  auth:
    accessKey: GK0123456789abcdef0123456789abcdef
    secretKey: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    rpcSecret: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    existingSecret: ""
    accessKeyKey: GARAGE_ACCESS_KEY_ID
    secretKeyKey: GARAGE_SECRET_ACCESS_KEY
    rpcSecretKey: GARAGE_RPC_SECRET
  bucket: opengeni-files
  publicEndpoint: ""
  sandboxEndpoint: ""
  service:
    apiPort: 3900
  # Optional one-port edge service. Keep RPC/admin/web private; this exposes
  # only the signed object API.
  edgeService:
    enabled: false
    type: ClusterIP
    nodePort: null
  persistence:
    enabled: true
    metaSize: 1Gi
    size: 20Gi
    storageClassName: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: opengeni.local
      paths:
        - path: /
          pathType: Prefix
          service: web
          # Optional. Defaults to the http service port. Set to api for MinIO/S3-compatible preview bucket paths.
          portName: http
        - path: /v1
          pathType: Prefix
          service: api
        - path: /healthz
          pathType: Exact
          service: api
        # The self-hosted agent install surface (get.<domain>). The API serves the
        # committed install scripts AND the per-SHA baked opengeni-agent binaries
        # from /agent/*; these MUST route to api, not fall through to the web SPA.
        # The install bodies + agent binaries carry no secrets and are auth-exempt.
        - path: /install.sh
          pathType: Exact
          service: api
        - path: /install.ps1
          pathType: Exact
          service: api
        - path: /uninstall.sh
          pathType: Exact
          service: api
        - path: /opengeni-agent-minisign.pub
          pathType: Exact
          service: api
        - path: /agent
          pathType: Prefix
          service: api
        # Desktop app downloads: the installer and redirects to the release.
        - path: /desktop
          pathType: Prefix
          service: api
  tls: []
  # Managed invitation emails use a query bearer because mail security
  # gateways may discard URL fragments. A separate exact route lets
  # ingress-nginx disable access logs and request tracing while the first inline
  # browser bootstrap rejects ambiguity and scrubs the URL. These annotations
  # do not sanitize ingress-nginx error_log output; query activation separately
  # requires proven controller/edge error-log handling. This map is for the
  # required deployment-specific mitigation and other annotations.
  setupAccountIngress:
    # Required when setup email token transport is "query". Disabling this
    # while query mode is selected aborts rendering with an operator error.
    enabled: true
    annotations: {}
  # Exact API routes for the workspace MCP OAuth protocol paths that live at
  # the issuer origin root (/.well-known/oauth-*, /oauth/*). Rendered for every
  # ingress host that already routes to the API, only while
  # config.OPENGENI_MCP_OAUTH_ENABLED is true. Gated deployments that protect
  # the primary Ingress with auth annotations must repeat them here.
  mcpOAuthIngress:
    enabled: true
    annotations: {}
  # During a web rollout old and new web pods serve side by side and every
  # request is balanced separately, so a page from one build can ask a pod of
  # the other build for a hashed asset it does not have. This extra Ingress
  # routes only the hashed asset paths (/assets, /office/assets,
  # /react-demo/assets) of hosts that already send them to the web service, and
  # has ingress-nginx retry a 404, connection error or timeout on another web
  # pod. It balances through its own `<release>-web-assets` Service with EWMA,
  # which never retries an endpoint the request already tried while an untried
  # one remains. It keeps the primary Ingress class, TLS and rendered
  # annotations, except cert-manager, external-dns, canary, rewrite-target,
  # app-root, server-snippet and server-alias annotations; `annotations` here
  # are applied last.
  webAssetsIngress:
    enabled: true
    # Render only when ingress.className contains "nginx". Set false to render
    # it for an ingress-nginx controller registered under another class name.
    requireNginxClassName: true
    # Attempts for one asset request, including the first. Keep it above the
    # most web pods of one build that can serve at once during a rollout
    # (replicas, or the autoscaler maximum): a page of the new build may first
    # try every old pod.
    nextUpstreamTries: 3
    annotations: {}
  # A SECOND, un-gated Ingress for the same host(s) that exposes ONLY the
  # unauthenticated-by-design public paths. Used by edge-gated deployments
  # (e.g. the preview environment, whose primary Ingress sits behind nginx
  # basic-auth) so that a fresh, un-credentialed machine can still
  # `curl -fsSL https://<host>/install.sh | sh` and complete device-flow
  # enrollment, while the web app and the rest of the API stay gated.
  #
  # ingress-nginx merges Ingresses by host and applies auth per location, so the
  # more-specific paths listed here win and are served WITHOUT the primary
  # Ingress's auth annotations. Keep this set MINIMAL — anything added here is
  # publicly reachable. Disabled by default (only edge-gated deployments need it).
  publicIngress:
    enabled: false
    # No auth annotations here by design. cert-manager / proxy tuning may be set
    # by the deployment if this Ingress owns its own TLS entry (otherwise it
    # shares the primary Ingress's already-issued host cert).
    annotations: {}
    hosts:
      - host: opengeni.local
        paths:
          # Installer scripts + the pinned minisign public key (served verbatim,
          # no secrets) — the `curl | sh` entry point and its trust root.
          - path: /install.sh
            pathType: Exact
            service: api
          - path: /install.ps1
            pathType: Exact
            service: api
          - path: /uninstall.sh
            pathType: Exact
            service: api
          - path: /opengeni-agent-minisign.pub
            pathType: Exact
            service: api
          # Release-asset redirects the installer follows (302 → GitHub Releases).
          - path: /agent/latest
            pathType: Prefix
            service: api
          - path: /agent/v
            pathType: Prefix
            service: api
          # Desktop app downloads (installer + release redirects, no secrets).
          - path: /desktop
            pathType: Prefix
            service: api
          # Device-flow enrollment BOOTSTRAP endpoints a not-yet-credentialed
          # machine calls (POST). The user-authenticated approve/list/revoke
          # routes live under different paths and stay on the gated Ingress.
          - path: /v1/enrollments/device/start
            pathType: Exact
            service: api
          - path: /v1/enrollments/device/poll
            pathType: Exact
            service: api
    tls: []

# Embedded NATS for disposable conformance stacks and the persistent non-HA
# single-machine profile. Multi-node deployments should use an existing NATS
# endpoint or the official NATS chart.
nats:
  enabled: false
  priorityClassName: ""
  url: ""
  image:
    repository: nats
    tag: "2-alpine"
    pullPolicy: IfNotPresent
  replicaCount: 1
  clientPort: 4222
  monitorPort: 8222
  # Optional one-port edge service. Keep the ordinary NATS client and monitor
  # ports private; connected machines need only the websocket listener.
  websocketEdgeService:
    enabled: false
    type: ClusterIP
    nodePort: null
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  # The bring-your-own-compute tenancy boundary (M-AUTH; NATS
  # Accounts + §17). When enabled, the chart-managed nats fixture runs the
  # auth-callout config (deploy/nats/auth-callout.conf is the version-controlled
  # source of truth) with a websocket listener the agents dial over wss through
  # the ingress. The control plane (api/worker) + the callout responder
  # authenticate directly with the control/auth users; every enrolled agent is
  # delegated to the callout responder, which mints a per-workspace-scoped user
  # JWT. The secret VALUES (callout issuer public key, control/auth passwords)
  # come from the runtime secret via env-var expansion — never the configmap.
  #
  # Multi-node deployments typically run NATS outside this chart
  # (nats.enabled=false) and fold the SAME auth-callout.conf into the platform
  # NATS StatefulSet. This block is also the supported single-machine broker.
  authCallout:
    enabled: false
    # The websocket listener port (TLS terminates at the ingress; no_tls here).
    websocketPort: 8443
    websocketSameOrigin: false
    # The shared application account + the two direct-auth users. Match the
    # control-plane env (OPENGENI_SELFHOSTED_NATS_CALLOUT_ACCOUNT_NAME / _USER /
    # _CONTROL_USER) and the responder's expectations.
    account: APP
    controlUser: control
    calloutUser: auth
    # The runtime-secret keys the callout issuer public key + the two passwords
    # are read from. The issuer is the PUBLIC half of the callout account seed
    # (OPENGENI_SELFHOSTED_NATS_CALLOUT_ACCOUNT_SEED); the chart wires the public
    # key (not the seed) into nats-server. The control plane separately holds the
    # seed (to sign user JWTs) via the runtime secret read by the api/worker.
    calloutPublicKeySecretKey: OPENGENI_SELFHOSTED_NATS_CALLOUT_PUBLIC_KEY
    controlPasswordSecretKey: OPENGENI_SELFHOSTED_NATS_CONTROL_PASSWORD
    calloutPasswordSecretKey: OPENGENI_SELFHOSTED_NATS_CALLOUT_PASSWORD

# Idle-session archive (docs/session-storage-lifecycle.md). On by default.
# The control worker moves the bulky content of sessions that
# have been quiet for idleDays to the configured object storage as a verified
# bundle and purges it from PostgreSQL. Archived sessions stay readable but are
# read-only; sessions marked keep-live, waiting on a person, a timer, a queue or
# a schedule are never archived. Requires object storage; set enabled: false to
# keep every session in PostgreSQL.
sessionArchive:
  enabled: true
  idleDays: 30

# Bring-your-own-compute (selfhosted SandboxBackend) NON-SECRET wiring threaded
# into the api/worker configmap. The SECRET values live in the runtime secret
# (see the DEPLOY NOTES / secret keys below). Disabled by default so existing
# deploys are completely unaffected. To enable the feature end-to-end set
# selfhosted.enabled=true, relay.enabled=true, nats.authCallout.enabled=true (or
# point at an external NATS with the callout config), add the ingress relay+nats
# hosts, and provision the runtime-secret keys.
selfhosted:
  enabled: false
  # The public wss URLs the agent dials (must match the ingress hosts below).
  natsUrl: ""   # e.g. wss://nats.opengeni.ai
  relayUrl: ""  # e.g. wss://relay.opengeni.ai
  # The NATS callout account + user NAMES the control plane uses (must match the
  # nats.authCallout block). Non-secret; the seeds/passwords are in the secret.
  natsCalloutAccountName: APP
  natsControlUser: control
  natsCalloutUser: auth

# Optional control service of Opengeni compute, Opengeni's own sandbox system (compute/ in
# this repository): compute-control, which owns compute's hosts, places and
# moves sandboxes, and serves the API the `compute` sandbox backend calls.
# Disabled by default; enabling it changes no session's backend
# (config.OPENGENI_SANDBOX_BACKEND stays as set). The hosts themselves run
# outside the cluster (compute/deploy). See compute/docs/operations.md.
computeControl:
  enabled: false
  replicaCount: 2
  priorityClassName: ""
  image:
    repository: opengeni-compute-control
    # Required when enabled: the compute release tags (sha-<commit>, a
    # compute version) are not the chart's appVersion. Production pins the
    # digest as well.
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  # The service's store: its own schema and login role in Opengeni's
  # Postgres, which hold nothing of Opengeni's and are granted nothing of it.
  database:
    # Secret holding the role's password (passwordKey), or a whole
    # connection string (urlKey) for a database the chart does not run.
    # The password reaches the service in a variable of its own, so any
    # password works unquoted.
    existingSecret: ""
    passwordKey: COMPUTE_DATABASE_PASSWORD
    urlKey: ""
    # Pods read the password only at start: after changing it in the
    # Secret, raise the revision (a whole number) so the upgrade rolls them
    # and runs a new database Job, which gives the role the new password;
    # the new pods wait for it before they start. A Job of a lower revision
    # never sets the role's password after a higher one's has.
    passwordRevision: 0
    role: compute
    schema: compute
    # Defaults: the chart's Postgres, its database, and sslmode disable.
    # host is required when the chart runs no Postgres.
    host: ""
    port: 5432
    name: ""
    sslmode: ""
    # A Job creates the role (login, password from the Secret, search path
    # the schema) and the schema it owns, with the migration owner URL
    # (OPENGENI_MIGRATIONS_DATABASE_URL in the migration Secret), as an
    # ordinary resource of the release, never a hook: the service's pods
    # wait until the role can log in with their password. Only for the
    # chart's own Postgres; turn it off for any other database, or where a
    # DBA provisions them.
    provision: true
    connections: 16
  # Keys of the API, one `team key` per line, from a Secret's `keys` entry.
  # Opengeni's compute backend uses one of them (OPENGENI_COMPUTE_API_KEY in
  # the runtime Secret); the operator team's keys manage hosts.
  keys:
    existingSecret: ""
    key: keys
  operatorTeam: operator
  # The URL hosts reach the service at (https://name:port), exactly as they
  # are given it (the Terraform module's control_url): the service's own
  # certificate is for its host name, and hosts' identity tokens are for
  # this URL.
  hostUrl: ""
  # Mutual TLS with the hosts. The service is the hosts' certificate
  # authority: the Secret holds the authority's certificate (ca.crt) and
  # key (ca.key, PKCS#8 PEM), as the Terraform module's host_authority_pem
  # and host_authority_key_pem outputs or `compute-control
  # new-host-authority` make them. ca.crt may hold further authorities after
  # the first, trusted beside it while one is rotated out. The service
  # issues its own short-lived certificate from it, for hostUrl's host and
  # extraNames, and renews it in memory.
  hostsTls:
    secretName: ""
    extraNames: []
  # Google Compute Engine instances of this project, running as this
  # service account, get host certificates for their own instance name by
  # proving it with an instance identity token (the Terraform module's
  # identity_tokens output). Empty: hosts renew only with their current
  # certificate, and first certificates come from `compute-control
  # issue-host-certificate`.
  hostIdentity:
    gcpProject: ""
    gcpAccount: ""
  # HTTPS for the public API (tls.crt, tls.key naming apiTls.host, and the
  # ca.crt that signed it), required outside local development: Opengeni
  # sends the API key to it and refuses plain HTTP there. When set, the API,
  # control-worker and turn-worker pods trust ca.crt (NODE_EXTRA_CA_CERTS)
  # and OPENGENI_COMPUTE_API_URL is https://<apiTls.host>:<apiPort>.
  apiTls:
    secretName: ""
    # Default: the API Service's cluster name, <name>.<namespace>.svc.
    host: ""
  # Agent links (ADR 21): the Ed25519 key (PKCS#8 PEM) the service signs
  # hosts' link tokens with, from a Secret's `link.pem` entry, never baked
  # into an image; `openssl genpkey -algorithm ed25519` makes one. Keys
  # being rotated out stay verifiable as previousKeys entries of the same
  # Secret. Empty: no agent links, and teamLinks must be empty.
  link:
    existingSecret: ""
    key: link.pem
    previousKeys: []
    issuer: opengeni-compute
  # Each team's agent gateway, the Opengeni API's public WSS endpoint, for
  # example {opengeni: "wss://opengeni.example.com/v1/compute/agent-link"}.
  # Hosts dial it, so it must be reachable from them with a certificate
  # they trust.
  teamLinks: {}
  # The team this release's own compute backend belongs to: the team of its
  # OPENGENI_COMPUTE_API_KEY. Its teamLinks entry is also the release's
  # OPENGENI_COMPUTE_LINK_URL, the audience of its hosts' link tokens, so
  # the two never differ.
  opengeniTeam: opengeni
  # Where hosts archive sandboxes (gs://bucket/prefix, az://, s3://). The
  # service reads stored copies' pointers there; credentials come from the
  # pod's identity (serviceAccount.annotations, such as GKE Workload
  # Identity) or the environment. Off Google Cloud, mount a service account
  # key through extraVolumes and extraVolumeMounts and name it in
  # GOOGLE_APPLICATION_CREDENTIALS through extraEnv: the archive, gcpGroup
  # and the sweep all use it.
  archive: ""
  # The image creates start from when they name none, and the stored images
  # creates may name (name: image id, as `compute-host build-image` prints).
  defaultImage: base
  storedImages: {}
  diskMib: 1024
  # Grow and fence a GCP managed instance group of hosts:
  # projects/P/zones/Z/instanceGroupManagers/N. Empty: hosts are added and
  # removed by hand, and a lost host is fenced only by its own guard.
  gcpGroup: ""
  # How the service grows gcpGroup. hostMemoryMib, the memory a new host
  # offers sandboxes (the Terraform module's host_memory_mib output), is
  # required with gcpGroup; min and max bound the group's size. Other
  # --scale-* flags go in extraArgs.
  scaling:
    hostMemoryMib: 0
    min: 1
    max: 10
  # Further `compute-control serve` flags, for example --scale-* settings
  # or the E2B front door's --e2b-* ones.
  extraArgs: []
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  serviceAccount:
    # A ServiceAccount of its own, for the cloud identity that reads the
    # archive and manages the host group; nothing else in the chart uses it.
    create: true
    name: ""
    annotations: {}
  service:
    # Opengeni's API and workers call the API here, in the cluster.
    apiPort: 8080
  metrics:
    # The service's metrics, GET /metrics in Prometheus's text format, on
    # this port of its pods and of the API Service (never the hosts
    # Service), for example 9464. observability.serviceMonitor.enabled
    # scrapes it, and networkPolicy.monitoring admits the scraper. null (the
    # default): no metrics.
    port: null
    # Where the service passes its hosts' metrics on to: an OTLP/HTTP
    # metrics endpoint that takes JSON, such as Prometheus's OTLP receiver
    # (http://<prometheus>:9090/api/v1/otlp/v1/metrics, with the receiver
    # turned on; deploy/observability does). Hosts send them over their
    # mutual TLS with the service when they run with
    # --otlp-metrics-to-control, so they need no route or credentials of
    # their own to the store. With networkPolicy.egress.enabled, the egress
    # rules must admit this endpoint. Empty: the service refuses hosts'
    # metrics, and the host alerts are left out.
    hostsTo: ""
  hostsService:
    # Hosts dial this endpoint from outside the cluster: a LoadBalancer
    # (annotations for an internal one) or a NodePort.
    type: ClusterIP
    port: 8443
    nodePort: null
    annotations: {}
    loadBalancerSourceRanges: []
  # The store's daily sweep (`compute-host sweep --delete`, ADR 17), from the
  # same image, with the same identity. Deleting sweeps are for Google Cloud
  # Storage archives only: turn it off for az:// and s3://.
  sweep:
    enabled: true
    schedule: "17 3 * * *"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
  podSecurityContext: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Optional self-hosted HashiCorp Terraform MCP server. Agents reach it by adding
# an OPENGENI_MCP_SERVERS entry that points at
# http://<fullname>-terraform-mcp:8080/mcp, then selecting it for a session with
# an explicit {kind:mcp,id} ToolRef. This is Terraform Registry docs only; no
# Terraform Enterprise token is wired.
terraformMcp:
  enabled: false
  image:
    repository: hashicorp/terraform-mcp-server
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

observability:
  structuredLogs: true
  metrics:
    enabled: true
    path: /metrics
  serviceMonitor:
    # Optional Prometheus Operator ServiceMonitors for api/worker/relay. The
    # template is also guarded on monitoring.coreos.com/v1 being installed.
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    labels: {}
    annotations: {}
  prometheusRule:
    # Optional Prometheus Operator starter alerts. The template is also guarded
    # on monitoring.coreos.com/v1 being installed.
    enabled: false
    # Must cover at least three configured sandbox reaper periods; Helm rejects
    # an incompatible pairing before generating a rule that would age out live data.
    inventoryFreshnessSeconds: 300
    # Cumulative p95 startup SLOs, measured from the durable turn queue time.
    # Keep these aligned with the canonical Turn Startup dashboard annotations.
    turnStartupQueueP95Seconds: 5
    # Accepted turn -> first provider dispatch is Opengeni-owned latency, so it
    # gets tight tiers: a warning (investigate) and a paging critical tier that
    # replaces it. Normal p95 is a few seconds.
    turnStartupProviderDispatchP95Seconds: 20
    turnStartupProviderDispatchCriticalP95Seconds: 60
    turnStartupFirstByteP95Seconds: 120
    # Exclusive logical-turn first-byte completions divided by completed plus
    # terminal failed-without-byte milestones over the alert window. A failed
    # turn after dispatch reduces availability instead of disappearing from
    # latency quantiles; later tool-loop failures cannot downgrade a success.
    turnStartupFirstByteAvailabilityRatio: 0.95
    turnStartupMinSamples: 5
    # Per model request: SDK model entry -> literal provider dispatch (admission,
    # durable history/audit checkpoints, credit revalidation). Ours; sub-second
    # when healthy.
    modelRequestPreDispatchP95Seconds: 2
    modelRequestMinSamples: 20
    # Provider time-to-first-token (dispatch -> first streamed delta) alerts only
    # relative to that provider's own trailing 24h p90, never on an absolute
    # number: the 30m p90 must exceed ratio x baseline AND the floor, with
    # enough recent and baseline requests.
    providerTtftRegressionRatio: 2
    providerTtftRegressionFloorSeconds: 5
    providerTtftRecentMinSamples: 30
    providerTtftBaselineMinSamples: 200
    labels: {}
    annotations: {}
    rules: []
  otel:
    enabled: false
    endpoint: ""
  collector:
    enabled: false
    # Appended to the collector's built-in config volume and mount.
    extraVolumes: []
    extraVolumeMounts: []
    image:
      repository: otel/opentelemetry-collector-contrib
      tag: "0.139.0"
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    config: ""
