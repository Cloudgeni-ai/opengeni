# Non-secret Google Drive release-readiness overlay. This file enables only the
# application configuration contract; it does not create a Google OAuth app,
# call Google APIs, deploy workloads, or prove live acceptance.

config:
  OPENGENI_INTEGRATIONS_ENABLED: "true"
  OPENGENI_PUBLIC_BASE_URL: https://api.example.com
  OPENGENI_WEB_BASE_URL: https://app.example.com

  # One frozen source run remains bounded even when a Drive is unexpectedly
  # large or Google is returning transient errors.
  OPENGENI_GOOGLE_DRIVE_SYNC_MAX_ITEMS: "500"
  OPENGENI_GOOGLE_DRIVE_SYNC_MAX_BYTES: "500000000"
  OPENGENI_GOOGLE_DRIVE_SYNC_MAX_FILE_BYTES: "100000000"
  OPENGENI_GOOGLE_DRIVE_SYNC_MAX_PROVIDER_REQUESTS: "1000"
  OPENGENI_GOOGLE_DRIVE_SYNC_MAX_ELAPSED_SECONDS: "300"
  OPENGENI_GOOGLE_DRIVE_SYNC_MAX_FAILURE_DETAILS: "25"

  # Short in-activity retries absorb only transport failures, HTTP 429, and
  # HTTP 5xx responses. The durable Temporal retry remains authoritative after
  # this budget is exhausted.
  OPENGENI_GOOGLE_DRIVE_PROVIDER_REQUEST_TIMEOUT_MS: "30000"
  OPENGENI_GOOGLE_DRIVE_PROVIDER_RETRY_ATTEMPTS: "3"
  OPENGENI_GOOGLE_DRIVE_PROVIDER_RETRY_INITIAL_DELAY_MS: "250"
  OPENGENI_GOOGLE_DRIVE_PROVIDER_RETRY_MAX_DELAY_MS: "5000"
  OPENGENI_GOOGLE_DRIVE_PROVIDER_RETRY_BUDGET_MS: "15000"

observability:
  structuredLogs: true
  metrics:
    enabled: true
  serviceMonitor:
    enabled: true
  prometheusRule:
    enabled: true

secret:
  create: false
  existingSecret: opengeni-runtime
  # The referenced Secret must contain all four keys below. Never place their
  # values in this file or another committed values file:
  #   OPENGENI_INTEGRATIONS_STATE_SECRET
  #   OPENGENI_ENVIRONMENTS_ENCRYPTION_KEY
  #   OPENGENI_GOOGLE_DRIVE_CLIENT_ID
  #   OPENGENI_GOOGLE_DRIVE_CLIENT_SECRET