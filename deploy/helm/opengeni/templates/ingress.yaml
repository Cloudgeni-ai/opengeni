{{- if and (eq .Values.config.OPENGENI_ORGANIZATION_USER_SETUP_EMAIL_TOKEN_TRANSPORT "query") (ne (toString .Values.config.OPENGENI_ORGANIZATION_USER_SETUP_QUERY_EDGE_SANITIZATION_CONFIRMED) "true") }}
{{- fail "config.OPENGENI_ORGANIZATION_USER_SETUP_QUERY_EDGE_SANITIZATION_CONFIRMED must be true before enabling setup-account query transport" }}
{{- end }}
{{- if and (eq .Values.config.OPENGENI_ORGANIZATION_USER_SETUP_EMAIL_TOKEN_TRANSPORT "query") (not .Values.ingress.setupAccountIngress.enabled) }}
{{- fail "ingress.setupAccountIngress.enabled must be true before enabling setup-account query transport; otherwise /setup-account falls through the primary Ingress logging and tracing policy" }}
{{- end }}
{{- $setupAccountHosts := list }}
{{- range .Values.ingress.hosts }}
  {{- $host := . }}
  {{- $hasWebRoute := false }}
  {{- range .paths }}
    {{- if eq .service "web" }}
      {{- $hasWebRoute = true }}
    {{- end }}
  {{- end }}
  {{- if $hasWebRoute }}
    {{- $setupAccountHosts = append $setupAccountHosts $host }}
  {{- end }}
{{- end }}
{{- if and .Values.ingress.enabled (or .Values.api.enabled .Values.web.enabled) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "opengeni.fullname" . }}
  labels:
    {{- include "opengeni.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "opengeni.fullname" $ }}-{{ .service }}
                port:
                  name: {{ .portName | default "http" }}
          {{- end }}
    {{- end }}
{{- end }}
{{- if and .Values.ingress.enabled .Values.ingress.setupAccountIngress.enabled .Values.web.enabled (eq .Values.config.OPENGENI_PRODUCT_ACCESS_MODE "managed") (gt (len $setupAccountHosts) 0) }}
---
# A dedicated exact setup route suppresses ingress-nginx access logs and request
# traces. It does not sanitize the controller error_log; query activation is
# separately gated on an operator-proven controller/edge policy. The protected
# HTML shell scrubs query/fragment authority in its first inline head script.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "opengeni.fullname" . }}-setup-account
  labels:
    {{- include "opengeni.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/enable-access-log: "false"
    nginx.ingress.kubernetes.io/enable-opentelemetry: "false"
    {{- with omit (.Values.ingress.setupAccountIngress.annotations | default dict) "nginx.ingress.kubernetes.io/enable-access-log" "nginx.ingress.kubernetes.io/enable-opentelemetry" }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range $setupAccountHosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          - path: /setup-account
            pathType: Exact
            backend:
              service:
                name: {{ include "opengeni.fullname" $ }}-web
                port:
                  name: http
    {{- end }}
{{- end }}
{{- if and .Values.ingress.enabled .Values.ingress.publicIngress.enabled (or .Values.api.enabled .Values.web.enabled) }}
---
# A SECOND Ingress for the SAME host(s) that exposes ONLY the
# unauthenticated-by-design public paths (the self-host installer scripts +
# minisign pubkey, the release-asset redirect prefixes, and the device-flow
# enrollment BOOTSTRAP endpoints a not-yet-credentialed machine calls).
#
# It deliberately carries NO `nginx.ingress.kubernetes.io/auth-*` annotations.
# ingress-nginx merges Ingresses by host and applies auth per server-location,
# so these more-specific un-gated locations win for EXACTLY these paths while the
# primary Ingress keeps everything else (the web app, /v1/config/client, the
# /device approval page, the rest of /v1) behind its basic-auth gate. This
# mirrors how prod `get.opengeni.ai` serves these same assets ungated.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "opengeni.fullname" . }}-public
  labels:
    {{- include "opengeni.labels" . | nindent 4 }}
  {{- with .Values.ingress.publicIngress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- with .Values.ingress.publicIngress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.publicIngress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "opengeni.fullname" $ }}-{{ .service }}
                port:
                  name: {{ .portName | default "http" }}
          {{- end }}
    {{- end }}
{{- end }}
{{- $mcpOAuthEnabled := has (lower (trim (toString (.Values.config.OPENGENI_MCP_OAUTH_ENABLED | default "false")))) (list "true" "1" "yes" "y" "on") }}
{{- $mcpOAuthHosts := list }}
{{- range .Values.ingress.hosts }}
  {{- $host := . }}
  {{- $hasApiRoute := false }}
  {{- range .paths }}
    {{- if eq .service "api" }}
      {{- $hasApiRoute = true }}
    {{- end }}
  {{- end }}
  {{- if $hasApiRoute }}
    {{- $mcpOAuthHosts = append $mcpOAuthHosts $host }}
  {{- end }}
{{- end }}
{{- if and .Values.ingress.enabled .Values.ingress.mcpOAuthIngress.enabled .Values.api.enabled $mcpOAuthEnabled (gt (len $mcpOAuthHosts) 0) }}
---
# Workspace MCP OAuth publishes its authorization-server metadata, protected-
# resource metadata, registration, authorization, and token endpoints at the
# issuer origin root, outside /v1. Without these exact API routes the primary
# Ingress sends them to the web application, which answers HTML and breaks MCP
# client discovery. Rendered only while OPENGENI_MCP_OAUTH_ENABLED is true.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "opengeni.fullname" . }}-mcp-oauth
  labels:
    {{- include "opengeni.labels" . | nindent 4 }}
  {{- with .Values.ingress.mcpOAuthIngress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range $mcpOAuthHosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          - path: /.well-known/oauth-authorization-server
            pathType: Prefix
            backend:
              service:
                name: {{ include "opengeni.fullname" $ }}-api
                port:
                  name: http
          - path: /.well-known/oauth-protected-resource
            pathType: Prefix
            backend:
              service:
                name: {{ include "opengeni.fullname" $ }}-api
                port:
                  name: http
          {{- range list "/oauth/register" "/oauth/authorize" "/oauth/token" }}
          - path: {{ . }}
            pathType: Exact
            backend:
              service:
                name: {{ include "opengeni.fullname" $ }}-api
                port:
                  name: http
          {{- end }}
    {{- end }}
{{- end }}
{{- $webAssets := .Values.ingress.webAssetsIngress | default dict }}
{{- /* ingress-nginx merges every entry for one host, so judge each host as a whole. */}}
{{- $webAssetHosts := list }}
{{- $webAssetHostPaths := dict }}
{{- range .Values.ingress.hosts }}
  {{- /* A host-less entry is a catch-all rule; key it as "" and render no host. */}}
  {{- $hostName := .host | default "" | toString }}
  {{- if not (hasKey $webAssetHostPaths $hostName) }}
    {{- $webAssetHosts = append $webAssetHosts $hostName }}
    {{- $_ := set $webAssetHostPaths $hostName list }}
  {{- end }}
  {{- $_ := set $webAssetHostPaths $hostName (concat (get $webAssetHostPaths $hostName) (.paths | default list)) }}
{{- end }}
{{- $webAssetRules := list }}
{{- range $hostName := $webAssetHosts }}
  {{- $assetPaths := list }}
  {{- range $assetPath := list "/assets" "/office/assets" "/react-demo/assets" }}
    {{- /* The longest prefix route that matches this asset path today. */}}
    {{- $winner := dict }}
    {{- $winnerLength := -1 }}
    {{- range (get $webAssetHostPaths $hostName) }}
      {{- $prefix := trimSuffix "/" (toString .path) }}
      {{- if and (has (toString .pathType) (list "Prefix" "ImplementationSpecific")) (hasPrefix (printf "%s/" $prefix) (printf "%s/" $assetPath)) (gt (len $prefix) $winnerLength) }}
        {{- $winner = . }}
        {{- $winnerLength = len $prefix }}
      {{- end }}
    {{- end }}
    {{- /* Only a shorter web route is refined; an explicit asset route is left as is. */}}
    {{- if and (eq (toString $winner.service) "web") (lt $winnerLength (len $assetPath)) }}
      {{- $assetPaths = append $assetPaths (dict "path" $assetPath) }}
    {{- end }}
  {{- end }}
  {{- if $assetPaths }}
    {{- $webAssetRules = append $webAssetRules (dict "host" $hostName "paths" $assetPaths) }}
  {{- end }}
{{- end }}
{{- $primaryIngressAnnotations := .Values.ingress.annotations | default dict }}
{{- /* The class may also come from the legacy kubernetes.io/ingress.class annotation, which is copied below. */}}
{{- $webAssetsClass := .Values.ingress.className | default (get $primaryIngressAnnotations "kubernetes.io/ingress.class") | toString }}
{{- if and .Values.ingress.enabled .Values.web.enabled $webAssets.enabled (or (not $webAssets.requireNginxClassName) (contains "nginx" $webAssetsClass)) (gt (len $webAssetRules) 0) }}
{{- $webAssetAnnotations := dict }}
{{- range $key, $value := $primaryIngressAnnotations }}
  {{- /* Certificates and DNS stay owned by the primary Ingress; rewrites, canaries and server-level settings would change or duplicate what the asset paths do today. */}}
  {{- $skip := or (hasPrefix "cert-manager.io/" $key) (hasPrefix "acme.cert-manager.io/" $key) (eq $key "kubernetes.io/tls-acme") (hasPrefix "external-dns.alpha.kubernetes.io/" $key) (hasPrefix "nginx.ingress.kubernetes.io/canary" $key) (has $key (list "nginx.ingress.kubernetes.io/rewrite-target" "nginx.ingress.kubernetes.io/app-root" "nginx.ingress.kubernetes.io/server-snippet" "nginx.ingress.kubernetes.io/server-alias")) }}
  {{- if not $skip }}
    {{- $_ := set $webAssetAnnotations $key $value }}
  {{- end }}
{{- end }}
{{- $_ := set $webAssetAnnotations "nginx.ingress.kubernetes.io/proxy-next-upstream" "error timeout http_404" }}
{{- $_ := set $webAssetAnnotations "nginx.ingress.kubernetes.io/proxy-next-upstream-tries" (toString (int ($webAssets.nextUpstreamTries | default 3))) }}
{{- /* Round-robin can hand a retry the pod that just answered 404; EWMA skips endpoints this request already tried. */}}
{{- $_ := set $webAssetAnnotations "nginx.ingress.kubernetes.io/load-balance" "ewma" }}
{{- range $key, $value := $webAssets.annotations | default dict }}
  {{- $_ := set $webAssetAnnotations $key $value }}
{{- end }}
---
# The asset Ingress's own backend. ingress-nginx keeps one balancer per Service
# port, shared by every Ingress that routes to it, so the asset paths need a
# Service of their own for their balancer setting to apply to them alone. It
# selects the same web pods as the web Service.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "opengeni.fullname" . }}-web-assets
  labels:
    {{- include "opengeni.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.web.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "opengeni.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
---
# During a web rollout, pods of the old and the new build serve side by side and
# ingress-nginx balances every request separately, so a page from one build can
# ask a pod of the other build for a content-hashed asset it does not have. This
# Ingress takes over only the hashed asset paths that the primary Ingress already
# sends to the web service, with the same class, TLS and most annotations, and retries
# a 404 on a web pod this request has not tried yet. Non-asset paths keep their
# primary routing.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "opengeni.fullname" . }}-web-assets
  labels:
    {{- include "opengeni.labels" . | nindent 4 }}
  annotations:
    {{- toYaml $webAssetAnnotations | nindent 4 }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range $webAssetRules }}
    - {{- with .host }}
      host: {{ . | quote }}
      {{- end }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "opengeni.fullname" $ }}-web-assets
                port:
                  name: http
          {{- end }}
    {{- end }}
{{- end }}
