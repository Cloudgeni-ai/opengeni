{{- if and (eq .Values.config.OPENGENI_ORGANIZATION_USER_SETUP_EMAIL_TOKEN_TRANSPORT "query") (ne (toString .Values.config.OPENGENI_ORGANIZATION_USER_SETUP_QUERY_EDGE_SANITIZATION_CONFIRMED) "true") }}
{{- fail "config.OPENGENI_ORGANIZATION_USER_SETUP_QUERY_EDGE_SANITIZATION_CONFIRMED must be true before enabling setup-account query transport" }}
{{- end }}
{{- if and (eq .Values.config.OPENGENI_ORGANIZATION_USER_SETUP_EMAIL_TOKEN_TRANSPORT "query") (not .Values.ingress.setupAccountIngress.enabled) }}
{{- fail "ingress.setupAccountIngress.enabled must be true before enabling setup-account query transport; otherwise /setup-account falls through the primary Ingress logging and tracing policy" }}
{{- end }}
{{- $setupAccountHosts := list }}
{{- range .Values.ingress.hosts }}
  {{- $host := . }}
  {{- $hasWebRoute := false }}
  {{- range .paths }}
    {{- if eq .service "web" }}
      {{- $hasWebRoute = true }}
    {{- end }}
  {{- end }}
  {{- if $hasWebRoute }}
    {{- $setupAccountHosts = append $setupAccountHosts $host }}
  {{- end }}
{{- end }}
{{- if and .Values.ingress.enabled (or .Values.api.enabled .Values.web.enabled) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "opengeni.fullname" . }}
  labels:
    {{- include "opengeni.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "opengeni.fullname" $ }}-{{ .service }}
                port:
                  name: {{ .portName | default "http" }}
          {{- end }}
    {{- end }}
{{- end }}
{{- if and .Values.ingress.enabled .Values.ingress.setupAccountIngress.enabled .Values.web.enabled (eq .Values.config.OPENGENI_PRODUCT_ACCESS_MODE "managed") (gt (len $setupAccountHosts) 0) }}
---
# A dedicated exact setup route suppresses ingress-nginx access logs and request
# traces. It does not sanitize the controller error_log; query activation is
# separately gated on an operator-proven controller/edge policy. The protected
# HTML shell scrubs query/fragment authority in its first inline head script.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "opengeni.fullname" . }}-setup-account
  labels:
    {{- include "opengeni.labels" . | nindent 4 }}
  annotations:
    nginx.ingress.kubernetes.io/enable-access-log: "false"
    nginx.ingress.kubernetes.io/enable-opentelemetry: "false"
    {{- with omit (.Values.ingress.setupAccountIngress.annotations | default dict) "nginx.ingress.kubernetes.io/enable-access-log" "nginx.ingress.kubernetes.io/enable-opentelemetry" }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range $setupAccountHosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          - path: /setup-account
            pathType: Exact
            backend:
              service:
                name: {{ include "opengeni.fullname" $ }}-web
                port:
                  name: http
    {{- end }}
{{- end }}
{{- if and .Values.ingress.enabled .Values.ingress.publicIngress.enabled (or .Values.api.enabled .Values.web.enabled) }}
---
# A SECOND Ingress for the SAME host(s) that exposes ONLY the
# unauthenticated-by-design public paths (the self-host installer scripts +
# minisign pubkey, the release-asset redirect prefixes, and the device-flow
# enrollment BOOTSTRAP endpoints a not-yet-credentialed machine calls).
#
# It deliberately carries NO `nginx.ingress.kubernetes.io/auth-*` annotations.
# ingress-nginx merges Ingresses by host and applies auth per server-location,
# so these more-specific un-gated locations win for EXACTLY these paths while the
# primary Ingress keeps everything else (the web app, /v1/config/client, the
# /device approval page, the rest of /v1) behind its basic-auth gate. This
# mirrors how prod `get.opengeni.ai` serves these same assets ungated.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "opengeni.fullname" . }}-public
  labels:
    {{- include "opengeni.labels" . | nindent 4 }}
  {{- with .Values.ingress.publicIngress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- with .Values.ingress.publicIngress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.publicIngress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "opengeni.fullname" $ }}-{{ .service }}
                port:
                  name: {{ .portName | default "http" }}
          {{- end }}
    {{- end }}
{{- end }}
{{- $mcpOAuthEnabled := has (lower (trim (toString (.Values.config.OPENGENI_MCP_OAUTH_ENABLED | default "false")))) (list "true" "1" "yes" "y" "on") }}
{{- $mcpOAuthHosts := list }}
{{- range .Values.ingress.hosts }}
  {{- $host := . }}
  {{- $hasApiRoute := false }}
  {{- range .paths }}
    {{- if eq .service "api" }}
      {{- $hasApiRoute = true }}
    {{- end }}
  {{- end }}
  {{- if $hasApiRoute }}
    {{- $mcpOAuthHosts = append $mcpOAuthHosts $host }}
  {{- end }}
{{- end }}
{{- if and .Values.ingress.enabled .Values.ingress.mcpOAuthIngress.enabled .Values.api.enabled $mcpOAuthEnabled (gt (len $mcpOAuthHosts) 0) }}
---
# Workspace MCP OAuth publishes its authorization-server metadata, protected-
# resource metadata, registration, authorization, and token endpoints at the
# issuer origin root, outside /v1. Without these exact API routes the primary
# Ingress sends them to the web application, which answers HTML and breaks MCP
# client discovery. Rendered only while OPENGENI_MCP_OAUTH_ENABLED is true.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "opengeni.fullname" . }}-mcp-oauth
  labels:
    {{- include "opengeni.labels" . | nindent 4 }}
  {{- with .Values.ingress.mcpOAuthIngress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range $mcpOAuthHosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          - path: /.well-known/oauth-authorization-server
            pathType: Exact
            backend:
              service:
                name: {{ include "opengeni.fullname" $ }}-api
                port:
                  name: http
          - path: /.well-known/oauth-protected-resource
            pathType: Prefix
            backend:
              service:
                name: {{ include "opengeni.fullname" $ }}-api
                port:
                  name: http
          {{- range list "/oauth/register" "/oauth/authorize" "/oauth/token" }}
          - path: {{ . }}
            pathType: Exact
            backend:
              service:
                name: {{ include "opengeni.fullname" $ }}-api
                port:
                  name: http
          {{- end }}
    {{- end }}
{{- end }}
