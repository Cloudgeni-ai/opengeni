{{- if and .Values.ingress.enabled (or .Values.api.enabled .Values.web.enabled) }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "opengeni.fullname" . }}
  labels:
    {{- include "opengeni.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "opengeni.fullname" $ }}-{{ .service }}
                port:
                  name: {{ .portName | default "http" }}
          {{- end }}
    {{- end }}
{{- end }}
{{- if and .Values.ingress.enabled .Values.ingress.setupAccountIngress.enabled .Values.web.enabled (eq .Values.config.OPENGENI_PRODUCT_ACCESS_MODE "managed") }}
---
# A dedicated exact setup route keeps the mail-compatible query bearer out of
# ingress-nginx access logs. The web process immediately redirects that query
# bearer into a browser-only fragment under no-store/no-referrer headers.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "opengeni.fullname" . }}-setup-account
  labels:
    {{- include "opengeni.labels" . | nindent 4 }}
  {{- with .Values.ingress.setupAccountIngress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    {{- $host := . }}
    {{- $hasWebRoute := false }}
    {{- range .paths }}
    {{- if eq .service "web" }}
    {{- $hasWebRoute = true }}
    {{- end }}
    {{- end }}
    {{- if $hasWebRoute }}
    - host: {{ $host.host | quote }}
      http:
        paths:
          - path: /setup-account
            pathType: Exact
            backend:
              service:
                name: {{ include "opengeni.fullname" $ }}-web
                port:
                  name: http
    {{- end }}
    {{- end }}
{{- end }}
{{- if and .Values.ingress.enabled .Values.ingress.publicIngress.enabled (or .Values.api.enabled .Values.web.enabled) }}
---
# A SECOND Ingress for the SAME host(s) that exposes ONLY the
# unauthenticated-by-design public paths (the self-host installer scripts +
# minisign pubkey, the release-asset redirect prefixes, and the device-flow
# enrollment BOOTSTRAP endpoints a not-yet-credentialed machine calls).
#
# It deliberately carries NO `nginx.ingress.kubernetes.io/auth-*` annotations.
# ingress-nginx merges Ingresses by host and applies auth per server-location,
# so these more-specific un-gated locations win for EXACTLY these paths while the
# primary Ingress keeps everything else (the web app, /v1/config/client, the
# /device approval page, the rest of /v1) behind its basic-auth gate. This
# mirrors how prod `get.opengeni.ai` serves these same assets ungated.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "opengeni.fullname" . }}-public
  labels:
    {{- include "opengeni.labels" . | nindent 4 }}
  {{- with .Values.ingress.publicIngress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- with .Values.ingress.publicIngress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.publicIngress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "opengeni.fullname" $ }}-{{ .service }}
                port:
                  name: {{ .portName | default "http" }}
          {{- end }}
    {{- end }}
{{- end }}
