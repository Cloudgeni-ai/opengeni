{{- if and .Values.kubernetesSandbox.enabled .Values.kubernetesSandbox.workloadServiceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "opengeni.kubernetesSandboxServiceAccountName" . }}
  namespace: {{ include "opengeni.kubernetesSandboxNamespace" . }}
  labels:
    {{- include "opengeni.labels" . | nindent 4 }}
    app.kubernetes.io/component: sandbox-workload
  {{- with .Values.kubernetesSandbox.workloadServiceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- with .Values.kubernetesSandbox.workloadServiceAccount.imagePullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
{{- end }}
