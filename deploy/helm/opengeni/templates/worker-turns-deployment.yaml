{{- if .Values.worker.enabled }}
{{- $shutdownEnv := include "opengeni.turnWorkerShutdownEnv" . | trim }}
{{- $reservedEnv := list "OPENGENI_WORKER_ROLE" "OPENGENI_WORKER_HTTP_PORT" "OPENGENI_POD_UID" "OPENGENI_OPENSANDBOX_KUBERNETES_INVENTORY_NAMESPACE" }}
{{- if $shutdownEnv }}
{{- range (fromYamlArray $shutdownEnv) }}
{{- $reservedEnv = append $reservedEnv .name }}
{{- end }}
{{- end }}
{{- $extraEnv := include "opengeni.extraEnv" (dict "root" . "entries" .Values.worker.extraEnv "reserved" $reservedEnv) }}
{{- $priorityClassName := include "opengeni.priorityClassName" (dict "root" . "explicit" (.Values.worker.turns.priorityClassName | default .Values.worker.priorityClassName) "tier" "execution") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opengeni.fullname" . }}-worker-turns
  labels:
    {{- include "opengeni.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker-turns
spec:
  {{- include "opengeni.replicas" (dict "root" . "name" (printf "%s-worker-turns" (include "opengeni.fullname" .)) "replicaCount" .Values.worker.turns.replicaCount "autoscaling" .Values.worker.turns.autoscaling) | indent 2 }}
  {{- with .Values.worker.turns.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "opengeni.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker-turns
  template:
    metadata:
      labels:
        {{- include "opengeni.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker-turns
        opengeni.ai/worker-role: turns
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- if .Values.secret.create }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.worker.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "opengeni.serviceAccountName" . }}
      enableServiceLinks: false
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      terminationGracePeriodSeconds: {{ include "opengeni.turnWorkerTerminationGracePeriodSeconds" . }}
      {{- if $priorityClassName }}
      priorityClassName: {{ $priorityClassName | quote }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.worker.podSecurityContext | nindent 8 }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with include "opengeni.computeControl.trustInitContainer" (dict "root" . "workload" .Values.worker) }}
      initContainers:
        {{- . | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          image: {{ include "opengeni.image" (dict "root" . "image" .Values.worker.image) | quote }}
          imagePullPolicy: {{ ((.Values.worker).image).pullPolicy }}
          securityContext:
            {{- toYaml .Values.worker.securityContext | nindent 12 }}
          {{- if .Values.worker.command }}
          command:
            {{- toYaml .Values.worker.command | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.worker.containerPort }}
          envFrom:
            - configMapRef:
                name: {{ include "opengeni.fullname" . }}-config
            # Later envFrom sources win duplicate keys. Keep the runtime Secret
            # authoritative for protected provider/model overrides.
            - secretRef:
                name: {{ include "opengeni.secretName" . }}
          env:
            {{- include "opengeni.deploymentRevisionEnv" . | nindent 12 }}
            - name: OPENGENI_WORKER_HTTP_PORT
              value: {{ .Values.worker.containerPort | quote }}
            - name: OPENGENI_WORKER_ROLE
              value: turn
            - name: OPENGENI_POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            {{- with $shutdownEnv }}
            {{- . | nindent 12 }}
            {{- end }}
            {{- if or .Values.postgres.enabled .Values.temporal.enabled .Values.garage.enabled .Values.minio.enabled }}
            {{- include "opengeni.generatedRuntimeEnv" (dict "root" . "objectStorageEndpoint" (include "opengeni.objectStorageInternalEndpoint" .)) | nindent 12 }}
            {{- end }}
            {{- with include "opengeni.computeControl.trustEnv" . }}{{ . | nindent 12 }}{{- end }}
            {{- with $extraEnv }}
            {{- . | nindent 12 }}
            {{- end }}
          {{- $computeTrusted := include "opengeni.computeControl.trusted" . }}
          {{- if or .Values.worker.extraVolumeMounts $computeTrusted }}
          volumeMounts:
            {{- with include "opengeni.computeControl.trustVolumeMount" . }}{{ . | nindent 12 }}{{- end }}
            {{- with .Values.worker.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          {{- if (((.Values.worker).probes).readiness).enabled }}
          readinessProbe:
            {{- include "opengeni.httpProbe" (dict "probe" ((.Values.worker).probes).readiness) | nindent 12 }}
          {{- end }}
          {{- if (((.Values.worker).probes).liveness).enabled }}
          livenessProbe:
            {{- include "opengeni.httpProbe" (dict "probe" ((.Values.worker).probes).liveness) | nindent 12 }}
          {{- end }}
          {{- with .Values.worker.turns.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- if or .Values.worker.extraVolumes $computeTrusted }}
      volumes:
        {{- with include "opengeni.computeControl.trustVolume" . }}{{ . | nindent 8 }}{{- end }}
        {{- with .Values.worker.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- if ((.Values.worker).topologySpreadConstraints).enabled }}
      topologySpreadConstraints:
        {{- include "opengeni.topologySpreadConstraints" (dict "root" . "component" "worker-turns" "values" .Values.worker) | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.worker.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
