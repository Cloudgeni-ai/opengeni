{{- if .Values.garage.enabled }}
{{- include "opengeni.assertExclusiveObjectStorageFixture" . }}
{{- $priorityClassName := include "opengeni.priorityClassName" (dict "root" . "explicit" .Values.garage.priorityClassName "tier" "durable") }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "opengeni.fullname" . }}-garage-cors
  labels:
    {{- include "opengeni.labels" . | nindent 4 }}
    app.kubernetes.io/component: garage-cors
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    helm.sh/hook-weight: "5"
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "opengeni.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: garage-cors
    spec:
      restartPolicy: Never
      {{- if $priorityClassName }}
      priorityClassName: {{ $priorityClassName | quote }}
      {{- end }}
      containers:
        - name: curl
          image: {{ if .Values.garage.corsImage.digest }}{{ printf "%s:%s@%s" .Values.garage.corsImage.repository .Values.garage.corsImage.tag .Values.garage.corsImage.digest | quote }}{{ else }}{{ printf "%s:%s" .Values.garage.corsImage.repository .Values.garage.corsImage.tag | quote }}{{ end }}
          imagePullPolicy: {{ .Values.garage.corsImage.pullPolicy }}
          env:
            - name: HTTP_PROXY
              value: ""
            - name: HTTPS_PROXY
              value: ""
            - name: ALL_PROXY
              value: ""
            - name: http_proxy
              value: ""
            - name: https_proxy
              value: ""
            - name: all_proxy
              value: ""
            - name: NO_PROXY
              value: "localhost,127.0.0.1,{{ include "opengeni.fullname" . }}-garage"
            - name: no_proxy
              value: "localhost,127.0.0.1,{{ include "opengeni.fullname" . }}-garage"
            - name: GARAGE_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "opengeni.garageSecretName" . }}
                  key: {{ .Values.garage.auth.accessKeyKey }}
            - name: GARAGE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "opengeni.garageSecretName" . }}
                  key: {{ .Values.garage.auth.secretKeyKey }}
          command:
            - /bin/sh
            - -ec
            - |
              cat > /tmp/cors.xml <<'EOF'
              <CORSConfiguration>
                <CORSRule>
                  <AllowedOrigin>*</AllowedOrigin>
                  <AllowedMethod>GET</AllowedMethod>
                  <AllowedMethod>PUT</AllowedMethod>
                  <AllowedMethod>HEAD</AllowedMethod>
                  <AllowedMethod>POST</AllowedMethod>
                  <AllowedMethod>DELETE</AllowedMethod>
                  <AllowedHeader>*</AllowedHeader>
                  <ExposeHeader>ETag</ExposeHeader>
                  <ExposeHeader>x-amz-meta-sha256</ExposeHeader>
                  <ExposeHeader>x-amz-request-id</ExposeHeader>
                  <MaxAgeSeconds>3600</MaxAgeSeconds>
                </CORSRule>
              </CORSConfiguration>
              EOF
              for i in $(seq 1 30); do
                if curl --fail --silent --show-error --max-time 5 \
                  --aws-sigv4 aws:amz:us-east-1:s3 \
                  --user "$GARAGE_ACCESS_KEY:$GARAGE_SECRET_KEY" \
                  --request PUT --data-binary @/tmp/cors.xml \
                  {{ printf "%s/%s?cors=" (include "opengeni.garageInternalEndpoint" .) .Values.garage.bucket | quote }}; then
                  exit 0
                fi
                sleep 2
              done
              exit 1
{{- end }}
