{{- if and .Values.networkPolicy.enabled .Values.relay.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "opengeni.fullname" . }}-relay
  labels:
    {{- include "opengeni.labels" . | nindent 4 }}
    app.kubernetes.io/component: relay
spec:
  podSelector:
    matchLabels:
      {{- include "opengeni.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: relay
  # Both public peers dial through ingress. Relays may additionally forward one
  # authenticated stream hop to the producer-selected owner in this release.
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        # The ingress controller terminates TLS and forwards the wss dials.
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.ingressController.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.networkPolicy.ingressController.podSelector | nindent 12 }}
        - podSelector:
            matchLabels:
              {{- include "opengeni.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: relay
        {{- if not .Values.relay.metricsPort }}
        {{- with .Values.networkPolicy.monitoring }}
        # Legacy single-listener layout: the metrics scraper (Prometheus) reaches
        # GET /metrics on the wss port.
        - namespaceSelector:
            {{- toYaml .namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .podSelector | nindent 12 }}
        {{- end }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.relay.containerPort }}
    {{- if and .Values.relay.metricsPort .Values.networkPolicy.monitoring }}
    # The internal metrics listener admits only the scraper, never the ingress
    # controller.
    - from:
        {{- with .Values.networkPolicy.monitoring }}
        - namespaceSelector:
            {{- toYaml .namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .podSelector | nindent 12 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.relay.metricsPort }}
    {{- end }}
  # Signed IP-literal routes need neither DNS nor control-plane access.
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "opengeni.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: relay
      ports:
        - protocol: TCP
          port: {{ .Values.relay.containerPort }}
{{- end }}
