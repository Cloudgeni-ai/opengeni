{{- /*
The compute control service's ServiceMonitor, with its other resources and
apart from servicemonitor.yaml: operators that render only the core
workloads' monitoring (servicemonitor.yaml with --show-only) keep the set
they expect, and the release that runs compute-control owns its scrape.
*/ -}}
{{- if and .Values.computeControl.enabled (.Values.computeControl.metrics).port ((.Values.observability).serviceMonitor).enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1") }}
# Every replica of the compute control service: each reports its own
# requests and whether it leads, and the leader alone the fleet's hosts.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "opengeni.computeControl.name" . }}
  labels:
    {{- include "opengeni.labels" . | nindent 4 }}
    app.kubernetes.io/component: compute-control
    {{- with ((.Values.observability).serviceMonitor).labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with ((.Values.observability).serviceMonitor).annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "opengeni.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: compute-control
      opengeni.ai/metrics-endpoint: "true"
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ ((.Values.observability).serviceMonitor).interval | default "30s" | quote }}
      scrapeTimeout: {{ ((.Values.observability).serviceMonitor).scrapeTimeout | default "10s" | quote }}
      relabelings:
        - sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: namespace
        - sourceLabels: [__meta_kubernetes_service_label_app_kubernetes_io_instance]
          targetLabel: release
        - sourceLabels: [__meta_kubernetes_service_label_app_kubernetes_io_component]
          targetLabel: opengeni_workload_component
{{- end }}
