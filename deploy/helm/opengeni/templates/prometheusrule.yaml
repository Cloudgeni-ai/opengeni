{{- if and ((.Values.observability).prometheusRule).enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1") }}
{{- $environment := default "production" (index .Values.config "OPENGENI_ENVIRONMENT") }}
{{- $inventoryFreshnessSeconds := int (default 300 ((.Values.observability).prometheusRule).inventoryFreshnessSeconds) }}
{{- $turnStartupQueueP95Seconds := int (default 5 ((.Values.observability).prometheusRule).turnStartupQueueP95Seconds) }}
{{- $turnStartupProviderDispatchP95Seconds := int (default 60 ((.Values.observability).prometheusRule).turnStartupProviderDispatchP95Seconds) }}
{{- $turnStartupFirstByteP95Seconds := int (default 120 ((.Values.observability).prometheusRule).turnStartupFirstByteP95Seconds) }}
{{- $turnStartupFirstByteAvailabilityRatio := float64 ((.Values.observability).prometheusRule).turnStartupFirstByteAvailabilityRatio }}
{{- $turnStartupMinSamples := int (default 5 ((.Values.observability).prometheusRule).turnStartupMinSamples) }}
{{- $reaperPeriodMs := int (default "30000" (index .Values.config "OPENGENI_SANDBOX_LEASE_REAPER_PERIOD_MS")) }}
{{- $fullName := include "opengeni.fullname" . }}
{{- $opensandboxEnabled := eq (default "none" (index .Values.config "OPENGENI_SANDBOX_BACKEND")) "opensandbox" }}
{{- if le $inventoryFreshnessSeconds 0 }}
{{- fail "observability.prometheusRule.inventoryFreshnessSeconds must be positive" }}
{{- end }}
{{- if or (le $turnStartupQueueP95Seconds 0) (le $turnStartupProviderDispatchP95Seconds 0) (le $turnStartupFirstByteP95Seconds 0) (le $turnStartupFirstByteAvailabilityRatio 0.0) (gt $turnStartupFirstByteAvailabilityRatio 1.0) (le $turnStartupMinSamples 0) }}
{{- fail "observability.prometheusRule turn-startup latency thresholds/minimum samples must be positive and first-byte availability ratio must be in (0, 1]" }}
{{- end }}
{{- if lt (mul $inventoryFreshnessSeconds 1000) (mul $reaperPeriodMs 3) }}
{{- fail "observability.prometheusRule.inventoryFreshnessSeconds must cover at least three sandbox reaper periods" }}
{{- end }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "opengeni.fullname" . }}
  labels:
    {{- include "opengeni.labels" . | nindent 4 }}
    {{- with ((.Values.observability).prometheusRule).labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with ((.Values.observability).prometheusRule).annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  groups:
    - name: opengeni.rules
      # Make every alert and recording rule self-identifying when one Prometheus
      # evaluates more than one OpenGeni deployment. Dashboard and Alertmanager
      # consumers can then select the exact release instead of matching globally.
      labels:
        namespace: {{ .Release.Namespace | quote }}
        environment: {{ $environment | quote }}
        release: {{ .Release.Name | quote }}
      rules:
        # These recording rules admit only a complete inventory projection whose
        # matching domain refreshed on the same scrape target within the configured
        # window. A global reaper activity can hop between control replicas, so
        # an unfiltered max would retain a stale high value on the former winner.
        - record: opengeni:sandbox_leases:fresh_max
          expr: |
            max by (liveness) (
              opengeni_sandbox_leases
              and on (job, instance)
              (time() - opengeni_sandbox_inventory_refresh_timestamp_seconds{domain="leases"} < {{ $inventoryFreshnessSeconds }})
            )
        - record: opengeni:sandbox_checkpoint_artifacts:fresh_max
          expr: |
            max by (state) (
              opengeni_sandbox_checkpoint_artifacts
              and on (job, instance)
              (time() - opengeni_sandbox_inventory_refresh_timestamp_seconds{domain="checkpoint_artifacts"} < {{ $inventoryFreshnessSeconds }})
            )
        - record: opengeni:sandbox_rotation_backlog:fresh_max
          expr: |
            max by (kind) (
              opengeni_sandbox_rotation_backlog
              and on (job, instance)
              (time() - opengeni_sandbox_inventory_refresh_timestamp_seconds{domain="rotation_backlog"} < {{ $inventoryFreshnessSeconds }})
            )
        - record: opengeni:retained_processes_active:fresh_max
          expr: |
            max by (owner_state) (
              opengeni_retained_processes_active
              and on (job, instance)
              (time() - opengeni_sandbox_inventory_refresh_timestamp_seconds{domain="retained_processes"} < {{ $inventoryFreshnessSeconds }})
            )
        - record: opengeni:retained_processes_terminal_owner_backlog:fresh_max
          expr: |
            max by (owner_state) (
              opengeni_retained_processes_terminal_owner_backlog
              and on (job, instance)
              (time() - opengeni_sandbox_inventory_refresh_timestamp_seconds{domain="retained_processes"} < {{ $inventoryFreshnessSeconds }})
            )
        - record: opengeni:sandbox_leases_expired_draining:fresh_max
          expr: |
            max by (backend, age_bucket) (
              opengeni_sandbox_leases_expired_draining
              and on (job, instance)
              (time() - opengeni_sandbox_inventory_refresh_timestamp_seconds{domain="expired_drains"} < {{ $inventoryFreshnessSeconds }})
            )
        {{- if $opensandboxEnabled }}
        - record: opengeni:opensandbox_batchsandboxes:fresh_max
          expr: |
            max by (phase) (
              opengeni_opensandbox_batchsandboxes
              and on (job, instance)
              (time() - opengeni_sandbox_inventory_refresh_timestamp_seconds{domain="opensandbox_kubernetes"} < {{ $inventoryFreshnessSeconds }})
            )
        - record: opengeni:opensandbox_workload_pods:fresh_max
          expr: |
            max by (condition) (
              opengeni_opensandbox_workload_pods
              and on (job, instance)
              (time() - opengeni_sandbox_inventory_refresh_timestamp_seconds{domain="opensandbox_kubernetes"} < {{ $inventoryFreshnessSeconds }})
            )
        - record: opengeni:opensandbox_cleanup_stuck:fresh_max
          expr: |
            max(
              opengeni_opensandbox_cleanup_stuck
              and on (job, instance)
              (time() - opengeni_sandbox_inventory_refresh_timestamp_seconds{domain="opensandbox_kubernetes"} < {{ $inventoryFreshnessSeconds }})
            )
        - record: opengeni:opensandbox_expiration_overdue:fresh_max
          expr: |
            max(
              opengeni_opensandbox_expiration_overdue
              and on (job, instance)
              (time() - opengeni_sandbox_inventory_refresh_timestamp_seconds{domain="opensandbox_kubernetes"} < {{ $inventoryFreshnessSeconds }})
            )
        {{- end }}
        # Node-relative protection cannot rely on a container memory limit: the
        # single-node profile intentionally leaves the resource-based turn worker
        # unbounded so Temporal can tune concurrency against real headroom. These
        # records map node-exporter instances onto Kubernetes nodes, then retain
        # alerts only for nodes currently hosting this OpenGeni release.
        - record: opengeni:workload_node:present
          expr: |
            max by (node) (
              kube_pod_info{namespace="{{ .Release.Namespace }}", pod=~"{{ $fullName }}-.*"}
              and on (namespace, pod)
              (kube_pod_status_phase{namespace="{{ .Release.Namespace }}", phase="Running"} == 1)
            )
        - record: opengeni:node_exporter_instance:info
          expr: |
            max by (instance, node) (
              label_replace(node_uname_info, "node", "$1", "nodename", "(.+)")
            )
        - record: opengeni:kubelet_instance:info
          expr: |
            max by (job, instance, node) (
              kubelet_node_name{metrics_path="/metrics"}
            )
        - record: opengeni:node_memory_psi_stall_ratio
          expr: |
            max by (node) (
              rate(node_pressure_memory_stalled_seconds_total[2m])
              * on (instance) group_left (node)
              opengeni:node_exporter_instance:info
            )
        - record: opengeni:node_io_psi_stall_ratio
          expr: |
            max by (node) (
              rate(node_pressure_io_stalled_seconds_total[2m])
              * on (instance) group_left (node)
              opengeni:node_exporter_instance:info
            )
        - record: opengeni:node_swap_out_pages_per_second
          expr: |
            max by (node) (
              rate(node_vmstat_pswpout[2m])
              * on (instance) group_left (node)
              opengeni:node_exporter_instance:info
            )
        - alert: OpenGeniTurnStuck
          expr: opengeni_turn_oldest_no_progress_age_seconds > 900
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: OpenGeni has an agent turn without durable progress for more than 15 minutes
        - alert: OpenGeniSessionRecoveryBacklogStale
          expr: |
            max(
              opengeni_session_recovery_backlog{namespace={{ .Release.Namespace | quote }},release={{ .Release.Name | quote }},environment={{ $environment | quote }},component="worker-control"} > 0
              and on(namespace, release, environment, component, instance)
              opengeni_session_recovery_monitor_fresh{namespace={{ .Release.Namespace | quote }},release={{ .Release.Name | quote }},environment={{ $environment | quote }},component="worker-control"} == 1
              and on(namespace, release, environment, component, instance)
              time() - opengeni_session_recovery_monitor_last_success_timestamp_seconds{namespace={{ .Release.Namespace | quote }},release={{ .Release.Name | quote }},environment={{ $environment | quote }},component="worker-control"} < 240
            ) > 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: OpenGeni has a durable recovering session with no active attempt for more than 10 minutes
            description: Inspect the bounded state label. quiescence_missing requires exact Temporal activity-loss and writer-settlement proof; projection_stale is safe to replay through the exact idempotent quiescence receipt transaction.
        - alert: OpenGeniSessionRecoveryMonitorStale
          expr: |
            absent(opengeni_session_recovery_monitor_fresh{namespace={{ .Release.Namespace | quote }},release={{ .Release.Name | quote }},environment={{ $environment | quote }},component="worker-control"}) == 1
            or
            min(opengeni_session_recovery_monitor_fresh{namespace={{ .Release.Namespace | quote }},release={{ .Release.Name | quote }},environment={{ $environment | quote }},component="worker-control"}) < 1
            or
            time() - min(opengeni_session_recovery_monitor_last_success_timestamp_seconds{namespace={{ .Release.Namespace | quote }},release={{ .Release.Name | quote }},environment={{ $environment | quote }},component="worker-control"}) > 240
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: OpenGeni durable session-recovery monitoring is stale
        - alert: OpenGeniTurnStartupQueueP95High
          expr: |
            histogram_quantile(
              0.95,
              sum by (le) (rate(opengeni_turn_startup_milestone_duration_seconds_bucket{namespace={{ .Release.Namespace | quote }},release={{ .Release.Name | quote }},environment={{ $environment | quote }},milestone="queue",outcome="completed"}[15m]))
            ) > {{ $turnStartupQueueP95Seconds }}
            and on()
            sum(increase(opengeni_turn_startup_milestone_duration_seconds_count{namespace={{ .Release.Namespace | quote }},release={{ .Release.Name | quote }},environment={{ $environment | quote }},milestone="queue",outcome="completed"}[15m])) >= {{ $turnStartupMinSamples }}
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: OpenGeni turn queue p95 exceeds {{ $turnStartupQueueP95Seconds }} seconds
            description: Durable turns are waiting too long before a worker starts them. Inspect Temporal eligible backlog, worker capacity, and admission saturation before attributing this to sandbox or model latency.
        - alert: OpenGeniTurnStartupProviderDispatchP95High
          expr: |
            histogram_quantile(
              0.95,
              sum by (le) (rate(opengeni_turn_startup_milestone_duration_seconds_bucket{namespace={{ .Release.Namespace | quote }},release={{ .Release.Name | quote }},environment={{ $environment | quote }},milestone="provider_dispatch",outcome="completed"}[15m]))
            ) > {{ $turnStartupProviderDispatchP95Seconds }}
            and on()
            sum(increase(opengeni_turn_startup_milestone_duration_seconds_count{namespace={{ .Release.Namespace | quote }},release={{ .Release.Name | quote }},environment={{ $environment | quote }},milestone="provider_dispatch",outcome="completed"}[15m])) >= {{ $turnStartupMinSamples }}
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: OpenGeni queue-to-provider-dispatch p95 exceeds {{ $turnStartupProviderDispatchP95Seconds }} seconds
            description: The cumulative platform path is slow. Use the Turn Startup phase breakdown to distinguish sandbox, rig, file/repository, tool, history, and request-preparation latency.
        - alert: OpenGeniTurnStartupFirstByteP95High
          expr: |
            histogram_quantile(
              0.95,
              sum by (le) (rate(opengeni_turn_startup_milestone_duration_seconds_bucket{namespace={{ .Release.Namespace | quote }},release={{ .Release.Name | quote }},environment={{ $environment | quote }},milestone="first_byte",outcome="completed"}[15m]))
            ) > {{ $turnStartupFirstByteP95Seconds }}
            and on()
            sum(increase(opengeni_turn_startup_milestone_duration_seconds_count{namespace={{ .Release.Namespace | quote }},release={{ .Release.Name | quote }},environment={{ $environment | quote }},milestone="first_byte",outcome="completed"}[15m])) >= {{ $turnStartupMinSamples }}
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: OpenGeni queue-to-first-byte p95 exceeds {{ $turnStartupFirstByteP95Seconds }} seconds
            description: End-to-end first response latency is above target. Compare the cumulative provider-dispatch milestone with provider first-byte duration to separate platform delay from provider think time.
        - alert: OpenGeniTurnStartupFirstByteAvailabilityLow
          expr: |
            (
              (
                sum by (provider) (increase(opengeni_turn_startup_milestone_duration_seconds_count{namespace={{ .Release.Namespace | quote }},release={{ .Release.Name | quote }},environment={{ $environment | quote }},milestone="first_byte",outcome="completed"}[15m]))
                or on(provider)
                0 * sum by (provider) (increase(opengeni_turn_startup_milestone_duration_seconds_count{namespace={{ .Release.Namespace | quote }},release={{ .Release.Name | quote }},environment={{ $environment | quote }},milestone="first_byte",outcome="failed"}[15m]))
              )
              /
              clamp_min(sum by (provider) (increase(opengeni_turn_startup_milestone_duration_seconds_count{namespace={{ .Release.Namespace | quote }},release={{ .Release.Name | quote }},environment={{ $environment | quote }},milestone="first_byte",outcome=~"completed|failed"}[15m])), 1)
            ) < {{ $turnStartupFirstByteAvailabilityRatio }}
            and on(provider)
            sum by (provider) (increase(opengeni_turn_startup_milestone_duration_seconds_count{namespace={{ .Release.Namespace | quote }},release={{ .Release.Name | quote }},environment={{ $environment | quote }},milestone="first_byte",outcome=~"completed|failed"}[15m])) >= {{ $turnStartupMinSamples }}
            and on(provider)
            sum by (provider) (increase(opengeni_turn_startup_milestone_duration_seconds_count{namespace={{ .Release.Namespace | quote }},release={{ .Release.Name | quote }},environment={{ $environment | quote }},milestone="first_byte",outcome="failed"}[15m])) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: OpenGeni first-byte availability is below {{ $turnStartupFirstByteAvailabilityRatio }} for {{ "{{ $labels.provider }}" }}
            description: Canonical durable logical turns terminated failed after provider dispatch without producing a first byte in any attempt. Successful first-byte latency remains a separate SLO; inspect provider transport diagnostics rather than treating missing bytes as fast latency samples.
        - alert: OpenGeniSuperGrokResponseStreamIdleTimeout
          expr: |
            sum(increase(opengeni_model_request_phases_total{provider="supergrok-subscription",phase="terminal",outcome="timed_out"}[15m])) > 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: A SuperGrok response stream stopped producing valid SSE events
            description: The accepted stream was cancelled after its configured valid-event silence interval and was not replayed. Correlate the durable agent.model.request terminal checkpoint with provider request metadata.
        - alert: OpenGeniTurnFailureRatioHigh
          expr: |
            (
              sum(increase(opengeni_turns_total{namespace={{ .Release.Namespace | quote }},release={{ .Release.Name | quote }},environment={{ $environment | quote }},outcome="failed"}[10m]))
              /
              clamp_min(sum(increase(opengeni_turns_total{namespace={{ .Release.Namespace | quote }},release={{ .Release.Name | quote }},environment={{ $environment | quote }}}[10m])), 1)
            ) > 0.2
            and on()
            sum(increase(opengeni_turns_total{namespace={{ .Release.Namespace | quote }},release={{ .Release.Name | quote }},environment={{ $environment | quote }}}[10m])) >= 5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: OpenGeni turn failures exceed 20%
            description: Durable logical turns are terminalizing failed. Compare MCP lifecycle/tool outcomes, sandbox provision categories, provider terminals, and startup phases before changing retry policy.
        - alert: OpenGeniTurnRecoveryRatioHigh
          expr: |
            (
              sum(increase(opengeni_turns_total{namespace={{ .Release.Namespace | quote }},release={{ .Release.Name | quote }},environment={{ $environment | quote }},outcome="recovering"}[10m]))
              /
              clamp_min(sum(increase(opengeni_turns_total{namespace={{ .Release.Namespace | quote }},release={{ .Release.Name | quote }},environment={{ $environment | quote }}}[10m])), 1)
            ) > 0.2
            and on()
            sum(increase(opengeni_turns_total{namespace={{ .Release.Namespace | quote }},release={{ .Release.Name | quote }},environment={{ $environment | quote }}}[10m])) >= 5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: OpenGeni same-turn recovery pressure exceeds 20%
            description: Recovery is preserving logical turns but consuming capacity and adding latency. Inspect typed MCP transport, sandbox, provider, and worker-shutdown evidence for the dominant retryable boundary.
        - alert: OpenGeniTurnWorkerRestarted
          expr: |
            sum(
              increase(kube_pod_container_status_restarts_total{namespace={{ .Release.Namespace | quote }},container="worker"}[10m])
              * on(namespace, pod) group_left()
              max by (namespace, pod) (
                kube_pod_labels{namespace={{ .Release.Namespace | quote }},label_app_kubernetes_io_instance={{ .Release.Name | quote }},label_app_kubernetes_io_component="worker-turns"}
              )
            ) > 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: An OpenGeni turn worker restarted
            description: A turn-worker process exited unexpectedly within the last 10 minutes. Correlate the affected Pod logs with same-turn recovery outcomes before assuming the active turn completed normally.
        - alert: OpenGeniTurnWorkerCrashLoop
          expr: |
            sum(
              increase(kube_pod_container_status_restarts_total{namespace={{ .Release.Namespace | quote }},container="worker"}[10m])
              * on(namespace, pod) group_left()
              max by (namespace, pod) (
                kube_pod_labels{namespace={{ .Release.Namespace | quote }},label_app_kubernetes_io_instance={{ .Release.Name | quote }},label_app_kubernetes_io_component="worker-turns"}
              )
            ) > 1
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: OpenGeni turn workers are repeatedly restarting
            description: More than one turn-worker container restart occurred within 10 minutes. Treat this as an active crash loop because repeated worker loss can exhaust bounded same-turn recovery and fail a session.
        - alert: OpenGeniTurnWorkerDeathRecovered
          expr: |
            sum(increase(opengeni_turn_worker_death_recoveries_total{namespace={{ .Release.Namespace | quote }},release={{ .Release.Name | quote }},environment={{ $environment | quote }},outcome="recovering"}[10m])) > 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: OpenGeni recovered a turn after worker death
            description: Durable same-turn recovery prevented immediate session failure, but an in-flight worker was lost. Inspect worker restarts, heartbeat health, the container termination reason, and the last worker log entry.
        - alert: OpenGeniTurnWorkerDeathRecoveryExhausted
          expr: |
            sum(increase(opengeni_turn_worker_death_recoveries_total{namespace={{ .Release.Namespace | quote }},release={{ .Release.Name | quote }},environment={{ $environment | quote }},outcome="exhausted"}[15m])) > 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: OpenGeni exhausted same-turn worker-death recovery
            description: One logical turn lost four workers and was durably failed after three re-dispatches. Inspect the turn-worker fatal boundary and the correlated turn.failed event with code worker_death_redispatch_exhausted.
        - alert: OpenGeniModelCallFailureRatioHigh
          expr: |
            (
              sum by (provider) (increase(opengeni_model_calls_total{namespace={{ .Release.Namespace | quote }},release={{ .Release.Name | quote }},environment={{ $environment | quote }},outcome="failed"}[10m]))
              /
              clamp_min(sum by (provider) (increase(opengeni_model_calls_total{namespace={{ .Release.Namespace | quote }},release={{ .Release.Name | quote }},environment={{ $environment | quote }}}[10m])), 1)
            ) > 0.2
            and on(provider)
            sum by (provider) (increase(opengeni_model_calls_total{namespace={{ .Release.Namespace | quote }},release={{ .Release.Name | quote }},environment={{ $environment | quote }}}[10m])) >= 5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: OpenGeni model-call failures exceed 20% for {{ "{{ $labels.provider }}" }}
            description: The provider request boundary is failing independently of sandbox and tool preparation. Correlate provider terminal phases and first-byte availability before retrying or rerouting work.
        - alert: OpenGeniMcpStrictConnectFailed
          expr: |
            sum(increase(opengeni_mcp_lifecycle_operations_total{namespace={{ .Release.Namespace | quote }},release={{ .Release.Name | quote }},environment={{ $environment | quote }},phase="connect",policy="strict",outcome="failed"}[5m])) > 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: A required OpenGeni MCP server failed to connect
            description: A strict MCP dependency prevented a turn from reaching the model. Inspect the bounded McpLifecycleError code/status/origin log and the Runtime Failures dashboard; never copy transport bodies or credentials into incident evidence.
        - alert: OpenGeniMcpCloseFailed
          expr: |
            sum by (policy) (increase(opengeni_mcp_lifecycle_operations_total{namespace={{ .Release.Namespace | quote }},release={{ .Release.Name | quote }},environment={{ $environment | quote }},phase="close",outcome="failed"}[5m])) > 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: OpenGeni MCP cleanup failed for {{ "{{ $labels.policy }}" }} connections
            description: A transport did not close cleanly and may retain resources. Inspect the bounded MCP lifecycle diagnostic and worker health; do not obscure the turn's original outcome with cleanup retries.
        - alert: OpenGeniMcpBestEffortConnectFailureRatio
          expr: |
            (
              sum(increase(opengeni_mcp_lifecycle_operations_total{namespace={{ .Release.Namespace | quote }},release={{ .Release.Name | quote }},environment={{ $environment | quote }},phase="connect",policy="best_effort",outcome="failed"}[10m]))
              /
              clamp_min(sum(increase(opengeni_mcp_lifecycle_operations_total{namespace={{ .Release.Namespace | quote }},release={{ .Release.Name | quote }},environment={{ $environment | quote }},phase="connect",policy="best_effort"}[10m])), 1)
            ) > 0.2
            and on()
            sum(increase(opengeni_mcp_lifecycle_operations_total{namespace={{ .Release.Namespace | quote }},release={{ .Release.Name | quote }},environment={{ $environment | quote }},phase="connect",policy="best_effort"}[10m])) >= 5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Optional or connector-backed MCP connection failures exceed 20%
            description: Turns may continue with missing tools, but users are losing capabilities. Check connector authentication, endpoint health, and bounded MCP lifecycle logs.
        - alert: OpenGeniMcpToolFailureRatio
          expr: |
            (
              sum(increase(opengeni_mcp_tool_calls_total{namespace={{ .Release.Namespace | quote }},release={{ .Release.Name | quote }},environment={{ $environment | quote }},outcome=~"provider_declared_error|auth_needed|outcome_uncertain|timeout|thrown_transport_error|thrown_protocol_error"}[10m]))
              /
              clamp_min(sum(increase(opengeni_mcp_tool_calls_total{namespace={{ .Release.Namespace | quote }},release={{ .Release.Name | quote }},environment={{ $environment | quote }}}[10m])), 1)
            ) > 0.2
            and on()
            sum(increase(opengeni_mcp_tool_calls_total{namespace={{ .Release.Namespace | quote }},release={{ .Release.Name | quote }},environment={{ $environment | quote }}}[10m])) >= 5
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: OpenGeni MCP tool-call failures exceed 20%
            description: Includes provider-declared, authentication, timeout, uncertain, transport, and protocol outcomes. User cancellation remains visible in Grafana but does not page operators.
        - alert: OpenGeniMcpToolOutcomeUncertain
          expr: |
            sum(increase(opengeni_mcp_tool_calls_total{namespace={{ .Release.Namespace | quote }},release={{ .Release.Name | quote }},environment={{ $environment | quote }},outcome="outcome_uncertain"}[5m])) > 0
          labels:
            severity: critical
          annotations:
            summary: An MCP mutation ended with an uncertain outcome
            description: Do not replay the operation automatically. Reconcile through the tool's durable provider receipt or idempotency boundary before retrying.
        - alert: OpenGeniMcpToolLatencyHigh
          expr: |
            histogram_quantile(
              0.95,
              sum by (le) (rate(opengeni_mcp_tool_call_duration_seconds_bucket{namespace={{ .Release.Namespace | quote }},release={{ .Release.Name | quote }},environment={{ $environment | quote }}}[10m]))
            ) > 15
            and on()
            sum(increase(opengeni_mcp_tool_call_duration_seconds_count{namespace={{ .Release.Namespace | quote }},release={{ .Release.Name | quote }},environment={{ $environment | quote }}}[10m])) >= 5
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: OpenGeni MCP tool-call p95 exceeds 15 seconds
            description: Tool latency is materially delaying turns. Split by structural outcome and compare MCP connect time before attributing this to model inference.
        - alert: OpenGeniHttp5xxRatioHigh
          expr: |
            (
              sum(increase(opengeni_http_requests_total{namespace={{ .Release.Namespace | quote }},release={{ .Release.Name | quote }},environment={{ $environment | quote }},component="api",status=~"5.."}[5m]))
              /
              clamp_min(sum(increase(opengeni_http_requests_total{namespace={{ .Release.Namespace | quote }},release={{ .Release.Name | quote }},environment={{ $environment | quote }},component="api"}[5m])), 1)
            ) > 0.05
            and on()
            sum(increase(opengeni_http_requests_total{namespace={{ .Release.Namespace | quote }},release={{ .Release.Name | quote }},environment={{ $environment | quote }},component="api"}[5m])) >= 10
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: OpenGeni API 5xx responses exceed 5%
            description: Group the bounded route/status series in Grafana, then correlate the affected route with Postgres append latency and application logs.
        - alert: OpenGeniCoreReadLatencyHigh
          expr: |
            histogram_quantile(
              0.95,
              sum by (le, route) (rate(opengeni_http_request_duration_seconds_bucket{namespace={{ .Release.Namespace | quote }},release={{ .Release.Name | quote }},environment={{ $environment | quote }},component="api",method="GET",route=~"/v1/workspaces/:workspaceId|/v1/workspaces/:workspaceId/sessions|/v1/workspaces/:workspaceId/sessions/:id"}[10m]))
            ) > 2
            and on(route)
            sum by (route) (increase(opengeni_http_request_duration_seconds_count{namespace={{ .Release.Namespace | quote }},release={{ .Release.Name | quote }},environment={{ $environment | quote }},component="api",method="GET",route=~"/v1/workspaces/:workspaceId|/v1/workspaces/:workspaceId/sessions|/v1/workspaces/:workspaceId/sessions/:id"}[10m])) >= 10
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: OpenGeni core read p95 exceeds 2 seconds on {{ "{{ $labels.route }}" }}
            description: Workspace or session reads are slow enough to degrade the interactive control plane. Inspect database CPU, active queries, event append latency, and request volume before scaling API pods.
        - alert: OpenGeniSandboxCreateFailureRatio
          expr: |
            (
              sum(increase(opengeni_sandbox_creates_total{outcome="failed"}[10m]))
              /
              clamp_min(sum(increase(opengeni_sandbox_creates_total[10m])), 1)
            ) > 0.2
            and on()
            sum(increase(opengeni_sandbox_creates_total[10m])) >= 5
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: OpenGeni sandbox create failures exceed 20%
        - alert: OpenGeniSandboxLogicalProvisionFailureRatio
          expr: |
            (
              sum by (backend) (increase(opengeni_sandbox_provisions_total{outcome="failed"}[10m]))
              /
              clamp_min(sum by (backend) (increase(opengeni_sandbox_provisions_total{outcome=~"completed|failed"}[10m])), 1)
            ) > 0.2
            and
            sum by (backend) (increase(opengeni_sandbox_provisions_total{outcome=~"completed|failed"}[10m])) >= 5
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: OpenGeni logical sandbox provision failures exceed 20%
            description: Expected lease and lifecycle transitions are excluded. Inspect failure category/stage and internal attempt metrics before changing retry policy.
        - alert: OpenGeniSandboxUnknownProvisionFailureRatio
          expr: |
            (
              sum by (backend) (increase(opengeni_sandbox_provisions_total{outcome="failed",category="unknown"}[30m]))
              /
              clamp_min(sum by (backend) (increase(opengeni_sandbox_provisions_total{outcome="failed"}[30m])), 1)
            ) >= 0.01
            and
            sum by (backend) (increase(opengeni_sandbox_provisions_total{outcome="failed"}[30m])) >= 20
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: OpenGeni unknown logical sandbox provision failures are at least 1%
            description: Extend the structural taxonomy at the owning typed boundary; do not classify failures from raw message text or add ambiguous provider retries.
        - alert: OpenGeniSandboxWarmingTimeout
          expr: sum(increase(opengeni_sandbox_warming_timeouts_total[15m])) > 0
          labels:
            severity: warning
          annotations:
            summary: OpenGeni observed a sandbox warming timeout
        {{- if $opensandboxEnabled }}
        - alert: OpenGeniOpenSandboxApiThrottled
          expr: |
            sum(increase(opengeni_sandbox_provider_api_throttles_total{backend="opensandbox"}[10m])) > 0
            or
            sum(increase(rest_client_requests_total{namespace="opensandbox-system",code="429"}[10m])) > 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: OpenSandbox API requests are being throttled
            description: OpenGeni received an HTTP 429 while creating or renewing an OpenSandbox sandbox. Inspect server and Kubernetes API capacity before retry pressure grows.
        - alert: OpenGeniOpenSandboxTtlRenewalFailed
          expr: sum(increase(opengeni_sandbox_ttl_renewals_total{backend="opensandbox",outcome="failed"}[10m])) > 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: OpenSandbox TTL renewal failed
            description: An exact live OpenSandbox instance could not refresh its provider expiry. Correlate the worker log by workspace, sandbox group, lease epoch, attempt, and opaque sandbox ID before the provider TTL elapses.
        - alert: OpenGeniOpenSandboxPoolDepleted
          expr: |
            (
              opensandbox_pool_status_available{namespace="opensandbox"}
              < opensandbox_pool_spec_buffer_min{namespace="opensandbox"}
            )
            or
            (
              opensandbox_pool_status_available{namespace="opensandbox"} == 0
              and opensandbox_pool_status_allocated{namespace="opensandbox"} >= opensandbox_pool_spec_pool_max{namespace="opensandbox"}
              and opensandbox_pool_spec_pool_max{namespace="opensandbox"} > 0
            )
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: An OpenSandbox Pool has depleted its available capacity
            description: Available Pool Pods are below the configured warm buffer or the Pool is fully allocated at PoolMax.
        - alert: OpenGeniOpenSandboxInventoryStale
          expr: |
            min(
              time() - opengeni_sandbox_inventory_refresh_timestamp_seconds{domain="opensandbox_kubernetes"}
            ) > {{ $inventoryFreshnessSeconds }}
            or absent(opengeni_sandbox_inventory_refresh_timestamp_seconds{domain="opensandbox_kubernetes"})
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: OpenSandbox workload inventory telemetry is stale or absent
            description: No control replica has completed a fresh bounded Kubernetes projection. Workload threshold alerts intentionally fail closed until the list-only inventory refresh recovers.
        - alert: OpenGeniOpenSandboxPodPending
          expr: opengeni:opensandbox_workload_pods:fresh_max{condition="pending"} > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: An OpenSandbox workload Pod has remained Pending
            description: Inspect the matching BatchSandbox, scheduler reason, image state, node-pool capacity, Pod/IP limits, and resource requests.
        - alert: OpenGeniOpenSandboxImagePullFailed
          expr: opengeni:opensandbox_workload_pods:fresh_max{condition="image_pull"} > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: An OpenSandbox workload cannot pull its immutable image
            description: Inspect registry reachability, digest existence, pull credentials, and node cache state without logging credential material.
        - alert: OpenGeniOpenSandboxControllerError
          expr: |
            sum(increase(controller_runtime_reconcile_errors_total{namespace="opensandbox-system"}[10m])) > 0
            or
            absent(kube_pod_status_ready{namespace="opensandbox-system",pod=~"opensandbox-controller-manager-.*",condition="true"}) == 1
            or
            sum(kube_pod_status_ready{namespace="opensandbox-system",pod=~"opensandbox-controller-manager-.*",condition="true"} == 1) < 1
            or
            sum(increase(kube_pod_container_status_restarts_total{namespace="opensandbox-system",pod=~"opensandbox-controller-manager-.*",container="manager"}[10m])) > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: The OpenSandbox controller is unavailable or repeatedly failing
            description: The pinned controller metrics endpoint reports reconcile errors; Kubernetes readiness and restart truth remain independent backstops.
        - alert: OpenGeniOpenSandboxCapacityExhausted
          expr: opengeni:opensandbox_workload_pods:fresh_max{condition="unschedulable"} > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: OpenSandbox workloads are unschedulable from cluster capacity exhaustion
            description: Inspect node-pool maximums, Pod/IP ceilings, quota, CPU, memory, ephemeral storage, taints, and selectors before increasing create concurrency.
        - alert: OpenGeniOpenSandboxCleanupStuck
          expr: opengeni:opensandbox_cleanup_stuck:fresh_max > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: OpenSandbox cleanup is blocked by a BatchSandbox finalizer
            description: At least one BatchSandbox has remained deleting with finalizers past the cleanup threshold. Use Kubernetes inventory to identify the exact resource before any manual finalizer action.
        - alert: OpenGeniOpenSandboxExpirationOverdue
          expr: opengeni:opensandbox_expiration_overdue:fresh_max > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: An OpenSandbox BatchSandbox survived beyond its provider expiry
            description: The bounded inventory reports at least one BatchSandbox beyond the 180-second provider TTL cleanup bound. Verify controller health, finalizers, and exact resource ownership in Kubernetes.
        {{- end }}
        - alert: OpenGeniSandboxOperationFailureRatio
          expr: |
            (
              sum by (backend, op) (increase(opengeni_sandbox_operations_total{outcome="failed"}[10m]))
              /
              clamp_min(sum by (backend, op) (increase(opengeni_sandbox_operations_total{outcome=~"ok|failed"}[10m])), 1)
            ) > 0.2
            and
            sum by (backend, op) (increase(opengeni_sandbox_operations_total{outcome=~"ok|failed"}[10m])) >= 5
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: OpenGeni routed sandbox operation failures exceed 20%
        - alert: OpenGeniSandboxOrphansTerminatedGrowing
          expr: sum(increase(opengeni_sandbox_orphans_terminated_total[30m])) > 0
          labels:
            severity: warning
          annotations:
            summary: OpenGeni reaper terminated provider-side orphan sandboxes
        - alert: OpenGeniSandboxRotationOverdue
          expr: opengeni:sandbox_rotation_backlog:fresh_max{kind="overdue"} > 0
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: OpenGeni has a sandbox past its provider deadline
            description: A finite-lifetime sandbox has remained past its precomputed provider deadline for 10m. Check turn, direct-operation, and retained-process blockers, checkpoint capture, reaper health, and Modal API errors before the provider kills it.
        - alert: OpenGeniSandboxCheckpointDeletionFailed
          expr: opengeni:sandbox_checkpoint_artifacts:fresh_max{state="delete_failed"} > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: OpenGeni cannot garbage-collect a provider checkpoint
            description: A provider-bound checkpoint deletion has failed for 15m. Credential/workspace rotation is a common intentional fence; inspect the artifact binding and deletion error instead of deleting under ambient credentials.
        - alert: OpenGeniRetainedProcessTerminalOwnerBacklog
          expr: sum(opengeni:retained_processes_terminal_owner_backlog:fresh_max) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: OpenGeni has retained sandbox processes whose logical owners are terminal
            description: A completed/failed/cancelled owner still has a physical sandbox process after 15m. Inspect provider-binding, probe, and settlement outcomes; age alone is never exit proof.
        - alert: OpenGeniSandboxDrainExpired
          expr: sum(opengeni:sandbox_leases_expired_draining:fresh_max{age_bucket=~"5m_1h|1h_1d|gte_1d"}) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: OpenGeni has a sandbox stuck in draining
            description: A refcount-zero sandbox has exceeded its drain deadline. Check archive capture, provider termination, checkpoint publication, and reaper errors.
        - alert: OpenGeniSandboxInventoryProjectionStale
          expr: |
            min by (domain) (
              time() - opengeni_sandbox_inventory_refresh_timestamp_seconds{domain!="opensandbox_kubernetes"}
            ) > {{ $inventoryFreshnessSeconds }}
            or absent(opengeni_sandbox_inventory_refresh_timestamp_seconds{domain="leases"})
            or absent(opengeni_sandbox_inventory_refresh_timestamp_seconds{domain="checkpoint_artifacts"})
            or absent(opengeni_sandbox_inventory_refresh_timestamp_seconds{domain="rotation_backlog"})
            or absent(opengeni_sandbox_inventory_refresh_timestamp_seconds{domain="retained_processes"})
            or absent(opengeni_sandbox_inventory_refresh_timestamp_seconds{domain="expired_drains"})
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: OpenGeni sandbox inventory telemetry is stale or absent
            description: No control replica has completed a fresh database projection for at least one sandbox inventory domain. Threshold alerts for that domain intentionally fail closed until projection health returns.
        - alert: OpenGeniCodexCredentialPoolEmpty
          expr: increase(opengeni_codex_pool_low_total{depth="zero"}[5m]) > 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: A Codex workspace observed no eligible subscription credentials
        - alert: OpenGeniCodexCredentialPoolSingle
          expr: increase(opengeni_codex_pool_low_total{depth="one"}[15m]) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: A Codex workspace is operating with only one eligible subscription credential
        - alert: OpenGeniServiceDown
          expr: up{job=~".*opengeni.*"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: An OpenGeni service target is down
        # ── Worker memory headroom ───────────────────────────────────────────
        - alert: OpenGeniTurnWorkerMemoryHeadroomLow
          expr: |
            max by (instance, scope) (opengeni_turn_worker_memory_guard_utilization_ratio)
            >= on (instance, scope)
            max by (instance, scope) (opengeni_turn_worker_memory_guard_target_ratio)
          for: 30s
          labels:
            severity: warning
          annotations:
            summary: A resource-based turn worker reached its admission target
            description: Temporal should stop admitting more work while HPA or queued capacity absorbs load. This is backpressure, not a restart condition.
        - alert: OpenGeniTurnWorkerMemoryEmergency
          expr: |
            max by (instance, scope) (opengeni_turn_worker_memory_guard_utilization_ratio)
            >= on (instance, scope)
            max by (instance, scope) (opengeni_turn_worker_memory_guard_emergency_ratio)
          for: 30s
          labels:
            severity: critical
          annotations:
            summary: A turn worker crossed its emergency memory threshold
            description: Admission already stopped, but in-flight work retained enough memory to enter the last-resort graceful drain window.
        - alert: OpenGeniTurnWorkerMemoryConsumesReserve
          expr: |
            max by (instance, scope) (opengeni_turn_worker_memory_guard_process_rss_ratio)
            > on (instance, scope)
            clamp_min(
              1 - max by (instance, scope) (opengeni_turn_worker_memory_guard_target_ratio),
              0
            )
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: One turn worker RSS consumes more than the configured memory reserve
            description: The worker process alone is larger than the headroom reserved above ordinary admission. Reduce per-turn retention or isolate the worker before pressure reaches the emergency threshold.
        - alert: OpenGeniTurnWorkerMemoryGuardDraining
          expr: sum(increase(opengeni_turn_worker_memory_guard_drains_total[10m])) > 0
          labels:
            severity: warning
          annotations:
            summary: A turn worker requested a memory-pressure safety drain
            description: Sustained host or finite-cgroup memory pressure triggered the normal graceful worker shutdown/checkpoint path. Inspect long-running turns and retained external memory before replacement capacity repeats the event.
        - alert: OpenGeniTurnWorkerMemoryGuardFailure
          expr: |
            (sum(increase(opengeni_turn_worker_memory_guard_sample_failures_total[10m])) or vector(0))
            +
            (sum(increase(opengeni_turn_worker_memory_guard_drain_failures_total[10m])) or vector(0))
            > 0
          labels:
            severity: critical
          annotations:
            summary: The turn-worker memory guard could not sample pressure or request a drain
            description: The hard headroom protection is degraded. Restore readable host/cgroup memory signals and the graceful worker lifecycle before admitting sustained turn load.
        # ── OpenGeni-hosting node pressure ───────────────────────────────────
        - alert: OpenGeniNodeMemoryPressureStalled
          expr: |
            opengeni:node_memory_psi_stall_ratio > 0.1
            and on (node)
            opengeni:workload_node:present
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: An OpenGeni node is losing more than 10% of execution time to memory stalls
            description: Sustained memory PSI indicates reclaim or swap contention across the node, even when no pod has a finite memory limit.
        - alert: OpenGeniNodeIoPressureStalled
          expr: |
            opengeni:node_io_psi_stall_ratio > 0.1
            and on (node)
            opengeni:workload_node:present
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: An OpenGeni node is losing more than 10% of execution time to I/O stalls
            description: Sustained I/O PSI can stall the container runtime, DNS, NATS, Temporal, and every worker together on a single node.
        - alert: OpenGeniNodeSwapThrashing
          expr: |
            opengeni:node_swap_out_pages_per_second > 0
            and on (node)
            opengeni:node_memory_psi_stall_ratio > 0.1
            and on (node)
            opengeni:workload_node:present
          labels:
            severity: critical
          annotations:
            summary: An OpenGeni node is swapping while processes are stalled on memory
            description: Active swap-out combined with memory PSI is a host-wide collapse signal, not an isolated provider or network error.
        - alert: OpenGeniNodeContainerRuntimeErrors
          expr: |
            sum by (node, operation_type) (
              increase(kubelet_runtime_operations_errors_total[5m])
              * on (job, instance) group_left (node)
              opengeni:kubelet_instance:info
            ) > 0
            and on (node)
            opengeni:workload_node:present
          labels:
            severity: critical
          annotations:
            summary: Kubelet container-runtime operations are failing on an OpenGeni node
            description: Runtime errors during node pressure can make unrelated services appear unavailable and can prevent clean replacement capacity from starting.
        - alert: OpenGeniNodeNotReady
          expr: |
            max by (node) (
              kube_node_status_condition{condition="Ready", status="true"}
            ) == 0
            and on (node)
            opengeni:workload_node:present
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: A node hosting OpenGeni is NotReady
            description: Treat simultaneous service, DNS, transport, and provider failures as a node incident until readiness and pressure signals recover.
        # ── Streaming health ─────────────────────────────────────────────────
        # SLIs from the token-streaming pipeline, split so an alert names the
        # layer: the model (TTFT), the durable write path (append), or delivery
        # (publish). Thresholds are starters — tune per deployment.
        - alert: OpenGeniStreamingFirstTokenSlow
          expr: histogram_quantile(0.99, sum by (le, provider) (rate(opengeni_stream_ttft_seconds_bucket{namespace={{ .Release.Namespace | quote }},release={{ .Release.Name | quote }},environment={{ $environment | quote }}}[10m]))) > 8
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: OpenGeni p99 time-to-first-token exceeds 8s
            description: The model is slow to START streaming (p99 TTFT by provider above 8s for 15m). Suspect the model provider before the write/delivery path.
        - alert: OpenGeniEventAppendLatencyHigh
          expr: histogram_quantile(0.99, sum by (le) (rate(opengeni_session_event_append_seconds_bucket{namespace={{ .Release.Namespace | quote }},release={{ .Release.Name | quote }},environment={{ $environment | quote }}}[10m]))) > 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: OpenGeni session-event append p99 exceeds 1s (durable write path)
            description: appendSessionEvents p99 is above 1s for 10m — Postgres is the streaming bottleneck, not the model or NATS.
        - alert: OpenGeniEventAppendLatencyCritical
          expr: histogram_quantile(0.99, sum by (le) (rate(opengeni_session_event_append_seconds_bucket{namespace={{ .Release.Namespace | quote }},release={{ .Release.Name | quote }},environment={{ $environment | quote }}}[5m]))) > 2
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: OpenGeni session-event append p99 exceeds 2s
            description: The durable Postgres write path is critically saturated. Inspect database CPU, active sessions, hot statements, and application request pressure before scaling stateless pods.
        - alert: OpenGeniEventPublishLatencyHigh
          expr: histogram_quantile(0.99, sum by (le) (rate(opengeni_session_event_publish_seconds_bucket{namespace={{ .Release.Namespace | quote }},release={{ .Release.Name | quote }},environment={{ $environment | quote }}}[10m]))) > 0.5
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: OpenGeni live-publish p99 exceeds 500ms (delivery path)
            description: The best-effort NATS live fan-out p99 is above 500ms for 10m — live delivery is degraded (events stay durable and reconcile on stream replay).
        # ── Context / compaction ─────────────────────────────────────────────
        - alert: OpenGeniCompactionNotFiring
          # Contexts running hot (p90 observed input tokens high) while NO
          # compaction has fired in 30m — sessions are drifting toward overflow.
          # The 150k token threshold assumes a ~200k-window model; tune to yours.
          # `or vector(0)` is load-bearing: on a fresh cluster the compaction
          # counter has NEVER been created, so a bare `sum(increase(...)) == 0`
          # is an EMPTY vector, not 0 — the conjunction would silently never fire
          # exactly when compaction has never fired. The fallback forces a real 0.
          expr: |
            histogram_quantile(0.9, sum by (le) (rate(opengeni_model_input_tokens_bucket[30m]))) > 150000
            and on()
            (sum(increase(opengeni_context_compactions_total[30m])) or vector(0)) == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: OpenGeni contexts are running hot but compaction has not fired in 30m
        - alert: OpenGeniCodexPromptCacheHitRatioLow
          # The codex-subscription prompt cache is doing little work: median per-call
          # cache-hit ratio below 40% over 30m while codex calls are actually flowing.
          # A sustained drop is the signature of prompt-cache thrash (e.g. an account
          # rotation cold-starting the provider's per-account cache).
          # `or vector(0)` on the traffic gate is load-bearing (the #367 lesson): with
          # no codex calls yet the ratio series has never been created, so a bare
          # `_count` rate is an EMPTY vector — the fallback forces a real 0 so the
          # conjunction is well-formed and the alert simply stays quiet on no traffic.
          expr: |
            histogram_quantile(0.5, sum by (le) (rate(opengeni_model_cache_hit_ratio_bucket{provider="codex-subscription"}[30m]))) < 0.4
            and on()
            (sum(rate(opengeni_model_cache_hit_ratio_count{provider="codex-subscription"}[30m])) or vector(0)) > 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: OpenGeni codex prompt-cache hit ratio p50 below 40% over 30m
            description: The codex-subscription prompt cache is serving under 40% of prompt tokens from cache (median call) for 30m. Suspect prompt-cache thrash — an account rotation cold-starts the provider's per-account cache. Cross-check the per-call usage logs' accountChangedFromPrevCall against cachedTokens.
        - alert: OpenGeniCodexPromptCacheTelemetryMissing
          # A missing cached-token field is unknown, not a truthful 0% hit. Keep
          # that semantics while separately alerting whenever Codex calls are
          # flowing with unavailable cache-read telemetry.
          expr: |
            (sum(rate(opengeni_model_cache_read_telemetry_total{provider="codex-subscription",status="missing"}[30m])) or vector(0)) > 0
            or
            (
              sum(rate(opengeni_model_calls_total{provider="codex-subscription",outcome="completed"}[30m])) > 0
              and on()
              (sum(rate(opengeni_model_cache_read_telemetry_total{provider="codex-subscription"}[30m])) or vector(0))
              <
              sum(rate(opengeni_model_calls_total{provider="codex-subscription",outcome="completed"}[30m]))
            )
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: OpenGeni Codex prompt-cache telemetry is missing on active calls
            description: Codex-subscription model calls have omitted cached-token telemetry for 15m. Cache-hit ratio remains unknown rather than being fabricated as zero; inspect provider usage payload compatibility and worker rejected-field diagnostics.
        # ── Connected Machines (op-outcome plane) ────────────────────────────
        - alert: OpenGeniMachineOpInfraFailuresHigh
          expr: |
            (
              sum(increase(opengeni_machine_op_total{outcome="failed"}[10m]))
              /
              clamp_min(sum(increase(opengeni_machine_op_total[10m])), 1)
            ) > 0.1
            and on()
            sum(increase(opengeni_machine_op_total[10m])) >= 10
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: OpenGeni Connected Machine op infra-failure ratio exceeds 10%
        - alert: OpenGeniMachineOpHealedFaultsSpiking
          # Healed faults are the LEADING indicator of the next unhealed one — a
          # blip/backpressure the transport absorbed. A rising rate precedes real
          # op failures, so this fires EARLY (info severity) as a heads-up.
          expr: sum(rate(opengeni_machine_op_healed_total[10m])) > 0.2
          for: 15m
          labels:
            severity: info
          annotations:
            summary: OpenGeni Connected Machine healed-fault rate is elevated (leading indicator)
        # ── Worker fleet ─────────────────────────────────────────────────────
        # Google Drive scheduled knowledge sync. Every rule is fenced to the
        # exact namespace, Helm release, configured environment, and provider.
        - alert: OpenGeniGoogleDriveSyncFailureRatio
          expr: |
            (
              sum(increase(opengeni_knowledge_source_sync_runs_total{namespace={{ .Release.Namespace | quote }},release={{ .Release.Name | quote }},environment={{ $environment | quote }},provider="google_drive",outcome="failed"}[15m]))
              /
              clamp_min(sum(increase(opengeni_knowledge_source_sync_runs_total{namespace={{ .Release.Namespace | quote }},release={{ .Release.Name | quote }},environment={{ $environment | quote }},provider="google_drive"}[15m])), 1)
            ) > 0.2
            and on()
            sum(increase(opengeni_knowledge_source_sync_runs_total{namespace={{ .Release.Namespace | quote }},release={{ .Release.Name | quote }},environment={{ $environment | quote }},provider="google_drive"}[15m])) >= 5
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Google Drive knowledge-sync failures exceed 20%
            description: Inspect bounded failure reasons, provider retry, reconnect-required, and explicit limit-hit series before changing retry or source budgets.
        - alert: OpenGeniGoogleDriveReconnectRequired
          expr: |
            sum(increase(opengeni_knowledge_source_sync_reconnect_required_total{namespace={{ .Release.Namespace | quote }},release={{ .Release.Name | quote }},environment={{ $environment | quote }},provider="google_drive"}[15m])) > 0
          labels:
            severity: warning
          annotations:
            summary: A Google Drive source requires connector reconnection
            description: Reconnect through the normal user-owned connection lifecycle; never copy tokens or provider responses into operator evidence.
        - alert: OpenGeniGoogleDriveSyncLimitReached
          expr: |
            sum by (limit) (increase(opengeni_knowledge_source_sync_limit_hits_total{namespace={{ .Release.Namespace | quote }},release={{ .Release.Name | quote }},environment={{ $environment | quote }},provider="google_drive"}[30m])) > 0
          labels:
            severity: info
          annotations:
            summary: A Google Drive sync reached an explicit resource limit
            description: Inspect the limit label and source size before approving any configuration increase.
        # Eligible backlog and slot saturation are correlated on one exact
        # scrape identity before fleet aggregation. Paused human prompts never
        # enter these Temporal activity-queue signals.
        - alert: OpenGeniTurnEligibleBacklogOld
          expr: |
            max(
              opengeni_turn_eligible_backlog_oldest_age_seconds{namespace={{ .Release.Namespace | quote }},release={{ .Release.Name | quote }},environment={{ $environment | quote }},component="worker-turn"} > 30
              and on(namespace, release, environment, component, instance)
              opengeni_turn_eligible_backlog{namespace={{ .Release.Namespace | quote }},release={{ .Release.Name | quote }},environment={{ $environment | quote }},component="worker-turn"} > 0
              and on(namespace, release, environment, component, instance)
              opengeni_turn_capacity_monitor_fresh{namespace={{ .Release.Namespace | quote }},release={{ .Release.Name | quote }},environment={{ $environment | quote }},component="worker-turn"} == 1
              and on(namespace, release, environment, component, instance)
              time() - opengeni_turn_capacity_monitor_last_success_timestamp_seconds{namespace={{ .Release.Namespace | quote }},release={{ .Release.Name | quote }},environment={{ $environment | quote }},component="worker-turn"} < 45
            ) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Runnable OpenGeni turns have waited for worker admission for more than 30 seconds
            description: Temporal's runAgentTurn activity queue contains eligible work. Paused human prompts are deliberately excluded from this capacity signal.
        - alert: OpenGeniTurnSlotsSaturated
          expr: |
            max(
              opengeni_turn_slot_saturation_ratio{namespace={{ .Release.Namespace | quote }},release={{ .Release.Name | quote }},environment={{ $environment | quote }},component="worker-turn"} > 0.9
              and on(namespace, release, environment, component, instance)
              opengeni_turn_eligible_backlog{namespace={{ .Release.Namespace | quote }},release={{ .Release.Name | quote }},environment={{ $environment | quote }},component="worker-turn"} > 0
              and on(namespace, release, environment, component, instance)
              opengeni_turn_capacity_monitor_fresh{namespace={{ .Release.Namespace | quote }},release={{ .Release.Name | quote }},environment={{ $environment | quote }},component="worker-turn"} == 1
              and on(namespace, release, environment, component, instance)
              time() - opengeni_turn_capacity_monitor_last_success_timestamp_seconds{namespace={{ .Release.Namespace | quote }},release={{ .Release.Name | quote }},environment={{ $environment | quote }},component="worker-turn"} < 45
            ) > 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: A turn worker is above 90% of memory-safe slots while eligible work waits
            description: Scale the turn fleet or inspect an admission-memory contraction. The slot denominator already honors the hard per-turn memory budget.
        - alert: OpenGeniTurnCapacityMonitorStale
          expr: |
            absent(opengeni_turn_capacity_monitor_fresh{namespace={{ .Release.Namespace | quote }},release={{ .Release.Name | quote }},environment={{ $environment | quote }},component="worker-turn"}) == 1
            or
            min(opengeni_turn_capacity_monitor_fresh{namespace={{ .Release.Namespace | quote }},release={{ .Release.Name | quote }},environment={{ $environment | quote }},component="worker-turn"}) < 1
            or
            time() - min(opengeni_turn_capacity_monitor_last_success_timestamp_seconds{namespace={{ .Release.Namespace | quote }},release={{ .Release.Name | quote }},environment={{ $environment | quote }},component="worker-turn"}) > 45
            or
            min(up{namespace={{ .Release.Namespace | quote }},release={{ .Release.Name | quote }},opengeni_workload_component="worker-turns"}) < 1
            or
            count(up{namespace={{ .Release.Namespace | quote }},release={{ .Release.Name | quote }},opengeni_workload_component="worker-turns"} == 1)
              > count(opengeni_turn_capacity_monitor_fresh{namespace={{ .Release.Namespace | quote }},release={{ .Release.Name | quote }},environment={{ $environment | quote }},component="worker-turn"})
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: OpenGeni eligible-turn backlog monitoring is stale
            description: At least one expected turn-worker scrape is down, missing its monitor series, or has not produced a fresh Temporal DescribeTaskQueue sample for this exact namespace, release, and environment. Backlog values are diagnostic only until freshness recovers.
        # The remaining rules read cluster-infra series (cAdvisor and
        # kube-state-metrics); without those exporters they remain absent.
        # Additional environment-specific alerts may be appended with
        # observability.prometheusRule.rules.
        - alert: OpenGeniWorkerMemoryNearLimit
          expr: |
            max by (namespace, pod, container) (
              container_memory_working_set_bytes{container=~"worker|api|relay", pod=~".*opengeni.*"}
            )
            /
            max by (namespace, pod, container) (
              kube_pod_container_resource_limits{resource="memory", container=~"worker|api|relay", pod=~".*opengeni.*"}
            ) > 0.9
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: An OpenGeni container is above 90% of its memory limit (pre-OOM)
            description: The worker holds the full in-turn history in memory; sustained >90% of the limit precedes an OOM kill mid-turn.
        - alert: OpenGeniHpaAtMaxReplicas
          expr: |
            kube_horizontalpodautoscaler_status_current_replicas{horizontalpodautoscaler=~".*opengeni.*"}
            >= kube_horizontalpodautoscaler_spec_max_replicas{horizontalpodautoscaler=~".*opengeni.*"}
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: An OpenGeni HPA has been pinned at maxReplicas (capacity saturation)
            description: The autoscaler cannot add more pods; sustained saturation means turns queue. Raise maxReplicas or investigate the load source.
        {{- with ((.Values.observability).prometheusRule).rules }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
{{- end }}
