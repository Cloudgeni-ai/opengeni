{{- if .Values.relay.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "opengeni.fullname" . }}-relay
  labels:
    {{- include "opengeni.labels" . | nindent 4 }}
    app.kubernetes.io/component: relay
  {{- if and ((.Values.observability).metrics).enabled (not .Values.relay.metricsPort) }}
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: {{ .Values.relay.service.port | quote }}
  {{- end }}
spec:
  type: {{ .Values.relay.service.type }}
  ports:
    - port: {{ .Values.relay.service.port }}
      targetPort: wss
      protocol: TCP
      name: wss
      {{- with .Values.relay.service.nodePort }}
      nodePort: {{ . }}
      {{- end }}
  selector:
    {{- include "opengeni.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: relay
{{- with .Values.relay.metricsPort }}
---
# Internal-only Prometheus endpoint. Always ClusterIP, so a NodePort or
# LoadBalancer relay Service never publishes it, and no Ingress routes to it.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "opengeni.fullname" $ }}-relay-metrics
  labels:
    {{- include "opengeni.labels" $ | nindent 4 }}
    app.kubernetes.io/component: relay
    opengeni.ai/metrics-endpoint: "true"
  {{- if (($.Values.observability).metrics).enabled }}
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: {{ . | quote }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - port: {{ . }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "opengeni.selectorLabels" $ | nindent 4 }}
    app.kubernetes.io/component: relay
{{- end }}
{{- end }}
