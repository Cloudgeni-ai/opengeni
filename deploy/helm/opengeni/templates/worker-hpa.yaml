{{- range $role := list "control" "turns" }}
{{- $config := index $.Values.worker $role }}
{{- $queueDemand := and (eq $role "turns") $config.autoscaling.queueDemand.enabled }}
{{- if and $.Values.worker.enabled $config.autoscaling.enabled }}
{{- if ne $role "control" }}
---
{{- end }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "opengeni.fullname" $ }}-worker-{{ $role }}
  labels:
    {{- include "opengeni.labels" $ | nindent 4 }}
    app.kubernetes.io/component: worker-{{ $role }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "opengeni.fullname" $ }}-worker-{{ $role }}
  minReplicas: {{ $config.autoscaling.minReplicas }}
  maxReplicas: {{ $config.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ if $queueDemand }}70{{ else }}{{ $config.autoscaling.targetCPUUtilizationPercentage }}{{ end }}
    {{- if or $queueDemand $config.autoscaling.targetMemoryUtilizationPercentage }}
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: {{ if $queueDemand }}80{{ else }}{{ $config.autoscaling.targetMemoryUtilizationPercentage }}{{ end }}
    {{- end }}
    {{- if eq $role "turns" }}
    {{- with $config.autoscaling.slotSaturationMetric }}
    {{- if .enabled }}
    - type: Pods
      pods:
        metric:
          name: {{ .name }}
        target:
          type: AverageValue
          averageValue: {{ .targetAverageValue | quote }}
    {{- end }}
    {{- end }}
    {{- end }}
    {{- if $queueDemand }}
    - type: Pods
      pods:
        metric:
          name: opengeni_turns_inflight
        target:
          type: AverageValue
          averageValue: "8"
    {{- range $metric := list "opengeni_turn_worker_demand" "opengeni_turn_worker_queued" "opengeni_turn_worker_busy" }}
    - type: Object
      object:
        describedObject:
          apiVersion: v1
          kind: Namespace
          name: {{ $.Release.Namespace }}
        metric:
          name: {{ $metric }}
          selector:
            matchLabels:
              release: {{ $.Release.Name | quote }}
        target:
          type: AverageValue
          averageValue: {{ if eq $metric "opengeni_turn_worker_busy" }}"1"{{ else }}{{ $config.autoscaling.queueDemand.targetAverageValue | quote }}{{ end }}
    {{- end }}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - type: Pods
          value: 4
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 600
      selectPolicy: Disabled
      policies:
        - type: Pods
          value: 1
          periodSeconds: 300
    {{- else }}
    {{- with $config.autoscaling.customMetrics }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with $config.autoscaling.behavior }}
  behavior:
    {{- toYaml . | nindent 4 }}
  {{- end }}
    {{- end }}
{{- end }}
{{- end }}
