{{- if and .Values.computeControl.enabled .Values.computeControl.sweep.enabled }}
{{- $cc := .Values.computeControl }}
# The store's daily sweep (ADR 17, 25): fences every pointer the service
# keeps, then deletes chunks and manifests none names whose day ended a
# whole day before. Safe while hosts archive, on any object store; one at a
# time. It reads the pointers from the service's database, so it refuses to
# start until the fleet's pointers are in it.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ printf "%s-sweep" (include "opengeni.computeControl.name" .) | trunc 52 | trimSuffix "-" }}
  labels:
    {{- include "opengeni.labels" . | nindent 4 }}
    app.kubernetes.io/component: compute-sweep
spec:
  schedule: {{ $cc.sweep.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            {{- include "opengeni.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: compute-sweep
        spec:
          restartPolicy: OnFailure
          serviceAccountName: {{ include "opengeni.computeControl.serviceAccountName" . }}
          enableServiceLinks: false
          {{- with .Values.global.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            fsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: sweep
              image: {{ include "opengeni.computeControl.image" . | quote }}
              imagePullPolicy: {{ $cc.image.pullPolicy }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              command:
                - /usr/local/bin/compute-control
                - sweep
                - --store={{ $cc.archive }}
                - --connections=2
                - --delete
              env:
                - name: RUST_LOG
                  value: info
                {{- if $cc.database.urlKey }}
                - name: COMPUTE_CONTROL_DATABASE
                  valueFrom:
                    secretKeyRef:
                      name: {{ $cc.database.existingSecret }}
                      key: {{ $cc.database.urlKey }}
                {{- else }}
                - name: COMPUTE_CONTROL_DATABASE_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ $cc.database.existingSecret }}
                      key: {{ $cc.database.passwordKey }}
                - name: COMPUTE_CONTROL_DATABASE
                  value: {{ include "opengeni.computeControl.databaseSettings" . | quote }}
                {{- end }}
                {{- with $cc.extraEnv }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
              {{- with $cc.extraVolumeMounts }}
              volumeMounts:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              resources:
                {{- toYaml $cc.resources | nindent 16 }}
          {{- with $cc.extraVolumes }}
          volumes:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $cc.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with $cc.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
