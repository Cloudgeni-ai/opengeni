{{- if .Values.artifactMaterializer.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "opengeni.fullname" . }}-artifact-materializer
  labels:
    {{- include "opengeni.labels" . | nindent 4 }}
    app.kubernetes.io/component: artifact-materializer
  {{- if ((.Values.observability).metrics).enabled }}
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: {{ ((.Values.observability).metrics).path | default "/metrics" | quote }}
    prometheus.io/port: {{ .Values.artifactMaterializer.service.port | quote }}
  {{- end }}
spec:
  type: {{ .Values.artifactMaterializer.service.type }}
  ports:
    - port: {{ .Values.artifactMaterializer.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "opengeni.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: artifact-materializer
{{- end }}
