{{- if and .Values.networkPolicy.enabled .Values.appHost.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "opengeni.fullname" . }}-app-host
  labels:
    {{- include "opengeni.labels" . | nindent 4 }}
    app.kubernetes.io/component: app-host
spec:
  podSelector:
    matchLabels:
      {{- include "opengeni.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: app-host
  policyTypes:
    - Ingress
    {{- if .Values.networkPolicy.egress.enabled }}
    - Egress
    {{- end }}
  ingress:
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.ingressController.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.networkPolicy.ingressController.podSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: {{ .Values.appHost.containerPort }}
    {{- if and ((.Values.observability).metrics).enabled (or ((.Values.observability).collector).enabled .Values.networkPolicy.monitoring) }}
    - from:
        {{- if ((.Values.observability).collector).enabled }}
        - podSelector:
            matchLabels:
              {{- include "opengeni.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: otel-collector
        {{- end }}
        {{- with .Values.networkPolicy.monitoring }}
        - namespaceSelector:
            {{- toYaml .namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .podSelector | nindent 12 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.appHost.metricsPort }}
    {{- end }}
  {{- if .Values.networkPolicy.egress.enabled }}
  egress:
    {{- if .Values.api.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "opengeni.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: api
      ports:
        - protocol: TCP
          port: {{ .Values.api.containerPort }}
    {{- end }}
    {{- if .Values.garage.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "opengeni.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: garage
      ports:
        - protocol: TCP
          port: {{ .Values.garage.service.apiPort }}
    {{- end }}
    {{- if .Values.minio.enabled }}
    - to:
        - podSelector:
            matchLabels:
              {{- include "opengeni.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: minio
      ports:
        - protocol: TCP
          port: {{ .Values.minio.service.apiPort }}
    {{- end }}
    {{- with .Values.networkPolicy.egress.rules }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
{{- end }}
