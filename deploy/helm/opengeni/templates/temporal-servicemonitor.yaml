{{- if and .Values.temporal.enabled (.Values.temporal.metrics).port ((.Values.observability).serviceMonitor).enabled (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1") }}
# The bundled Temporal server's own metrics (service_latency, persistence_latency
# and the rest), so a slow workflow start or signal can be traced to the
# frontend, history, matching or persistence layer.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "opengeni.fullname" . }}-temporal
  labels:
    {{- include "opengeni.labels" . | nindent 4 }}
    app.kubernetes.io/component: temporal
    {{- with ((.Values.observability).serviceMonitor).labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with ((.Values.observability).serviceMonitor).annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "opengeni.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: temporal
      opengeni.ai/metrics-endpoint: "true"
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ ((.Values.observability).serviceMonitor).interval | default "30s" | quote }}
      scrapeTimeout: {{ ((.Values.observability).serviceMonitor).scrapeTimeout | default "10s" | quote }}
      relabelings:
        - sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: namespace
        - sourceLabels: [__meta_kubernetes_service_label_app_kubernetes_io_instance]
          targetLabel: release
        - sourceLabels: [__meta_kubernetes_service_label_app_kubernetes_io_component]
          targetLabel: opengeni_workload_component
{{- end }}
