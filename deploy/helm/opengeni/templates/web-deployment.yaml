{{- if .Values.web.enabled }}
{{- $priorityClassName := include "opengeni.priorityClassName" (dict "root" . "explicit" .Values.web.priorityClassName "tier" "presentation") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opengeni.fullname" . }}-web
  labels:
    {{- include "opengeni.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicaCount }}
  {{- with .Values.web.strategy }}
  strategy:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "opengeni.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "opengeni.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: web
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.web.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "opengeni.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      terminationGracePeriodSeconds: {{ .Values.web.terminationGracePeriodSeconds }}
      {{- if $priorityClassName }}
      priorityClassName: {{ $priorityClassName | quote }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.web.podSecurityContext | nindent 8 }}
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: web
          image: {{ include "opengeni.image" (dict "root" . "image" .Values.web.image) | quote }}
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.web.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.web.containerPort }}
          envFrom:
            - configMapRef:
                name: {{ include "opengeni.fullname" . }}-config
          {{- if or .Values.web.demoApiBaseUrl .Values.api.enabled }}
          env:
            - name: OPENGENI_DEMO_API_URL
              value: {{ default (printf "http://%s-api:%d" (include "opengeni.fullname" .) (.Values.api.service.port | int)) .Values.web.demoApiBaseUrl | quote }}
            {{- if .Values.web.demoApiCredentialsSecret }}
            - name: OPENGENI_DEMO_CREDENTIALS_DIR
              value: /var/run/secrets/opengeni-demo
            {{- end }}
          {{- else }}
          env: []
          {{- end }}
          {{- if .Values.web.demoApiCredentialsSecret }}
          volumeMounts:
            - name: demo-api-credentials
              mountPath: /var/run/secrets/opengeni-demo
              readOnly: true
          {{- end }}
          {{- if .Values.web.probes.startup.enabled }}
          startupProbe:
            {{- include "opengeni.httpProbe" (dict "probe" .Values.web.probes.startup) | nindent 12 }}
          {{- end }}
          {{- if .Values.web.probes.readiness.enabled }}
          readinessProbe:
            {{- include "opengeni.httpProbe" (dict "probe" .Values.web.probes.readiness) | nindent 12 }}
          {{- end }}
          {{- if .Values.web.probes.liveness.enabled }}
          livenessProbe:
            {{- include "opengeni.httpProbe" (dict "probe" .Values.web.probes.liveness) | nindent 12 }}
          {{- end }}
          {{- with .Values.web.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- if .Values.web.demoApiCredentialsSecret }}
      volumes:
        - name: demo-api-credentials
          secret:
            secretName: {{ .Values.web.demoApiCredentialsSecret | quote }}
      {{- end }}
      {{- if .Values.web.topologySpreadConstraints.enabled }}
      topologySpreadConstraints:
        {{- include "opengeni.topologySpreadConstraints" (dict "root" . "component" "web" "values" .Values.web) | nindent 8 }}
      {{- end }}
      {{- with .Values.web.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
