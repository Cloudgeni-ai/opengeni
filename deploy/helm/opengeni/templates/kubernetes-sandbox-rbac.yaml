{{- if and .Values.kubernetesSandbox.enabled .Values.kubernetesSandbox.rbac.create }}
{{- $namespace := include "opengeni.kubernetesSandboxNamespace" . }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "opengeni.fullname" . }}-sandbox-controller
  namespace: {{ $namespace | quote }}
  labels:
    {{- include "opengeni.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "opengeni.fullname" . }}-sandbox-controller
  namespace: {{ $namespace | quote }}
  labels:
    {{- include "opengeni.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "opengeni.serviceAccountName" . }}
    namespace: {{ .Release.Namespace | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "opengeni.fullname" . }}-sandbox-controller
{{- end }}
