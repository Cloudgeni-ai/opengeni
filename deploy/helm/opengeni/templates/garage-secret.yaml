{{- if and .Values.garage.enabled (not .Values.garage.auth.existingSecret) }}
{{- include "opengeni.assertExclusiveObjectStorageFixture" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "opengeni.garageSecretName" . }}
  labels:
    {{- include "opengeni.labels" . | nindent 4 }}
    app.kubernetes.io/component: garage
type: Opaque
stringData:
  {{ .Values.garage.auth.accessKeyKey }}: {{ .Values.garage.auth.accessKey | quote }}
  {{ .Values.garage.auth.secretKeyKey }}: {{ .Values.garage.auth.secretKey | quote }}
  {{ .Values.garage.auth.rpcSecretKey }}: {{ .Values.garage.auth.rpcSecret | quote }}
  garage.toml: |
{{ include "opengeni.garageToml" . | indent 4 }}
{{- end }}
