{{- if .Values.appHost.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "opengeni.fullname" . }}-app-host
  labels:
    {{- include "opengeni.labels" . | nindent 4 }}
    app.kubernetes.io/component: app-host
  {{- if ((.Values.observability).metrics).enabled }}
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: {{ ((.Values.observability).metrics).path | default "/metrics" | quote }}
    prometheus.io/port: {{ .Values.appHost.metricsPort | quote }}
  {{- end }}
spec:
  type: {{ .Values.appHost.service.type }}
  ports:
    - port: {{ .Values.appHost.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    {{- if ((.Values.observability).metrics).enabled }}
    - port: {{ .Values.appHost.metricsPort }}
      targetPort: metrics
      protocol: TCP
      name: metrics
    {{- end }}
  selector:
    {{- include "opengeni.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: app-host
{{- end }}
