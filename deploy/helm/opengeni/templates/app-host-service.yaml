{{- if .Values.appHost.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "opengeni.fullname" . }}-app-host
  labels:
    {{- include "opengeni.labels" . | nindent 4 }}
    app.kubernetes.io/component: app-host
spec:
  type: {{ .Values.appHost.service.type }}
  ports:
    - port: {{ .Values.appHost.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "opengeni.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: app-host
{{- end }}
