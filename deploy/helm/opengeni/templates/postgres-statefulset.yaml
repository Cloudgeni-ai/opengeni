{{- if .Values.postgres.enabled }}
{{- $priorityClassName := include "opengeni.priorityClassName" (dict "root" . "explicit" .Values.postgres.priorityClassName "tier" "durable") }}
{{- $upgrade := .Values.postgres.majorUpgrade }}
{{- $image := printf "%s:%s" .Values.postgres.image.repository .Values.postgres.image.tag }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "opengeni.fullname" . }}-postgres-upgrade
  labels:
    {{- include "opengeni.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
data:
  postgres-major-upgrade.sh: |-
    {{- .Files.Get "files/postgres-major-upgrade.sh" | nindent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "opengeni.fullname" . }}-postgres
  labels:
    {{- include "opengeni.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ include "opengeni.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "opengeni.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        {{- include "opengeni.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
      annotations:
        checksum/postgres-upgrade: {{ .Files.Get "files/postgres-major-upgrade.sh" | sha256sum | quote }}
    spec:
      {{- if $priorityClassName }}
      priorityClassName: {{ $priorityClassName | quote }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.postgres.podSecurityContext | nindent 8 }}
      initContainers:
        {{- if $upgrade.enabled }}
        # Copies the older server's binaries and extension files so the
        # upgrade step can run pg_upgrade. Copies only when the data directory
        # was written by this image's major version.
        - name: postgres-old-binaries
          image: {{ printf "%s:%s" $upgrade.fromImage.repository $upgrade.fromImage.tag | quote }}
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          command:
            - /bin/sh
            - -ec
            - |
              if [ "$(cat "$PGDATA/PG_VERSION" 2>/dev/null)" = "${PG_MAJOR%%.*}" ]; then
                major="${PG_MAJOR%%.*}"
                mkdir -p /opengeni-postgres-old/usr/lib/postgresql /opengeni-postgres-old/usr/share/postgresql
                cp -a "/usr/lib/postgresql/$major" /opengeni-postgres-old/usr/lib/postgresql/
                cp -a "/usr/share/postgresql/$major" /opengeni-postgres-old/usr/share/postgresql/
              fi
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              readOnly: true
            - name: postgres-old
              mountPath: /opengeni-postgres-old
        {{- end }}
        # Refuses to start a newer server on an older data directory, and
        # upgrades it in place when postgres.majorUpgrade.enabled is set.
        - name: postgres-data-version
          image: {{ $image | quote }}
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          command: ["/bin/bash", "/opengeni-postgres-upgrade/postgres-major-upgrade.sh"]
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_USER
              value: {{ .Values.postgres.auth.username | quote }}
            - name: OPENGENI_POSTGRES_MAJOR_UPGRADE
              value: {{ ternary "true" "false" (eq $upgrade.enabled true) | quote }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: postgres-upgrade-script
              mountPath: /opengeni-postgres-upgrade
              readOnly: true
            {{- if $upgrade.enabled }}
            - name: postgres-old
              mountPath: /opengeni-postgres-old
              readOnly: true
            {{- end }}
      containers:
        - name: postgres
          image: {{ $image | quote }}
          imagePullPolicy: {{ .Values.postgres.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.postgres.securityContext | nindent 12 }}
          {{- with .Values.postgres.parameters }}
          args:
            {{- range $name, $value := . }}
            {{- if not (regexMatch "^[A-Za-z_][A-Za-z0-9_.]*$" $name) }}
            {{- fail (printf "postgres.parameters key %q is not a valid PostgreSQL setting name" $name) }}
            {{- end }}
            - "-c"
            - {{ printf "%s=%v" $name $value | quote }}
            {{- end }}
          {{- end }}
          ports:
            - name: postgres
              containerPort: {{ .Values.postgres.service.port }}
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.auth.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.auth.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "opengeni.postgresSecretName" . }}
                  key: {{ .Values.postgres.auth.passwordKey }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 20
          {{- with .Values.postgres.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-upgrade-script
          configMap:
            name: {{ include "opengeni.fullname" . }}-postgres-upgrade
        {{- if $upgrade.enabled }}
        - name: postgres-old
          emptyDir: {}
        {{- end }}
        {{- if not .Values.postgres.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
  {{- if .Values.postgres.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.postgres.persistence.storageClassName }}
        storageClassName: {{ .Values.postgres.persistence.storageClassName | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.persistence.size | quote }}
  {{- end }}
{{- end }}
