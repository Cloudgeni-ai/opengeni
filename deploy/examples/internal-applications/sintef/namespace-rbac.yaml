apiVersion: v1
kind: Namespace
metadata:
  name: opengeni-internal-apps
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opengeni-internal-app-deployer
  namespace: opengeni-internal-apps
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opengeni-internal-apps
  namespace: opengeni-internal-apps
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: opengeni-internal-app-deployer
  namespace: opengeni-internal-apps
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "create", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "create", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: opengeni-internal-app-deployer
  namespace: opengeni-internal-apps
subjects:
  - kind: ServiceAccount
    name: opengeni-internal-app-deployer
    namespace: opengeni-internal-apps
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: opengeni-internal-app-deployer
