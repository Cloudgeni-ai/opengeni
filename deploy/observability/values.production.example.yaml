# Capacity and credential posture for a larger installation. Layer private
# ingress/TLS, Alertmanager receivers, and provider-specific scheduling values
# in an operator-controlled file rather than committing them here.

kube-prometheus-stack:
  prometheus:
    prometheusSpec:
      externalLabels:
        environment: production
      # Startup SLO dashboards expose both 7d and 30d windows. These are
      # independent upper bounds: Prometheus deletes data when either the time
      # limit or size limit is reached, so 80 GB may retain less than 30 days.
      # Measure actual series volume and ingestion, then raise local capacity or
      # configure remote write if 30 days is an operational requirement.
      retention: 30d
      retentionSize: 80GB
      resources:
        requests:
          cpu: 500m
          memory: 512Mi
        limits:
          cpu: 2
          memory: 1Gi
      storageSpec:
        volumeClaimTemplate:
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 100Gi

  alertmanager:
    alertmanagerSpec:
      resources:
        requests:
          cpu: 100m
          memory: 64Mi
        limits:
          cpu: 500m
          memory: 128Mi
      storage:
        volumeClaimTemplate:
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 5Gi

  grafana:
    admin:
      existingSecret: opengeni-grafana-admin
      userKey: admin-user
      passwordKey: admin-password
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 384Mi
    persistence:
      enabled: true
      type: pvc
      accessModes:
        - ReadWriteOnce
      size: 5Gi
