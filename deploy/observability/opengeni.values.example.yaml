# Include this file in the Opengeni application-chart upgrade after the
# opengeni-observability release has installed the Prometheus Operator CRDs.

observability:
  metrics:
    enabled: true
  serviceMonitor:
    enabled: true
    labels:
      opengeni.ai/monitoring: enabled
  prometheusRule:
    enabled: true
    labels:
      opengeni.ai/monitoring: enabled
