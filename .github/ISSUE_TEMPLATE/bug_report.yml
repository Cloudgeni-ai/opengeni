name: Bug report
description: Report a reproducible problem in Opengeni
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What goes wrong?
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Why it matters
      description: Who is affected and how? What does it block or cost you (lost work, a broken workflow, a workaround you rely on)?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      value: |
        - OS:
        - Bun version:
        - Sandbox backend:
        - Model provider:
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove secrets before attaching logs.
