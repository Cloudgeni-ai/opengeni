name: Install pinned Playwright browsers
description: >-
  Restore or download exactly the pinned Playwright browsers under a hard
  per-attempt wall clock. An unbounded `playwright install` can wedge for the
  full GitHub job default (360 minutes) while holding a runner slot, which
  starves every other pull request in the account. Bounding the attempt turns
  that outage into a fast, visible, re-runnable failure.

inputs:
  browsers:
    description: Space-separated Playwright browser list, for example "chromium firefox".
    required: true
  only-shell:
    description: Install the headless shell build instead of full Chromium.
    required: false
    default: "false"
  attempt-timeout-seconds:
    description: >-
      Hard wall clock for one install attempt. Deliberately stated as a rule
      rather than a percentile: independent measurements over different windows
      disagree on the per-set p99 (the three-browser set has been measured at
      both 7.5m and 27.7m), so a quoted percentile here would not reproduce.
      What does reproduce across every window measured: no SINGLE-browser
      install has ever exceeded this bound, and every observed overrun is a
      cumulative MULTI-browser download. Because the cache save below persists
      whichever browsers completed, a re-run after an overrun faces only the
      browsers that did not - which reduces to the single-browser case. Residual
      green-to-red exposure is roughly 1-2% on multi-browser sets and zero on
      single-browser sets. Worst case is this value plus the 15s SIGKILL grace,
      times `attempts`; keep that inside the calling job's timeout-minutes
      alongside that job's own declared step budgets. On Linux the first
      attempt also covers the system packages phase, as `--with-deps` did.
    required: false
    default: "900"
  attempts:
    description: >-
      Bounded attempts before the step fails. Defaults to one: a retry reuses the
      same runner, so it cannot escape a bad network path. For a
      slow-but-progressing download one long attempt strictly dominates two
      short ones. Cross-run recovery comes from the unconditional cache save
      below, which persists partial progress so a re-run resumes instead of
      repeating a cold download.
    required: false
    default: "1"
  system-deps-budget-seconds:
    description: >-
      On Linux, the most the system packages phase may take, out of the first
      attempt's wall clock. The phase skips apt when no package is missing,
      installs from the restored deb cache without the network, and only
      then downloads, retrying apt with backoff after dropping archive mirrors
      that do not resolve in favour of fallback mirrors; whatever it leaves
      goes to the first browser download.
    required: false
    default: "300"

runs:
  using: composite
  steps:
    # Inputs reach the shell through the environment, never through `${{ }}`
    # interpolation into the script body, so a value can never be parsed as
    # shell syntax.
    - name: Resolve pinned Playwright version
      id: pinned
      shell: bash
      env:
        PLAYWRIGHT_BROWSERS: ${{ inputs.browsers }}
        PLAYWRIGHT_ONLY_SHELL: ${{ inputs.only-shell }}
        RUNNER_OS: ${{ runner.os }}
      run: |
        set -euo pipefail
        version="$(node -p "require('playwright/package.json').version")"
        if [ -z "${version}" ]; then
          echo "::error::Could not resolve the installed Playwright version."
          exit 1
        fi
        slug="$(printf '%s' "${PLAYWRIGHT_BROWSERS}" | tr ' ' '-')"
        if [ "${PLAYWRIGHT_ONLY_SHELL}" = "true" ]; then
          slug="${slug}-shell"
        fi
        # Playwright downloads a different build per OS release (WebKit for
        # Ubuntu 24.04 links ICU 74, the 26.04 build links ICU 78), so the
        # cache must never cross releases: a build restored onto another
        # release counts as installed and then cannot start.
        platform="${RUNNER_OS}"
        if [ -r /etc/os-release ]; then
          platform="${RUNNER_OS}-$(. /etc/os-release && printf '%s-%s' "${ID:-unknown}" "${VERSION_ID:-unknown}")"
        fi
        echo "version=${version}" >> "$GITHUB_OUTPUT"
        echo "slug=${slug}" >> "$GITHUB_OUTPUT"
        echo "key=playwright-${platform}-${version}-${slug}" >> "$GITHUB_OUTPUT"
        # The browser system packages (debs) for every browser, shared by all
        # browser sets. The runner image version picks the exact package
        # versions; an older image's debs are still a usable fallback.
        debs_prefix="playwright-debs-${platform}-$(uname -m)-${version}-"
        echo "debs-key=${debs_prefix}${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"
        echo "debs-restore-key=${debs_prefix}" >> "$GITHUB_OUTPUT"

    # Keyed on the OS release, the exact resolved Playwright version and the
    # browser set. A miss only costs today's behaviour; a hit removes the
    # download that drives the entire hang tail. No restore-keys: a partial
    # restore of another browser set would re-download anyway and could not be
    # saved under this key.
    #
    # Split restore/save rather than `actions/cache`, whose post step is
    # `post-if: success()`. With the combined action a bounded failure never
    # saves, so a cold key on a degraded network can never converge: every
    # re-run repeats the same cold download and is killed again. Saving on
    # failure persists partial progress instead - Playwright writes its
    # INSTALLATION_COMPLETE marker last, so an incomplete browser is simply
    # re-downloaded while completed ones are kept.
    - name: Restore pinned Playwright browsers
      id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: ${{ steps.pinned.outputs.key }}

    # The browser system packages, so a job installs them without the Ubuntu
    # archive. Caches saved by default-branch runs (main CI) are readable from
    # every branch, including merge batcher candidates.
    - name: Restore browser system packages
      id: restore-debs
      if: ${{ runner.os == 'Linux' }}
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/playwright-debs
        key: ${{ steps.pinned.outputs.debs-key }}
        restore-keys: ${{ steps.pinned.outputs.debs-restore-key }}

    - name: Install pinned Playwright browsers
      id: install
      shell: bash
      env:
        PLAYWRIGHT_BROWSERS: ${{ inputs.browsers }}
        PLAYWRIGHT_ONLY_SHELL: ${{ inputs.only-shell }}
        ATTEMPT_TIMEOUT_SECONDS: ${{ inputs.attempt-timeout-seconds }}
        ATTEMPTS: ${{ inputs.attempts }}
        SYSTEM_DEPS_BUDGET_SECONDS: ${{ inputs.system-deps-budget-seconds }}
        KILL_AFTER_SECONDS: "15"
        PLAYWRIGHT_RUNNER_OS: ${{ runner.os }}
        PLAYWRIGHT_ACTION_PATH: ${{ github.action_path }}
        # Where the cache is saved, the job also completes it for every browser.
        PLAYWRIGHT_DEBS_SAVE: ${{ runner.os == 'Linux' && github.ref == 'refs/heads/main' && steps.restore-debs.outputs.cache-hit != 'true' }}
      run: PLAYWRIGHT_DEB_DIR="${HOME}/.cache/playwright-debs" bash "${PLAYWRIGHT_ACTION_PATH}/install-browsers.sh"

    # Saved only from main, whose caches every branch can read, and only once
    # the cache holds the packages of every browser, so a job for one browser
    # never stores a set another browser cannot use.
    - name: Save browser system packages
      if: ${{ always() && runner.os == 'Linux' && github.ref == 'refs/heads/main' && steps.restore-debs.outputs.cache-hit != 'true' && steps.install.outputs.debs-complete == 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/playwright-debs
        key: ${{ steps.pinned.outputs.debs-key }}

    # `always()` so a bounded failure still persists whatever downloaded, which
    # is what makes the re-run after a timeout actually converge. Skipped on a
    # hit, where the key already exists and saving would error.
    #
    # This checkpoint is ONE-SHOT, not iterative: cache keys are immutable, so
    # once a partial set is saved every later run gets a hit and skips this
    # step. One step is sufficient because it reduces the re-run to a
    # single-browser download, which has never breached the bound - but it does
    # mean a partial set persists for the life of this Playwright version.
    # A SIGKILLed install can leave a stale __dirlock behind. Playwright locks
    # the registry through proper-lockfile passing only retries/onCompromised/
    # lockfilePath, so the default `stale: 10000` applies - the lock clears
    # after ~10 seconds, not the ~5 minutes an earlier revision of this comment
    # claimed. Removing it is therefore cheap hygiene rather than a large
    # saving: it keeps a lock out of an immutable cache entry and avoids the
    # onCompromised path entirely.
    - name: Drop stale Playwright dirlock before saving
      if: ${{ always() && steps.restore.outputs.cache-hit != 'true' }}
      shell: bash
      run: rm -rf ~/.cache/ms-playwright/__dirlock

    - name: Save pinned Playwright browsers
      if: ${{ always() && steps.restore.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: ${{ steps.pinned.outputs.key }}
