name: Set up agent test NATS
description: Install the pinned real broker used by native agent transport regressions.
runs:
  using: composite
  steps:
    - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version: "1.25.12"
        cache: false
    - name: Install the test broker
      shell: bash
      run: |
        go install github.com/nats-io/nats-server/v2@v2.14.4
        nats-server --version
