version: 2
updates:
  # Workflow actions are pinned to commit SHAs (scripts/workflow-action-pinning.test.ts).
  # Dependabot keeps those pins and their version comments current in one weekly PR.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
