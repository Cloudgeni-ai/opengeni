name: PR CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        required: true
        type: string
      head_sha:
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: read

# A newer run supersedes only the same PR. Dispatch retains its explicit PR ID.
concurrency:
  group: pr-ci-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

env:
  OPENGENI_TEST_MAX_CONCURRENCY: "2"
  OPENGENI_TYPECHECK_CONCURRENCY: "1"

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      docs_only: ${{ steps.identity.outputs.docs_only }}
      head: ${{ steps.identity.outputs.head }}
      unit_count: ${{ steps.plan.outputs.unit_count }}
      web_bundle: ${{ steps.plan.outputs.web_bundle }}
      e2e_count: ${{ steps.plan.outputs.e2e_count }}
      e2e_matrix: ${{ steps.plan.outputs.e2e_matrix }}
      browser_lane_count: ${{ steps.plan.outputs.browser_lane_count }}
      browser_lane_matrix: ${{ steps.plan.outputs.browser_lane_matrix }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - id: identity
        name: Bind current exact PR head and docs-only paths
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun scripts/ci/github-pr-ci.ts identity
      - id: plan
        name: Plan all affected files
        env:
          BASE_SHA: ${{ steps.identity.outputs.base }}
          HEAD_SHA: ${{ steps.identity.outputs.head }}
        run: |
          set -euo pipefail
          bun scripts/ci/impact.ts --base "$BASE_SHA" --head "$HEAD_SHA" --output "$RUNNER_TEMP/pr-impact.json"
          bun scripts/ci/pr-fast-plan.ts --plan "$RUNNER_TEMP/pr-impact.json" --output "$RUNNER_TEMP/pr-plan.json"
          echo "unit_count=$(jq '.unitTests | length' "$RUNNER_TEMP/pr-plan.json")" >> "$GITHUB_OUTPUT"
          echo "web_bundle=$(jq '.prWebBundle == true' "$RUNNER_TEMP/pr-plan.json")" >> "$GITHUB_OUTPUT"
          echo "e2e_count=$(jq '.e2eTests | length' "$RUNNER_TEMP/pr-plan.json")" >> "$GITHUB_OUTPUT"
          echo "browser_lane_count=$(jq '.browserAcceptanceLanes | length' "$RUNNER_TEMP/pr-plan.json")" >> "$GITHUB_OUTPUT"
          # A skipped reusable call still needs a syntactically valid matrix.
          echo "e2e_matrix=$(jq -c 'if (.prE2eMatrix | length) == 0 then [{index:0,number:1,total:1}] else .prE2eMatrix end' "$RUNNER_TEMP/pr-plan.json")" >> "$GITHUB_OUTPUT"
          echo "browser_lane_matrix=$(jq -c 'if (.prBrowserLaneMatrix | length) == 0 then [{lane:"none",engine:"chromium"}] else .prBrowserLaneMatrix end' "$RUNNER_TEMP/pr-plan.json")" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/pr-lane-plan"
          cp "$RUNNER_TEMP/pr-plan.json" "$RUNNER_TEMP/pr-lane-plan/impact-plan.json"
          {
            echo '### PR browser and E2E selection'
            echo
            echo '```json'
            jq '.prBrowserE2e' "$RUNNER_TEMP/pr-plan.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-impact-plan
          path: ${{ runner.temp }}/pr-plan.json
          if-no-files-found: error
      # The reusable E2E lane reads impact-plan.json, as in Batch CI.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pr-lane-plan
          path: ${{ runner.temp }}/pr-lane-plan/impact-plan.json
          if-no-files-found: error

  fast:
    name: PR fast checks
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.plan.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Install contract dependencies
        run: bun install --frozen-lockfile
      # Seconds-cheap Batch source contracts run here first, so a PR cannot
      # fail a whole batch on them (same scripts as batch-source.ts). Every
      # generated artifact Batch verifies is re-rendered, naming the command
      # that fixes a stale one. The workflow graph is otherwise checked only by
      # unit tests that a workflow-changing PR defers to Batch.
      - name: Check pending changesets, generated artifacts and workflow graph
        run: |
          set -euo pipefail
          bun scripts/ci/changeset-plan.ts
          bun scripts/ci/check-generated-artifacts.ts
          bun scripts/workflow-execution-graph.ts --git-tree 'HEAD^{tree}'
      - name: Fast lint gate
        run: bun run lint
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: pr-impact-plan
          path: ${{ runner.temp }}/pr-plan
      # Every guard Batch source contracts run, minus lint (run above), so a
      # PR and its batch cannot disagree. The legacy subscription runtime scan
      # reads only this PR's changed files; Batch scans the whole tree.
      - name: Check impacted source guards
        run: >-
          bun scripts/ci/run-guards-plan.ts --plan "$RUNNER_TEMP/pr-plan/pr-plan.json"
          --scope-scans-to-changes --exclude lint
          --exclude publish-closure --exclude example-builds
      - name: Check affected types
        run: bun scripts/ci/run-typecheck-plan.ts --plan "$RUNNER_TEMP/pr-plan/pr-plan.json"
      # Batch source contracts' "Production web bundle" step, whenever the web
      # app or anything it builds from is affected: its chunk guards otherwise
      # fail a whole batch.
      - name: Production web bundle
        if: ${{ needs.plan.outputs.web_bundle == 'true' }}
        env:
          NODE_ENV: production
        run: >-
          bash -euo pipefail -c 'bun run --cwd apps/web build && bun build apps/web/src/server.ts --target=bun --outfile="$RUNNER_TEMP/web-server/server.ts"'
      - name: Test every selected unit file
        if: ${{ needs.plan.outputs.docs_only != 'true' && needs.plan.outputs.unit_count != '0' }}
        env:
          OPENGENI_REQUIRE_REAL_DB: "1"
        run: |
          set -euo pipefail
          bun scripts/ci/batch-setup.ts postgres
          bun scripts/ci/run-unit-shard.ts --plan "$RUNNER_TEMP/pr-plan/pr-plan.json" --shard 0 --shards 1

  # Batch CI's own E2E and browser jobs, for the impacted subset that
  # pr-fast-plan.ts selects, so a PR's deterministic browser failure is found
  # here instead of failing a batch. They start with the fast checks.
  e2e:
    name: PR impacted E2E
    needs: plan
    if: ${{ needs.plan.outputs.e2e_count != '0' }}
    uses: ./.github/workflows/ci-e2e-shards.yml
    with:
      ref: ${{ needs.plan.outputs.head }}
      plan_artifact: pr-lane-plan
      matrix: ${{ needs.plan.outputs.e2e_matrix }}

  browser:
    name: PR browser acceptance
    needs: plan
    if: ${{ needs.plan.outputs.browser_lane_count != '0' }}
    uses: ./.github/workflows/ci-browser-acceptance.yml
    with:
      ref: ${{ needs.plan.outputs.head }}
      matrix: ${{ needs.plan.outputs.browser_lane_matrix }}

  ready:
    name: PR CI
    needs: [plan, fast, e2e, browser]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all selected hosted work
        env:
          PLAN: ${{ needs.plan.result }}
          FAST: ${{ needs.fast.result }}
          E2E: ${{ needs.e2e.result }}
          E2E_COUNT: ${{ needs.plan.outputs.e2e_count }}
          BROWSER: ${{ needs.browser.result }}
          BROWSER_LANE_COUNT: ${{ needs.plan.outputs.browser_lane_count }}
        run: |
          set -euo pipefail
          test "$PLAN" = success
          test "$FAST" = success
          if [ "$E2E_COUNT" = 0 ]; then test "$E2E" = skipped; else test "$E2E" = success; fi
          if [ "$BROWSER_LANE_COUNT" = 0 ]; then test "$BROWSER" = skipped; else test "$BROWSER" = success; fi
