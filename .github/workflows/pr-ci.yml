name: PR CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        required: true
        type: string
      head_sha:
        required: true
        type: string

permissions:
  contents: read
  actions: read
  pull-requests: read

# Serialize only the same PR. The trusted supersession handler cancels outdated
# heads; a duplicate run at the current head must not cancel current work.
concurrency:
  group: pr-ci-${{ github.event.pull_request.number || inputs.pr_number }}
  queue: max
  cancel-in-progress: false

env:
  OPENGENI_TEST_MAX_CONCURRENCY: "2"
  OPENGENI_TYPECHECK_CONCURRENCY: "1"

jobs:
  plan:
    name: PR fast admission
    concurrency:
      group: pr-ci-admission-v3
      queue: max
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      docs_only: ${{ steps.identity.outputs.docs_only }}
      head: ${{ steps.identity.outputs.head }}
      unit_count: ${{ steps.plan.outputs.unit_count }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - id: identity
        name: Bind current exact PR head and docs-only paths
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun scripts/ci/github-pr-ci.ts identity
      - name: Yield admission to main and candidate CI
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun scripts/ci/github-pr-ci.ts admit-fast
      - id: plan
        name: Plan all affected files
        env:
          BASE_SHA: ${{ steps.identity.outputs.base }}
          HEAD_SHA: ${{ steps.identity.outputs.head }}
        run: |
          set -euo pipefail
          bun scripts/ci/impact.ts --base "$BASE_SHA" --head "$HEAD_SHA" --output "$RUNNER_TEMP/pr-plan.json"
          echo "unit_count=$(jq '.unitTests | length' "$RUNNER_TEMP/pr-plan.json")" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: pr-impact-plan
          path: ${{ runner.temp }}/pr-plan.json
          if-no-files-found: error

  fast:
    name: PR fast checks
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.head }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Install contract dependencies
        run: bun install --frozen-lockfile
      - name: Fast lint gate
        run: bun run lint
      - uses: actions/download-artifact@v4
        with:
          name: pr-impact-plan
          path: ${{ runner.temp }}/pr-plan
      - name: Check affected types
        run: bun scripts/ci/run-typecheck-plan.ts --plan "$RUNNER_TEMP/pr-plan/pr-plan.json"
      - name: Test every selected unit file
        if: ${{ needs.plan.outputs.docs_only != 'true' && needs.plan.outputs.unit_count != '0' }}
        env:
          OPENGENI_REQUIRE_REAL_DB: "1"
        run: |
          set -euo pipefail
          bun scripts/ci/batch-setup.ts postgres
          bun scripts/ci/run-unit-shard.ts --plan "$RUNNER_TEMP/pr-plan/pr-plan.json" --shard 0 --shards 1

  ready:
    name: PR CI
    needs: [plan, fast]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all selected hosted work
        env:
          PLAN: ${{ needs.plan.result }}
          FAST: ${{ needs.fast.result }}
        run: |
          set -euo pipefail
          test "$PLAN" = success
          test "$FAST" = success
