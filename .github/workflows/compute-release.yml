name: Compute Release

# Release packaging for compute/, Opengeni's own sandbox system. Nothing in Opengeni
# uses these unless a deployment turns the compute backend on.
#
#   control-image  ghcr.io/cloudgeni-ai/opengeni-compute-control: the control
#                  service and front door (compute/docker/control.Dockerfile),
#                  with build provenance and an SBOM. Every run pushes it as
#                  sha-<commit>, a candidate nothing names; once it runs, the
#                  host bundle is reproducible and Compute CI has passed on
#                  the same commit, a push to main moves `main` to it and a
#                  compute-v<version> tag adds <version>.
#   runner-image   ghcr.io/cloudgeni-ai/opengeni-compute-github-runner: the
#                  sandbox image of GitHub runner pools
#                  (compute/docker/github-runner.Dockerfile), pushed and
#                  named the same way.
#   host-bundle    compute-host-<version>-x86_64-linux.tar.gz: the host agent
#                  as a static binary, the guest programs every sandbox
#                  image gets, the systemd units, install.sh and the pinned
#                  Firecracker, jailer and kernel it downloads
#                  (compute/deploy/host). Built twice, from two paths, and
#                  the two must be identical. Kept as a workflow artifact;
#                  a tag also publishes it as a GitHub Release with
#                  SHA256SUMS and a build provenance attestation, after the
#                  same checks.
#
# Tags follow agent-release.yml: compute-v<version> must equal the
# workspace version in compute/Cargo.toml, and tag pushes publish only once
# the repository opts in (vars.RELEASE_ENABLED).

on:
  push:
    branches:
      - main
    paths:
      - "compute/**"
      - ".github/workflows/compute-release.yml"
    tags:
      - "compute-v*"
  workflow_dispatch:

concurrency:
  group: compute-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/cloudgeni-ai/opengeni-compute-control
  RUNNER_IMAGE: ghcr.io/cloudgeni-ai/opengeni-compute-github-runner
  # Also the control image's toolchain (control.Dockerfile's RUST_VERSION).
  RUST_VERSION: 1.99.1

jobs:
  guard:
    name: Guard
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: ${{ github.ref_type != 'tag' || vars.RELEASE_ENABLED == 'true' }}
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Resolve the version
        id: v
        run: |
          set -euo pipefail
          crate_version="$(sed -nE '/^\[workspace.package\]/,/^\[/ s/^version = "([^"]+)"/\1/p' compute/Cargo.toml)"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#compute-v}"
            if [ "$version" != "$crate_version" ]; then
              echo "::error::tag $version != compute/Cargo.toml $crate_version" >&2
              exit 1
            fi
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            version="$crate_version-sha.${GITHUB_SHA::12}"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
          [[ "$version" =~ ^[0-9A-Za-z.+-]+$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "version $version"

  control-image:
    name: compute-control image
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the candidate
        id: build
        uses: docker/build-push-action@v7.3.0
        with:
          context: compute
          file: compute/docker/control.Dockerfile
          platforms: linux/amd64
          build-args: RUST_VERSION=${{ env.RUST_VERSION }}
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.guard.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.description=Opengeni compute control service
          cache-from: type=gha,scope=compute-control
          cache-to: type=gha,mode=min,scope=compute-control,ignore-error=true
      - uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Check the pushed image runs
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker run --rm "$IMAGE@$DIGEST" --help >/dev/null
          docker run --rm --entrypoint /usr/local/bin/compute-host "$IMAGE@$DIGEST" sweep --help >/dev/null
          docker run --rm --entrypoint /usr/local/bin/compute-runners "$IMAGE@$DIGEST" serve --help >/dev/null
          echo "Pushed the candidate \`$IMAGE@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"

  runner-image:
    name: GitHub runner image
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the candidate
        id: build
        uses: docker/build-push-action@v7.3.0
        with:
          context: compute
          file: compute/docker/github-runner.Dockerfile
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ env.RUNNER_IMAGE }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.guard.outputs.version }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.description=Opengeni compute GitHub Actions runner
          cache-from: type=gha,scope=compute-github-runner
          cache-to: type=gha,mode=min,scope=compute-github-runner,ignore-error=true
      - uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.RUNNER_IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
      - name: Check the pushed image starts a runner
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          # A configuration the runner cannot read: it must start, read it
          # from the environment, and refuse it.
          out="$(docker run --rm --privileged -e ACTIONS_RUNNER_INPUT_JITCONFIG=bm90LWEtY29uZmln \
            "$RUNNER_IMAGE@$DIGEST" 2>&1 || true)"
          grep -q "Runner execution has finished" <<<"$out" || { echo "$out" >&2; exit 1; }
          echo "Pushed the candidate \`$RUNNER_IMAGE@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"

  host-bundle:
    name: host bundle
    needs: guard
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-unknown-linux-musl
      - name: Tools
        run: sudo apt-get install -y -qq musl-tools >/dev/null
      - name: Build the bundle
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          RUSTUP_TOOLCHAIN: ${{ env.RUST_VERSION }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/a" compute/deploy/host/bundle.sh
      - name: Build it again elsewhere; the two must match
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          RUSTUP_TOOLCHAIN: ${{ env.RUST_VERSION }}
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          mkdir -p "$RUNNER_TEMP/elsewhere"
          cp -r compute "$RUNNER_TEMP/elsewhere/compute"
          CARGO_TARGET_DIR="$RUNNER_TEMP/elsewhere/target" OUT="$RUNNER_TEMP/b" \
            "$RUNNER_TEMP/elsewhere/compute/deploy/host/bundle.sh"
          name="compute-host-$VERSION-x86_64-linux.tar.gz"
          if ! cmp "$RUNNER_TEMP/a/$name" "$RUNNER_TEMP/b/$name"; then
            mkdir "$RUNNER_TEMP/x"
            tar -xzf "$RUNNER_TEMP/a/$name" -C "$RUNNER_TEMP/x" --transform 's|^[^/]*|a|'
            tar -xzf "$RUNNER_TEMP/b/$name" -C "$RUNNER_TEMP/x" --transform 's|^[^/]*|b|'
            diff "$RUNNER_TEMP/x/a/SHA256SUMS" "$RUNNER_TEMP/x/b/SHA256SUMS" || true
            echo "::error::the host bundle is not reproducible" >&2
            exit 1
          fi
          cat "$RUNNER_TEMP/a/$name.sha256" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: ${{ runner.temp }}/a/compute-host-*.tar.gz
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: compute-host-${{ needs.guard.outputs.version }}
          path: ${{ runner.temp }}/a/
          if-no-files-found: error
          retention-days: 90

  promote:
    name: Promote once checked
    needs: [guard, control-image, runner-image, host-bundle]
    if: ${{ github.ref == 'refs/heads/main' || needs.guard.outputs.release == 'true' }}
    runs-on: ubuntu-24.04
    # Compute CI's KVM job alone may take 75 minutes.
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
      actions: read
    steps:
      - name: Wait for Compute CI on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # A tag names a commit whose push to main ran Compute CI; a push
          # to main runs it alongside this workflow. Any successful run on
          # the commit counts, on any page; with none, a finished failed
          # run ends this.
          query="repos/$GITHUB_REPOSITORY/actions/workflows/compute-ci.yml/runs?head_sha=$GITHUB_SHA&per_page=100"
          deadline=$(( $(date +%s) + 110 * 60 ))
          while :; do
            runs="$(gh api --paginate "$query" \
              --jq '.workflow_runs[] | {status, conclusion, url: .html_url}' | jq -s .)"
            if jq -e 'any(.[]; .conclusion == "success")' <<<"$runs" >/dev/null; then
              jq -r 'map(select(.conclusion == "success"))[0].url' <<<"$runs"
              break
            fi
            if jq -e 'length > 0 and all(.[]; .status == "completed")' <<<"$runs" >/dev/null; then
              echo "::error::Compute CI did not pass on $GITHUB_SHA: $(jq -c . <<<"$runs")" >&2
              exit 1
            fi
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::no finished Compute CI run on $GITHUB_SHA: $(jq -c . <<<"$runs")" >&2
              exit 1
            fi
            sleep 60
          done
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Name the candidate
        env:
          DIGEST: ${{ needs.control-image.outputs.digest }}
          RUNNER_DIGEST: ${{ needs.runner-image.outputs.digest }}
          VERSION: ${{ needs.guard.outputs.version }}
          RELEASE: ${{ needs.guard.outputs.release }}
        run: |
          set -euo pipefail
          # Copies the checked index, attestations included, under each
          # name: the digest, and so its provenance, stays the same.
          name() {
            local image="$1" digest="$2" tags=()
            if [ "$GITHUB_REF" = refs/heads/main ]; then tags+=(--tag "$image:main"); fi
            if [ "$RELEASE" = true ]; then tags+=(--tag "$image:$VERSION"); fi
            docker buildx imagetools create "${tags[@]}" "$image@$digest"
            for tag in "${tags[@]}"; do
              [ "$tag" = --tag ] && continue
              # Read the whole answer before parsing it: an awk that stops at the
              # first match would end docker with SIGPIPE, and pipefail would
              # fail the step after the tag had already moved.
              inspected="$(docker buildx imagetools inspect "$tag")"
              named="$(awk '$1 == "Digest:" { print $2; exit }' <<<"$inspected")"
              if [ "$named" != "$digest" ]; then
                echo "::error::$tag is $named, not the checked $digest" >&2
                exit 1
              fi
              echo "\`$tag\` is \`$digest\`" >> "$GITHUB_STEP_SUMMARY"
            done
          }
          name "$IMAGE" "$DIGEST"
          name "$RUNNER_IMAGE" "$RUNNER_DIGEST"

  publish:
    name: GitHub Release
    needs: [guard, promote]
    if: ${{ needs.guard.outputs.release == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: compute-host-${{ needs.guard.outputs.version }}
          path: dist
      - name: SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          cat ./*.sha256 > SHA256SUMS
          ls -l
      - name: Create the GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: compute-v${{ needs.guard.outputs.version }}
          name: compute v${{ needs.guard.outputs.version }}
          body: |
            Opengeni compute (Opengeni's own sandbox system) v${{ needs.guard.outputs.version }}.

            - Control service image: `${{ env.IMAGE }}:${{ needs.guard.outputs.version }}`
            - Host agent bundle: `compute-host-${{ needs.guard.outputs.version }}-x86_64-linux.tar.gz`
              (unpack, then `sudo ./install.sh --config host.env`)

            Both carry GitHub build provenance (`gh attestation verify`). See
            compute/docs/operations.md for deployment, upgrades and recovery.
          files: dist/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
