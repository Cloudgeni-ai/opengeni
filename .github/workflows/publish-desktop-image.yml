name: Publish desktop image

# Sibling of the official 7-image release BOM. Computer/Browser on Modal need
# docker/desktop.Dockerfile (Xvfb/XFCE/Chrome/browserd). The official
# opengeni-sandbox image is headless and must never be the Modal pin.
# Helm desktop.imageRef is the digest pin written to OPENGENI_MODAL_IMAGE_REF.
# ACR Tasks cannot parse this Dockerfile (ADD --checksum, FROM --platform).
# Publish here, then copy/import the digest into the operator registry.
on:
  push:
    branches: [main]
    paths:
      - "docker/desktop.Dockerfile"
      - "docker/desktop/**"
      - "docker/anydoc/**"
      - "docker/opengeni-git-askpass"
      - "docker/browserd-THIRD-PARTY-NOTICES"
      - "packages/browserd/**"
      - ".github/workflows/publish-desktop-image.yml"
  workflow_dispatch:

jobs:
  desktop-image:
    name: Publish desktop sandbox image
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.desktop_image.outputs.digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push desktop image
        id: desktop_image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: docker/desktop.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/cloudgeni-ai/opengeni-desktop:sha-${{ github.sha }}
            ghcr.io/cloudgeni-ai/opengeni-desktop:canary-sha-${{ github.sha }}
          cache-from: type=gha,scope=opengeni-desktop
          cache-to: type=gha,mode=min,scope=opengeni-desktop,ignore-error=true
