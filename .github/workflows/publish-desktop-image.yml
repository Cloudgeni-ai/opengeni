name: Publish desktop image

# Sibling of the official 7-image release BOM. Computer/Browser on Modal need
# docker/desktop.Dockerfile (Xvfb/XFCE/Chrome/browserd plus the native Office
# kernel). The official opengeni-sandbox image is headless and must never be
# the Modal pin. Helm desktop.imageRef is the digest pin written to
# OPENGENI_MODAL_IMAGE_REF. ACR Tasks cannot parse this Dockerfile
# (ADD --checksum, FROM --platform). Publish here, then copy/import the digest
# into the operator registry.
on:
  push:
    branches: [main]
    paths:
      - "docker/desktop.Dockerfile"
      - "docker/desktop/**"
      - "docker/anydoc/**"
      - "docker/opengeni-git-askpass"
      - "docker/browserd-THIRD-PARTY-NOTICES"
      - "packages/browserd/**"
      - "packages/artifact-tool/**"
      - "packages/artifact-kernel-wasm-document/**"
      - "packages/artifact-kernel-wasm-presentation/**"
      - "packages/artifact-kernel-wasm-spreadsheet/**"
      - "scripts/*artifact*.ts"
      - ".github/workflows/publish-desktop-image.yml"
      - ".github/workflows/artifact-runtime.yml"
  workflow_dispatch:

jobs:
  artifact-runtime:
    name: Build exact artifact runtime inputs
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/artifact-runtime.yml
    with:
      source_sha: ${{ github.sha }}

  desktop-image:
    name: Publish desktop sandbox image
    needs: artifact-runtime
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.desktop_image.outputs.digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download exact artifact runtime inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.artifact-runtime.outputs.artifact_name }}
          path: .release/artifact-runtime

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push desktop image
        id: desktop_image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: docker/desktop.Dockerfile
          platforms: linux/amd64
          build-args: OPENGENI_SOURCE_SHA=${{ github.sha }}
          push: true
          tags: |
            ghcr.io/cloudgeni-ai/opengeni-desktop:sha-${{ github.sha }}
            ghcr.io/cloudgeni-ai/opengeni-desktop:canary-sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=opengeni-desktop
          cache-to: type=gha,mode=min,scope=opengeni-desktop,ignore-error=true
