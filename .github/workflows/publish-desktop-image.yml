name: Publish desktop image

# Sibling of the official 7-image release BOM. Computer/Browser on Modal need
# docker/desktop.Dockerfile (Xvfb/XFCE/Chrome/browserd plus the native Office
# kernel). The official opengeni-sandbox image is headless and must never be
# the Modal pin. Helm desktop.imageRef is the digest pin written to
# OPENGENI_MODAL_IMAGE_REF. ACR Tasks cannot parse this Dockerfile
# (ADD --checksum, FROM --platform). Publish here, then copy/import the digest
# into the operator registry. ACR is authoritative; GHCR is a best-effort mirror.
on:
  push:
    branches: [main]
    paths:
      - "docker/desktop.Dockerfile"
      - "docker/desktop/**"
      - "docker/anydoc/**"
      - "docker/opengeni-git-askpass"
      - "docker/browserd-THIRD-PARTY-NOTICES"
      - "packages/browserd/**"
      - "packages/artifact-tool/**"
      - "packages/artifact-kernel-wasm-document/**"
      - "packages/artifact-kernel-wasm-presentation/**"
      - "packages/artifact-kernel-wasm-spreadsheet/**"
      - "scripts/*artifact*.ts"
      - ".github/workflows/publish-desktop-image.yml"
      - ".github/workflows/artifact-runtime.yml"
  workflow_dispatch:

jobs:
  artifact-runtime:
    name: Build exact artifact runtime inputs
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/artifact-runtime.yml
    with:
      source_sha: ${{ github.sha }}

  desktop-image:
    name: Publish desktop sandbox image
    needs: artifact-runtime
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: public-release
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.desktop_image.outputs.digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: Download exact artifact runtime inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.artifact-runtime.outputs.artifact_name }}
          path: .release/artifact-runtime

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to the public desktop registry
        uses: ./.github/actions/public-oci-login
        with:
          oci-prefix: opengenipublicneuacr.azurecr.io
          auth: azure-oidc
          azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push desktop image
        id: desktop_image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: docker/desktop.Dockerfile
          platforms: linux/amd64
          build-args: OPENGENI_SOURCE_SHA=${{ github.sha }}
          push: true
          tags: opengenipublicneuacr.azurecr.io/opengeni-desktop:preview-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=opengeni-desktop
          cache-to: type=gha,mode=min,scope=opengeni-desktop,ignore-error=true

      - name: Verify anonymous desktop publication and installed runtime
        env:
          DIGEST: ${{ steps.desktop_image.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p .release/desktop-publication
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          image="opengenipublicneuacr.azurecr.io/opengeni-desktop"
          docker logout opengenipublicneuacr.azurecr.io
          helm registry logout opengenipublicneuacr.azurecr.io
          export DOCKER_CONFIG="$(mktemp -d)"
          resolved="$(docker buildx imagetools inspect "$image:preview-$SOURCE_SHA" --format '{{.Manifest.Digest}}')"
          [ "$resolved" = "$DIGEST" ]
          docker pull "$image@$DIGEST" 2>&1 | tee .release/desktop-publication/anonymous-pull.txt
          revision="$(docker image inspect "$image@$DIGEST" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')"
          [ "$revision" = "$SOURCE_SHA" ]
          docker run --rm --entrypoint /bin/bash \
            --env OPENGENI_ARTIFACT_RUNTIME_MANIFEST=/opt/opengeni/artifact-runtime/installation.json \
            --env OPENGENI_ARTIFACT_TOOL_ENTRY=/opt/opengeni/artifact-runtime/skill-facade-entry.mjs \
            "$image@$DIGEST" -euo pipefail -c '
            test ! -e /opt/opengeni/artifact-runtime/.unavailable
            opengeni-artifact-runtime doctor --json
          ' | tee .release/desktop-publication/runtime-doctor.json
          jq -n --arg sourceSha "$SOURCE_SHA" --arg image "$image@$DIGEST" \
            --arg tag "preview-$SOURCE_SHA" \
            '{sourceSha: $sourceSha, image: $image, tag: $tag, anonymousPull: true, runtimeDoctor: true}' \
            > .release/desktop-publication/receipt.json
          echo "Verified desktop: \`$image@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Retain desktop publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-publication-${{ github.sha }}-${{ github.run_attempt }}
          path: .release/desktop-publication
          if-no-files-found: warn
          retention-days: 30

      # Existing GHCR consumers keep their tag names, but package permissions
      # must not gate the verified public ACR image. Never rebuild for a mirror.
      - name: Mirror desktop image to GHCR (best effort)
        continue-on-error: true
        env:
          DIGEST: ${{ steps.desktop_image.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          source="opengenipublicneuacr.azurecr.io/opengeni-desktop@$DIGEST"
          for tag in "sha-$SOURCE_SHA" "canary-sha-$SOURCE_SHA"; do
            target="ghcr.io/cloudgeni-ai/opengeni-desktop:$tag"
            docker tag "$source" "$target"
            docker push "$target"
          done
