name: Landed merge content
on:
  push:
    branches: [main]
permissions:
  contents: read
# Intentionally no concurrency cancellation: audit EVERY push, including the
# intermediate pushes coalesced out of expensive full CI.
jobs:
  content:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Recompute landed merge content
        env:
          BEFORE: ${{ github.event.before }}
        run: bun scripts/ci/verify-merge-content.ts "$BEFORE" "$GITHUB_SHA"
