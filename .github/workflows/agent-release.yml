name: Agent Release

# Cross-platform signed release of the opengeni-agent binary.
# Triggered on a pushed `agent-v*` tag (decoupled from the npm changesets release so
# the Rust binary versions independently) or a manual dispatch. Reuses release.yml's
# conventions: actions/checkout@v6, the built-in GITHUB_TOKEN, version-as-source-of-
# truth, and a dormant-until-opted-in guard (RELEASE_ENABLED) for tag pushes.
#
# Build matrix → native runners → correct platform binaries + real cargo test:
#   x86_64/aarch64-unknown-linux-musl  (ubuntu-latest, static via cargo-zigbuild)
#   universal-apple-darwin             (macos-26 lipo of x86_64 + arm64)
#   x86_64/aarch64-pc-windows-msvc     (windows-latest)
#
# Every artifact is minisign-signed (the SAME pinned key the install scripts embed)
# + sha256'd. The macOS notarize + Windows Authenticode steps are GUARDED to skip
# cleanly when their creds are absent (category-4 deferred) — the pipeline ships
# unsigned-for-those-OSes-but-minisign-attested with a clear note, never failing.

on:
  push:
    tags:
      - "agent-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (without the agent-v prefix), e.g. 1.2.3"
        required: true

concurrency:
  group: agent-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # A fast, cheap guard: opted-in + the tag matches the crate version, so a
  # fat-fingered tag fails in seconds rather than after a 20-min macOS build.
  guard:
    name: Guard
    runs-on: ubuntu-latest
    if: ${{ vars.RELEASE_ENABLED == 'true' || github.event_name == 'workflow_dispatch' }}
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Resolve + verify the version
        id: v
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ github.event.inputs.version }}"
          else
            version="${GITHUB_REF_NAME#agent-v}"
          fi
          crate_version="$(grep -m1 '^version' agent/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "tag/input version: $version ; crate version: $crate_version"
          if [ "$version" != "$crate_version" ]; then
            echo "::error::version mismatch — tag $version != agent/Cargo.toml $crate_version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: guard
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            asset: opengeni-agent-x86_64-unknown-linux-musl
            kind: linux
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-latest
            asset: opengeni-agent-aarch64-unknown-linux-musl
            kind: linux
          - target: universal-apple-darwin
            runner: macos-26
            asset: opengeni-agent-universal-apple-darwin
            kind: macos
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            asset: opengeni-agent-x86_64-pc-windows-msvc.exe
            kind: windows
          - target: aarch64-pc-windows-msvc
            runner: windows-latest
            asset: opengeni-agent-aarch64-pc-windows-msvc.exe
            kind: windows
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent
          key: ${{ matrix.target }}

      # ---- Linux: static musl via cargo-zigbuild (robust ring+musl cross-link). ----
      - name: Build (Linux musl static)
        if: matrix.kind == 'linux'
        shell: bash
        working-directory: agent
        run: |
          set -euo pipefail
          pip install ziglang
          cargo install --locked cargo-zigbuild
          rustup target add "${{ matrix.target }}"
          cargo zigbuild --release --target "${{ matrix.target }}" -p opengeni-agent
          cp "target/${{ matrix.target }}/release/opengeni-agent" "../${{ matrix.asset }}"
          file "../${{ matrix.asset }}"

      # ---- macOS: build both arches natively, lipo into ONE universal binary. ----
      - name: Build (macOS universal)
        if: matrix.kind == 'macos'
        shell: bash
        working-directory: agent
        run: |
          set -euo pipefail
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          # `--features macos-desktop` ships the real macOS display backend
          # (ScreenCaptureKit capture + CGEvent input + the TCC consent flow). It
          # forwards to opengeni-agent-platform/macos-desktop and is macOS-ONLY —
          # the Linux/Windows legs above build default features so their binaries
          # stay byte-identical. The feature-on path compiles only on this macOS
          # runner (the objc2 Apple FFI has no Linux/Windows target).
          cargo build --release --target x86_64-apple-darwin -p opengeni-agent --features macos-desktop
          cargo build --release --target aarch64-apple-darwin -p opengeni-agent --features macos-desktop
          lipo -create \
            "target/x86_64-apple-darwin/release/opengeni-agent" \
            "target/aarch64-apple-darwin/release/opengeni-agent" \
            -output "../${{ matrix.asset }}"
          lipo -info "../${{ matrix.asset }}"

      # The native macOS runner also executes the workspace tests before the
      # universal artifact is accepted.
      - name: Intel cargo test (macOS coverage)
        if: matrix.kind == 'macos'
        working-directory: agent
        run: cargo test --workspace

      # ---- Windows: native MSVC build. ----
      - name: Build (Windows MSVC)
        if: matrix.kind == 'windows'
        shell: bash
        working-directory: agent
        run: |
          set -euo pipefail
          rustup target add "${{ matrix.target }}"
          cargo build --release --target "${{ matrix.target }}" -p opengeni-agent
          cp "target/${{ matrix.target }}/release/opengeni-agent.exe" "../${{ matrix.asset }}"

      # ---- Detect signing creds in a PRIOR step (so the gates can read them). ----
      # GitHub Actions does NOT expose a step's own `env:` to that step's `if:`, so a
      # signing step cannot gate on an env var it assigns from a secret in the same
      # step — the `if` always sees an empty string and the step silently skips. We
      # therefore evaluate secret presence ONCE here and publish booleans as step
      # outputs the downstream `if:` conditions read via `steps.creds.outputs.*`.
      - name: Detect signing creds
        id: creds
        shell: bash
        env:
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          AZURE_KEY_VAULT_URL: ${{ secrets.AZURE_KEY_VAULT_URL }}
          MINISIGN_KEY: ${{ secrets.OPENGENI_AGENT_MINISIGN_KEY }}
        run: |
          set -euo pipefail
          # `[ -n "$X" ]` is the env-side presence check; secrets are masked, so this
          # never leaks the value, only its presence as a boolean output.
          if [ -n "${APPLE_DEVELOPER_ID:-}" ]; then echo "has_macos=true" >> "$GITHUB_OUTPUT"; else echo "has_macos=false" >> "$GITHUB_OUTPUT"; fi
          if [ -n "${AZURE_KEY_VAULT_URL:-}" ]; then echo "has_windows=true" >> "$GITHUB_OUTPUT"; else echo "has_windows=false" >> "$GITHUB_OUTPUT"; fi
          if [ -n "${MINISIGN_KEY:-}" ]; then echo "has_minisign=true" >> "$GITHUB_OUTPUT"; else echo "has_minisign=false" >> "$GITHUB_OUTPUT"; fi

      - name: Require the release signing key
        if: steps.creds.outputs.has_minisign != 'true'
        shell: bash
        run: |
          echo "::error::OPENGENI_AGENT_MINISIGN_KEY is required; refusing to publish an uninstallable agent release" >&2
          exit 1

      # ---- macOS Developer ID codesign + notarize (CATEGORY-4, guarded). ----
      # Skips cleanly when the cert/ASC creds are absent; until they land, macOS
      # binaries ship unsigned-but-minisign-attested (a Gatekeeper warning on a
      # fresh download, documented). Drop the secrets in → this lights up, no code
      # change.
      - name: macOS codesign + notarize (if creds present)
        if: matrix.kind == 'macos' && steps.creds.outputs.has_macos == 'true'
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_ASC_KEY: ${{ secrets.APPLE_ASC_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Apple Developer ID present — signing + notarizing ${{ matrix.asset }}"
          # rcodesign (pure-Rust apple-codesign) signs + notarizes from a .p12 + ASC
          # key without a Mac keychain. Authored as the creds-drop-in.
          cargo install --locked apple-codesign
          echo "$APPLE_CERT_P12" | base64 -d > /tmp/cert.p12
          rcodesign sign --for-notarization --p12-file /tmp/cert.p12 --p12-password "$APPLE_CERT_PASSWORD" \
            --code-signature-flags runtime "${{ matrix.asset }}"
          echo "$APPLE_ASC_KEY" > /tmp/asc.json
          rcodesign notary-submit --api-key-path /tmp/asc.json --wait "${{ matrix.asset }}"

      - name: macOS unsigned note (no creds)
        if: matrix.kind == 'macos' && steps.creds.outputs.has_macos != 'true'
        run: echo "::notice::macOS binary is UNSIGNED (no Apple Developer ID secret) — minisign-attested only. Gatekeeper warns on a fresh download until signing credentials are configured."

      # ---- macOS app bundle: assemble + Developer-ID sign + notarize (guarded). ----
      # WHY a bundle in addition to the bare binary: macOS TCC (Screen Recording /
      # Accessibility) grants attach to the code-signing identity + bundle id. A
      # Developer-ID-signed + notarized .app has a STABLE identity, so its grants
      # SURVIVE agent updates — the bare binary (or a locally-assembled ad-hoc
      # bundle) cannot offer that. install.sh prefers this asset when the release
      # serves it. Guarded on the Apple creds so it lights up exactly when signing +
      # notarization are possible; absent → install.sh assembles an ad-hoc bundle
      # locally and this asset simply does not exist (installer handles that).
      - name: macOS assemble + sign + notarize .app bundle (if creds present)
        if: matrix.kind == 'macos' && steps.creds.outputs.has_macos == 'true'
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_ASC_KEY: ${{ secrets.APPLE_ASC_KEY }}
          VERSION: ${{ needs.guard.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          APP="OpenGeni Agent.app"
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS"
          # The universal binary built above becomes the bundle's executable. Its
          # CFBundleExecutable is `opengeni-agent` (matches install.sh's local path).
          cp "${{ matrix.asset }}" "$APP/Contents/MacOS/opengeni-agent"
          chmod 0755 "$APP/Contents/MacOS/opengeni-agent"
          # Info.plist kept in sync with install.sh's write_info_plist (same keys +
          # STABLE bundle id ai.opengeni.agent; LSUIElement hides the Dock icon).
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key><string>OpenGeni Agent</string>
              <key>CFBundleDisplayName</key><string>OpenGeni Agent</string>
              <key>CFBundleIdentifier</key><string>ai.opengeni.agent</string>
              <key>CFBundleExecutable</key><string>opengeni-agent</string>
              <key>CFBundleShortVersionString</key><string>${VERSION}</string>
              <key>CFBundleVersion</key><string>${VERSION}</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>LSUIElement</key><true/>
              <key>LSMinimumSystemVersion</key><string>12.0</string>
          </dict>
          </plist>
          PLIST
          # rcodesign is installed by the prior codesign step; ensure it regardless.
          cargo install --locked apple-codesign
          echo "$APPLE_CERT_P12" | base64 -d > /tmp/cert.p12
          # Sign the WHOLE bundle with the hardened runtime + the stable identifier.
          rcodesign sign --for-notarization --p12-file /tmp/cert.p12 --p12-password "$APPLE_CERT_PASSWORD" \
            --code-signature-flags runtime --binary-identifier ai.opengeni.agent "$APP"
          # Zip with the .app dir as the archive root (install.sh extracts into
          # ~/Applications and expects exactly that layout).
          ditto -c -k --keepParent "$APP" "OpenGeni-Agent.app.zip"
          echo "$APPLE_ASC_KEY" > /tmp/asc.json
          # Notarize and staple fail closed when Apple credentials are configured:
          # a release must not silently degrade to a signed-but-warning-prone app.
          rcodesign notary-submit --api-key-path /tmp/asc.json --wait "OpenGeni-Agent.app.zip"
          rcodesign staple "$APP"
          rm -f "OpenGeni-Agent.app.zip"
          ditto -c -k --keepParent "$APP" "OpenGeni-Agent.app.zip"
          rm -f /tmp/cert.p12 /tmp/asc.json

      # ---- Windows Authenticode (POLISH, guarded). ----
      - name: Windows Authenticode (if cert present)
        if: matrix.kind == 'windows' && steps.creds.outputs.has_windows == 'true'
        env:
          AZURE_KEY_VAULT_URL: ${{ secrets.AZURE_KEY_VAULT_URL }}
          AZURE_KEY_VAULT_CERT: ${{ secrets.AZURE_KEY_VAULT_CERT }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        shell: pwsh
        run: |
          Write-Host "Azure Key Vault cert present — Authenticode-signing ${{ matrix.asset }}"
          dotnet tool install --global AzureSignTool
          AzureSignTool sign `
            --azure-key-vault-url "$env:AZURE_KEY_VAULT_URL" `
            --azure-key-vault-certificate "$env:AZURE_KEY_VAULT_CERT" `
            --azure-key-vault-client-id "$env:AZURE_CLIENT_ID" `
            --azure-key-vault-client-secret "$env:AZURE_CLIENT_SECRET" `
            --azure-key-vault-tenant-id "$env:AZURE_TENANT_ID" `
            --timestamp-rfc3161 "http://timestamp.digicert.com" `
            --file-digest sha256 `
            "${{ matrix.asset }}"

      - name: Windows unsigned note (no cert)
        if: matrix.kind == 'windows' && steps.creds.outputs.has_windows != 'true'
        run: echo "::notice::Windows binary is UNSIGNED (no Authenticode cert) — minisign-attested only. SmartScreen warns on a fresh download until signing credentials are configured."

      # ---- minisign signature + sha256 (ALWAYS-ON; the trust root for self-update). ----
      - name: minisign-sign + sha256 the artifact
        if: steps.creds.outputs.has_minisign == 'true'
        env:
          MINISIGN_KEY: ${{ secrets.OPENGENI_AGENT_MINISIGN_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          # Install rsign2 (pure-Rust minisign-compatible signer) so the runner needs
          # no system minisign. It signs in the SAME prehashed-ED form the installer
          # + self-update verify expects.
          cargo install --locked rsign2
          printf '%s' "$MINISIGN_KEY" > /tmp/minisign.key
          # The release key is passwordless (generated with -W); sign with -W so
          # rsign never blocks on a TTY password prompt. Detached sig: <asset>.minisig.
          rsign sign -W -s /tmp/minisign.key -x "${{ matrix.asset }}.minisig" "${{ matrix.asset }}"
          # sha256 sidecar.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          else
            shasum -a 256 "${{ matrix.asset }}" > "${{ matrix.asset }}.sha256"
          fi
          # macOS: the notarized .app bundle (produced above only when Apple creds
          # are present) gets the SAME minisign + sha256 sidecars so install.sh
          # verifies it through the identical two gates as the bare binary.
          if [ -f "OpenGeni-Agent.app.zip" ]; then
            rsign sign -W -s /tmp/minisign.key -x "OpenGeni-Agent.app.zip.minisig" "OpenGeni-Agent.app.zip"
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "OpenGeni-Agent.app.zip" > "OpenGeni-Agent.app.zip.sha256"
            else
              shasum -a 256 "OpenGeni-Agent.app.zip" > "OpenGeni-Agent.app.zip.sha256"
            fi
          fi
          rm -f /tmp/minisign.key

      - name: Upload artifact bundle
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ matrix.asset }}
          # The preceding hard gate guarantees the binary, checksum, and minisign
          # signature all exist; optional app-bundle assets remain conditional.
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
            ${{ matrix.asset }}.minisig
            OpenGeni-Agent.app.zip
            OpenGeni-Agent.app.zip.sha256
            OpenGeni-Agent.app.zip.minisig
          if-no-files-found: error

  # The publish job needs ALL builds, so NO partial release. It assembles the
  # combined SHA256SUMS, signs the channel manifest, and creates the GH Release with
  # the binaries + the install scripts attached.
  publish:
    name: Publish release
    needs: [guard, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Assemble SHA256SUMS
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          cat ./*.sha256 > SHA256SUMS
          ls -l

      # Same step-local-env-in-`if` constraint as the build job: detect the minisign
      # key ONCE here and gate the signing/manifest steps on the published output, not
      # on an env var assigned from a secret in the gated step itself.
      - name: Detect signing creds
        id: creds
        shell: bash
        env:
          MINISIGN_KEY: ${{ secrets.OPENGENI_AGENT_MINISIGN_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${MINISIGN_KEY:-}" ]; then echo "has_minisign=true" >> "$GITHUB_OUTPUT"; else echo "has_minisign=false" >> "$GITHUB_OUTPUT"; fi

      - name: Require the release signing key
        if: steps.creds.outputs.has_minisign != 'true'
        shell: bash
        run: |
          echo "::error::OPENGENI_AGENT_MINISIGN_KEY is required; refusing to publish an unverifiable release" >&2
          exit 1

      - name: Sign SHA256SUMS (if the key is present)
        if: steps.creds.outputs.has_minisign == 'true'
        env:
          MINISIGN_KEY: ${{ secrets.OPENGENI_AGENT_MINISIGN_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          cargo install --locked rsign2
          printf '%s' "$MINISIGN_KEY" > /tmp/minisign.key
          rsign sign -W -s /tmp/minisign.key -x dist/SHA256SUMS.minisig dist/SHA256SUMS
          rm -f /tmp/minisign.key

      - name: Build and sign the stable update manifest
        if: steps.creds.outputs.has_minisign == 'true'
        env:
          MINISIGN_KEY: ${{ secrets.OPENGENI_AGENT_MINISIGN_KEY }}
          VERSION: ${{ needs.guard.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          artifacts='[]'
          for pair in \
            'x86_64-unknown-linux-musl:opengeni-agent-x86_64-unknown-linux-musl' \
            'aarch64-unknown-linux-musl:opengeni-agent-aarch64-unknown-linux-musl' \
            'universal-apple-darwin:opengeni-agent-universal-apple-darwin' \
            'x86_64-pc-windows-msvc:opengeni-agent-x86_64-pc-windows-msvc.exe' \
            'aarch64-pc-windows-msvc:opengeni-agent-aarch64-pc-windows-msvc.exe'
          do
            target="${pair%%:*}"
            asset="${pair#*:}"
            test -f "dist/$asset"
            test -f "dist/$asset.minisig"
            sha="$(awk 'NR == 1 { print $1 }' "dist/$asset.sha256")"
            size="$(stat -c '%s' "dist/$asset")"
            url="https://github.com/${GITHUB_REPOSITORY}/releases/download/agent-v${VERSION}/${asset}"
            entry="$(jq -cn \
              --arg target "$target" --arg url "$url" --argjson size "$size" \
              --arg sha256 "$sha" --arg minisig_url "$url.minisig" \
              '{target:$target,url:$url,size:$size,sha256:$sha256,minisig_url:$minisig_url}')"
            artifacts="$(jq -cn --argjson current "$artifacts" --argjson entry "$entry" '$current + [$entry]')"
          done
          signed_at_ms="$(( $(date +%s) * 1000 ))"
          jq -cn \
            --arg channel stable \
            --arg version "$VERSION" \
            --arg min_supported '0.1.0' \
            --arg cohort_salt "agent-v${VERSION}" \
            --argjson rollout_percent 100 \
            --argjson artifacts "$artifacts" \
            --arg notes_url "https://github.com/${GITHUB_REPOSITORY}/releases/tag/agent-v${VERSION}" \
            --argjson signed_at_ms "$signed_at_ms" \
            '{channel:$channel,version:$version,min_supported:$min_supported,rollout_percent:$rollout_percent,cohort_salt:$cohort_salt,artifacts:$artifacts,notes_url:$notes_url,signed_at_ms:$signed_at_ms,force:false}' \
            > dist/manifest.json
          cargo install --locked rsign2
          printf '%s' "$MINISIGN_KEY" > /tmp/minisign.key
          rsign sign -W -s /tmp/minisign.key -x dist/manifest.json.minisig dist/manifest.json
          rm -f /tmp/minisign.key

      - name: Create the GitHub Release
        # This exact action revision creates ordinary releases as drafts, uploads
        # every asset, then publishes once. That boundary is required when
        # repository immutable releases are enabled.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: agent-v${{ needs.guard.outputs.version }}
          name: opengeni-agent v${{ needs.guard.outputs.version }}
          body: |
            opengeni-agent v${{ needs.guard.outputs.version }} — cross-platform signed release.

            Install (read the script first — it is short, POSIX, contains no secrets):
              Linux/macOS: `curl -fsSL https://get.opengeni.ai/install.sh | sh`
              Windows:     `irm https://get.opengeni.ai/install.ps1 | iex`

            Every binary is minisign-signed (verify against the pinned key) + sha256'd.
            macOS/Windows OS-native code-signing is a creds-drop-in (see release notes
            banner); the minisign trust root is independent of the OS cert.
          files: |
            dist/*
            agent/install/install.sh
            agent/install/install.ps1
            agent/install/uninstall.sh
            agent/install/opengeni-agent-minisign.pub
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # `/agent/latest/<asset>` is an API compatibility route, not a moving
      # provider tag. Deployments promote or roll back that route by changing
      # OPENGENI_AGENT_STABLE_VERSION after this immutable versioned release
      # exists. Never delete or move an agent release tag.
