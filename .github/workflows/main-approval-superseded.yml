name: Cancel superseded main CI
# 1. Main CI runs park on the public-release approval for the signed canary
#    image. Only the SHA a release chooses is approved; cancel older parked
#    runs. Keeps the newest five, anything under three hours old and the
#    current main SHA; never touches running jobs or other environments.
# 2. Main CI runs none of whose jobs has started are superseded by a newer main
#    run, which tests a superset of their commits. Started runs always finish;
#    the main SHA and Version merges are kept; re-runs wait six hours first.
# 3. With MAIN_CI_DEFERRED, ordinary main pushes skip CI, and this re-runs the
#    newest main SHA's run about every 30 minutes (MAIN_CI_INTERVAL_MINUTES)
#    while main changes, and re-runs a failed full run's failed jobs once
#    (docs/merge-batcher.md "Main CI cadence").
on:
  push:
    branches: [main]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  actions: write
  deployments: read
concurrency:
  group: main-approval-superseded
  cancel-in-progress: true
jobs:
  superseded:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Cancel superseded parked or not-started main CI runs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MAIN_CI_DEFERRED: ${{ vars.MAIN_CI_DEFERRED }}
          MAIN_CI_INTERVAL_MINUTES: ${{ vars.MAIN_CI_INTERVAL_MINUTES }}
        run: bun scripts/ci/main-approval-superseded.ts
