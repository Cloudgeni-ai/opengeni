name: Migrate release secrets (one time)
on:
  push:
    branches: [secure-release-environments]
permissions:
  contents: read
jobs:
  seal:
    if: github.repository == 'Cloudgeni-ai/opengeni'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install distribution cryptography library
        run: sudo apt-get update && sudo apt-get install -y libsodium23
      - name: Seal existing values to GitHub environment public keys
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          APPLE_ASC_KEY: ${{ secrets.APPLE_ASC_KEY }}
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_DEVELOPER_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          OPENGENI_AGENT_MINISIGN_KEY: ${{ secrets.OPENGENI_AGENT_MINISIGN_KEY }}
        run: |
          python3 - <<'PY'
          import base64, ctypes, ctypes.util, json, os
          sodium = ctypes.CDLL(ctypes.util.find_library('sodium'))
          assert sodium.sodium_init() >= 0
          sodium.crypto_box_seal.argtypes = [ctypes.c_void_p, ctypes.c_void_p, ctypes.c_ulonglong, ctypes.c_void_p]
          targets = {
            'package-release': ('uWbg5YjNplppvTOGD6Xjt1EGHmaS1EKkjKPqPgwCHUg=', ['NPM_TOKEN']),
            'production-release': ('Lq8yF9Cpl8P5b6LQ1ZgDiL/XnqjUrZ0/n5uqMoDFw3Q=', ['NPM_TOKEN']),
            'embedded-release': ('1d+13wgessaVAhWvXbdKEhdZ6qm00jNrMDvzfhE9MVs=', ['NPM_TOKEN']),
            'agent-release': ('Y9KmmkRQaMOpuDkHwD9xVlb7qb7LL6KpFch0LxzPMkU=', ['APPLE_ASC_KEY', 'APPLE_CERT_P12', 'APPLE_CERT_PASSWORD', 'APPLE_DEVELOPER_ID', 'OPENGENI_AGENT_MINISIGN_KEY']),
            'desktop-release': ('fzjTMNaFZZihw6mie1wMXaf3+/E2gJ14u5bnenAqDB4=', ['APPLE_ASC_KEY', 'APPLE_CERT_P12', 'APPLE_CERT_PASSWORD']),
            'public-release': ('I0Yzdkl7iAta8ve8rTMTW8rNM76jxk/Agnu9yUxc7DQ=', ['OPENGENI_AGENT_MINISIGN_KEY']),
          }
          sealed = []
          for environment, (encoded_key, names) in targets.items():
            key = base64.b64decode(encoded_key, validate=True)
            assert len(key) == 32
            for name in names:
              value = os.environ[name].encode('utf8')
              assert value, f'Missing source secret: {name}'
              output = ctypes.create_string_buffer(len(value) + 48)
              assert sodium.crypto_box_seal(output, value, len(value), key) == 0
              sealed.append({'environment': environment, 'name': name, 'key_id': '3380204578043523366', 'encrypted_value': base64.b64encode(output.raw).decode('ascii')})
          with open('sealed.json', 'w') as target:
            json.dump(sealed, target)
          print(f'Sealed {len(sealed)} destination records; no plaintext exported.')
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sealed-environment-secrets
          path: sealed.json
          retention-days: 1
