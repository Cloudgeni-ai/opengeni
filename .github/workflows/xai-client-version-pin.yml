name: Grok Client Version Pin

# xAI refuses SuperGrok requests from Grok CLI versions below its minimum.
# This keeps the version Opengeni presents on the current Grok CLI stable
# release by opening (or refreshing) one pull request.
on:
  schedule:
    - cron: "43 5 * * *"
  workflow_dispatch:

permissions:
  actions: write # dispatch PR CI on the pull request's exact head
  contents: write
  pull-requests: write

concurrency:
  group: xai-client-version-pin
  cancel-in-progress: false

jobs:
  update:
    name: Update the Grok client version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Resolve and rewrite the pin
        run: bun scripts/xai-client-version-pin.ts

      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "The Grok client version is current."
            exit 0
          fi
          branch=chore/xai-client-version-auto
          summary="$(bun scripts/xai-client-version-pin.ts --describe)"
          printf -- '---\n"@opengeni/xai-subscription": patch\n---\n\nSuperGrok requests present the current Grok CLI stable release (%s), so xAI does not refuse them as an outdated client.\n' "${summary#Grok client version: }" > .changeset/xai-client-version-auto.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git add -A packages/xai-subscription/src/constants.ts .changeset/xai-client-version-auto.md
          git commit -m "chore(xai): update the Grok client version" -m "$summary"
          # A force push to the PR replaces its head, which throws away a running
          # merge batch that holds it. Push only when the pins actually differ from
          # the open PR's, and never while it is in a batch (the next run retries).
          pr_state="$(gh pr view "$branch" --json state,labels --jq '.state + " " + ([.labels[].name] | join(","))' 2>/dev/null || true)"
          mapfile -t changed < <(git diff --name-only HEAD~1 HEAD)
          if [[ "$pr_state" == OPEN* ]] && git fetch --quiet --depth=2 origin "$branch" &&
            [ "$(git diff --name-only FETCH_HEAD~1 FETCH_HEAD)" = "$(printf '%s\n' "${changed[@]}")" ] &&
            git diff --quiet FETCH_HEAD HEAD -- "${changed[@]}"; then
            head_sha="$(git rev-parse FETCH_HEAD)"
            echo "The open pull request already carries these pins; its head stays $head_sha."
            checks="$(gh api "repos/$GITHUB_REPOSITORY/commits/$head_sha/check-runs?check_name=PR%20CI" --jq .total_count)"
            if [ "$checks" != 0 ]; then exit 0; fi
          elif [[ "$pr_state" == OPEN* && ",${pr_state#* }," == *,in-batch,* ]]; then
            echo "The pull request is in a running merge batch; leaving it unchanged until the next run."
            exit 0
          else
            git push --force origin "$branch"
            head_sha="$(git rev-parse HEAD)"
            body="$(printf 'Automated pin refresh from the Grok CLI stable channel.\n\n%s' "$summary")"
            if [[ "$pr_state" == OPEN* ]]; then
              gh pr edit "$branch" --body "$body"
            else
              gh pr create --base main --head "$branch" \
                --title "chore(xai): update the Grok client version" --body "$body"
            fi
          fi
          # Pushes made with GITHUB_TOKEN start no pull_request workflows, and the
          # merge batcher batches a PR only once PR CI passed on its exact head.
          number="$(gh pr view "$branch" --json number --jq .number)"
          gh workflow run pr-ci.yml --ref "$branch" -f pr_number="$number" -f head_sha="$head_sha"
