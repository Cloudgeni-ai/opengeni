name: Publish opengeni CLI
run-name: publish-cli:${{ inputs.source_sha }}

# Publishes ONLY the unscoped `opengeni` CLI (bin-only, no dependencies) with
# dist-tag latest. It never publishes or retags an @opengeni/* package; the
# full stable release (publish-packages.yml) stays the path for those.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact main commit whose packages/cli version to publish"
        required: true
        type: string

concurrency:
  group: publish-cli
  cancel-in-progress: false

permissions:
  contents: read
  checks: read

jobs:
  publish:
    environment: package-release
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      checks: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Restore complete checkout history without listing refs
        shell: bash
        timeout-minutes: 7
        env:
          EXPECTED_CHECKOUT_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD 2>/dev/null)"
          selected_fetch="$checked_out_sha"
          if [ -n "${EXPECTED_SELECTED_PULL_REF:-}" ]; then
            if [[ ! "$EXPECTED_SELECTED_PULL_REF" =~ ^refs/pull/[0-9]+/head$ ]]; then
              echo "::error::Selected checkout identity changed"
              exit 1
            fi
            selected_fetch="+$EXPECTED_SELECTED_PULL_REF:refs/remotes/origin/selected-pull"
          fi
          # A fetch occasionally stalls on GitHub's side; a normal one takes
          # about a minute. Bound each attempt and try again a few times.
          fetched=false
          for attempt in 1 2 3; do
            fetch_args=()
            if [ "$(git rev-parse --is-shallow-repository 2>/dev/null)" = true ]; then
              fetch_args+=(--unshallow)
            fi
            if timeout --kill-after=10s 120s git fetch --quiet --no-tags --prune --no-recurse-submodules "${fetch_args[@]}" origin \
              '+refs/heads/main:refs/remotes/origin/main' \
              '+refs/heads/production:refs/remotes/origin/production' \
              '+refs/tags/*:refs/tags/*' \
              "$selected_fetch" >/dev/null 2>&1; then
              fetched=true
              break
            fi
            echo "::warning::Repository history fetch attempt $attempt failed or stalled"
          done
          if [ "$fetched" != true ]; then
            echo "::error::Could not restore complete repository history"
            exit 1
          fi
          if [ "$(git rev-parse --is-shallow-repository 2>/dev/null)" != false ] ||
             [ "$(git rev-parse HEAD 2>/dev/null)" != "$checked_out_sha" ]; then
            echo "::error::Repository history or source identity changed"
            exit 1
          fi
          if [ -n "${EXPECTED_SELECTED_PULL_REF:-}" ] &&
             [ "$(git rev-parse refs/remotes/origin/selected-pull 2>/dev/null)" != "$checked_out_sha" ]; then
            echo "::error::Selected checkout identity changed"
            exit 1
          fi
          if [ -n "${EXPECTED_CHECKOUT_SHA:-}" ] &&
             [ "$checked_out_sha" != "$EXPECTED_CHECKOUT_SHA" ]; then
            echo "::error::Selected checkout identity changed"
            exit 1
          fi
          if [ -n "${EXPECTED_CHECKOUT_REF:-}" ] &&
             [ "$(git rev-parse "$EXPECTED_CHECKOUT_REF" 2>/dev/null)" != "$checked_out_sha" ]; then
            echo "::error::Selected checkout identity changed"
            exit 1
          fi
      - name: Verify exact main source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$GITHUB_REF" = "refs/heads/main"
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main || {
            echo "source_sha must be reachable from origin/main" >&2
            exit 1
          }

      - name: Require successful protected source CI
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          # Ask for each required check by name: a busy merge commit can carry
          # more than one page of check runs, so one unfiltered page can miss it.
          # Skipped runs never executed, so they cannot outrank the run that did:
          # the main-to-production pull request reruns CI on the same SHA and
          # skips its jobs, which would otherwise become the latest check run.
          for name in "Typecheck and unit tests" "Deployment artifacts" "Workload image builds"; do
            checks="$(gh api -X GET \
              --header 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/commits/${SOURCE_SHA}/check-runs" \
              -f check_name="$name" -f filter=latest -f per_page=100)"
            jq -e \
              --arg name "$name" \
              '[.check_runs[]
                | select(.name == $name and .app.slug == "github-actions" and .conclusion != "skipped")]
                | if length == 0 then false
                  else max_by(.id)
                    | .status == "completed" and .conclusion == "success"
                  end' \
              <<<"$checks" >/dev/null || {
                echo "required exact-source check is not successful: $name" >&2
                exit 1
              }
          done

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test the CLI
        working-directory: packages/cli
        run: bun test

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Stage, pack and smoke-test the bin-only CLI
        run: bun scripts/publish-cli-only.ts stage "$RUNNER_TEMP/opengeni-cli"

      - name: Publish the CLI
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: bun scripts/publish-cli-only.ts publish "$RUNNER_TEMP/opengeni-cli"

      - name: Confirm npm serves the CLI as latest
        run: bun scripts/publish-cli-only.ts verify "$RUNNER_TEMP/opengeni-cli"
