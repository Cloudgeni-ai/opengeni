name: Open Version PR

# Manual official version freeze on main. Not run on every push.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  version:
    name: Open or update Version PR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Restore complete checkout history without listing refs
        shell: bash
        timeout-minutes: 5
        env:
          EXPECTED_CHECKOUT_REF: refs/remotes/origin/main
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD 2>/dev/null)"
          fetch_args=()
          if [ "$(git rev-parse --is-shallow-repository 2>/dev/null)" = true ]; then
            fetch_args+=(--unshallow)
          fi
          selected_fetch="$checked_out_sha"
          if [ -n "${EXPECTED_SELECTED_PULL_REF:-}" ]; then
            if [[ ! "$EXPECTED_SELECTED_PULL_REF" =~ ^refs/pull/[0-9]+/head$ ]]; then
              echo "::error::Selected checkout identity changed"
              exit 1
            fi
            selected_fetch="+$EXPECTED_SELECTED_PULL_REF:refs/remotes/origin/selected-pull"
          fi
          if ! git fetch --quiet --no-tags --prune --no-recurse-submodules "${fetch_args[@]}" origin \
            '+refs/heads/*:refs/remotes/origin/*' \
            '+refs/tags/*:refs/tags/*' \
            "$selected_fetch" >/dev/null 2>&1; then
            echo "::error::Could not restore complete repository history"
            exit 1
          fi
          if [ "$(git rev-parse --is-shallow-repository 2>/dev/null)" != false ] ||
             [ "$(git rev-parse HEAD 2>/dev/null)" != "$checked_out_sha" ]; then
            echo "::error::Repository history or source identity changed"
            exit 1
          fi
          if [ -n "${EXPECTED_SELECTED_PULL_REF:-}" ] &&
             [ "$(git rev-parse refs/remotes/origin/selected-pull 2>/dev/null)" != "$checked_out_sha" ]; then
            echo "::error::Selected checkout identity changed"
            exit 1
          fi
          if [ -n "${EXPECTED_CHECKOUT_SHA:-}" ] &&
             [ "$checked_out_sha" != "$EXPECTED_CHECKOUT_SHA" ]; then
            echo "::error::Selected checkout identity changed"
            exit 1
          fi
          if [ -n "${EXPECTED_CHECKOUT_REF:-}" ] &&
             [ "$(git rev-parse "$EXPECTED_CHECKOUT_REF" 2>/dev/null)" != "$checked_out_sha" ]; then
            echo "::error::Selected checkout identity changed"
            exit 1
          fi
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Detect versionable changesets
        id: release_plan
        shell: bash
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/changeset-status.json"
          bunx changeset status --output "$plan"
          changeset_count="$(jq -er '.changesets | length' "$plan")"
          release_count="$(jq -er '.releases | length' "$plan")"
          if [ "$changeset_count" -gt 0 ] && [ "$release_count" -eq 0 ]; then
            echo "::error::pending changesets target only ignored/private packages and cannot produce a Version PR"
            exit 1
          fi
          if [ "$release_count" -gt 0 ]; then
            echo "has_releases=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_releases=false" >> "$GITHUB_OUTPUT"
            echo "No publishable package changesets; a Version PR is not required."
          fi

      - name: Create or update Version PR
        id: changesets
        if: ${{ steps.release_plan.outputs.has_releases == 'true' }}
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
        with:
          version: bun run changeset:version
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Dispatch exact-head Version PR CI
        if: ${{ steps.release_plan.outputs.has_releases == 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION_PR_NUMBER: ${{ steps.changesets.outputs.pullRequestNumber }}
        run: node scripts/check-release-pr-automation.mjs dispatch-version-ci
