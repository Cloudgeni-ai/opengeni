name: Release publication admission

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact accepted release-data SHA.
        required: true
        type: string
      controller_sha:
        description: Exact retained Version-PR base controller SHA.
        required: true
        type: string
      candidate_run_id:
        description: Exact admitted candidate producer run.
        required: true
        type: string
      acceptance_run_id:
        description: Exact protected acceptance producer run.
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify accepted historical release train
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out exact retained release controller
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Check out exact accepted source as data
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.source_sha }}
          path: .release/source
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Re-prove the accepted historical release train
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          CONTROLLER_SHA: ${{ inputs.controller_sha }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          ACCEPTANCE_RUN_ID: ${{ inputs.acceptance_run_id }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "$CONTROLLER_SHA" =~ ^[0-9a-f]{40}$ ]] || exit 1
          expected_ref="refs/tags/opengeni-release-head-$CONTROLLER_SHA"
          [ "$GITHUB_REF" = "$expected_ref" ] || {
            echo "publication admission is not running from the retained controller ref" >&2
            exit 1
          }
          [ "$GITHUB_SHA" = "$CONTROLLER_SHA" ] || {
            echo "publication admission workflow differs from controller_sha" >&2
            exit 1
          }
          [ "$(git rev-parse HEAD)" = "$CONTROLLER_SHA" ] || exit 1
          [ "$(git -C .release/source rev-parse HEAD)" = "$SOURCE_SHA" ] || exit 1
          git -C .release/source fetch --no-tags origin main
          git -C .release/source merge-base --is-ancestor "$SOURCE_SHA" origin/main || {
            echo "accepted source is no longer an ancestor of current main" >&2
            exit 1
          }
          bun scripts/verify-release-provenance.ts \
            --kind candidate \
            --source-sha "$SOURCE_SHA" \
            --controller-sha "$CONTROLLER_SHA" \
            --run-id "$CANDIDATE_RUN_ID" \
            --output "$RUNNER_TEMP/candidate-provenance.json"
          bun scripts/verify-release-provenance.ts \
            --kind acceptance \
            --source-sha "$SOURCE_SHA" \
            --controller-sha "$CONTROLLER_SHA" \
            --run-id "$ACCEPTANCE_RUN_ID" \
            --output "$RUNNER_TEMP/acceptance-provenance.json"
