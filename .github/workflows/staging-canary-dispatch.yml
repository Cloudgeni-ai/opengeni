name: Staging canary dispatch

# Receipt only: pin already-baked canary-sha-* images for an exact main SHA.
# Does not deploy a cluster. Pending changesets OK. Missing tags fail closed.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character main SHA whose canary-sha images should be staged.
        required: true
        type: string

permissions:
  contents: read
  packages: read

jobs:
  receipt:
    name: Pin canary-sha digests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the requested SHA
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Require lowercase SHA and canary-sha tags
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [ "$(git rev-parse HEAD)" = "$SOURCE_SHA" ]
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$SOURCE_SHA" origin/main
          prefix="ghcr.io/cloudgeni-ai"
          missing=0
          for image in api worker web relay sandbox artifact-materializer artifact-outbox-dispatcher; do
            tag="$prefix/opengeni-$image:canary-sha-$SOURCE_SHA"
            if ! docker buildx imagetools inspect "$tag" >/dev/null 2>&1; then
              echo "::error::missing $tag"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::canary-sha tags missing; refuse unsigned rebuild"
            exit 1
          fi
          mkdir -p .release
          jq -n \
            --arg sourceSha "$SOURCE_SHA" \
            --arg tag "canary-sha-$SOURCE_SHA" \
            '{schemaVersion:1, sourceSha:$sourceSha, imageTag:$tag, pendingChangesetsAllowed:true}' \
            > .release/staging-canary-receipt.json

      - name: Upload staging canary receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: staging-canary-${{ inputs.source_sha }}
          path: .release/staging-canary-receipt.json
          if-no-files-found: error
          retention-days: 90
