name: Release embedded distribution

# Publish an exact OpenGeni SDK/runtime distribution for self-hosted embedding
# consumers. This path deliberately does not claim hosted Workbench acceptance:
# it promotes only bytes already built by release-candidate.yml after exact-head
# package CI, and it never updates the hosted deployment's `latest` image tags.

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact versioned main SHA used to build the immutable candidate.
        required: true
        type: string
      expected_packages:
        description: Exact comma-separated @opengeni package@version set, or empty for an application-only release.
        required: false
        default: ""
        type: string
      package_source_sha:
        description: Exact source SHA of the verified package-publication receipt for an application-only release.
        required: false
        default: ""
        type: string
      package_run_id:
        description: Successful canonical publish-packages run that retained the verified package BOM.
        required: false
        default: ""
        type: string
      candidate_run_id:
        description: Completed run ID of the canonical release-candidate workflow for source_sha.
        required: true
        type: string
      controller_sha:
        description: Exact retained controller SHA that admitted the candidate run.
        required: true
        type: string
      confirm_distribution:
        description: Confirm this exact candidate is ready for public embedded/self-hosted use.
        required: true
        default: false
        type: boolean

concurrency:
  group: release-embedded-${{ inputs.source_sha }}
  cancel-in-progress: false

env:
  OPENGENI_RELEASE_SOURCE_ROOT: ${{ github.workspace }}

permissions:
  contents: read

jobs:
  source-verification:
    name: Verify admitted source without publication authority
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ vars.RELEASE_ENABLED == 'true' && inputs.confirm_distribution }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out evidence-bound source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out exact release controller
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.controller_sha }}
          path: .release/controller
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Admit the candidate before source execution
        id: candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          CONTROLLER_SHA: ${{ inputs.controller_sha }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CONTROLLER_SHA" =~ ^[0-9a-f]{40}$ ]]
          [ "$(git rev-parse HEAD)" = "$SOURCE_SHA" ]
          [ "$(git -C .release/controller rev-parse HEAD)" = "$CONTROLLER_SHA" ]
          expected_ref="refs/tags/opengeni-release-head-$CONTROLLER_SHA"
          [ "$GITHUB_REF" = "$expected_ref" ]
          [ "$GITHUB_SHA" = "$CONTROLLER_SHA" ]
          mkdir -p evidence
          (
            cd .release/controller
            bun scripts/verify-release-provenance.ts \
              --kind candidate \
              --source-sha "$SOURCE_SHA" \
              --controller-sha "$CONTROLLER_SHA" \
              --run-id "$CANDIDATE_RUN_ID" \
              --output "$GITHUB_WORKSPACE/evidence/candidate-provenance.json" \
              --output-prefix candidate
          )

      - name: Download and validate the admitted candidate receipt
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          EXPECTED_PACKAGES: ${{ inputs.expected_packages }}
          CANDIDATE_ARTIFACT_ID: ${{ steps.candidate.outputs.candidate_artifact_id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ steps.candidate.outputs.candidate_artifact_digest }}
          CANDIDATE_SOURCE_TREE_SHA: ${{ steps.candidate.outputs.candidate_source_tree_sha }}
        run: |
          set -euo pipefail
          mkdir -p .release/candidate-verification
          zip=.release/candidate-verification/artifact.zip
          gh api \
            --header 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CANDIDATE_ARTIFACT_ID}/zip" \
            > "$zip"
          printf '%s  %s\n' "${CANDIDATE_ARTIFACT_DIGEST#sha256:}" "$zip" \
            | sha256sum --check --strict -
          mapfile -t receipts < <(unzip -Z1 "$zip" | grep -E '(^|/)release-candidate\.json$')
          mapfile -t sidecars < <(unzip -Z1 "$zip" | grep -E '(^|/)release-candidate\.sha256$')
          test "${#receipts[@]}" -eq 1 -a "${#sidecars[@]}" -eq 1
          unzip -p "$zip" "${receipts[0]}" > evidence/release-candidate.json
          unzip -p "$zip" "${sidecars[0]}" > evidence/release-candidate.sha256
          receipt_sha="$(sha256sum evidence/release-candidate.json | awk '{print $1}')"
          test "$receipt_sha" = "$(awk 'NF { print $1; exit }' evidence/release-candidate.sha256)"
          jq -e \
            --arg sourceSha "$SOURCE_SHA" \
            --arg sourceTreeSha "$CANDIDATE_SOURCE_TREE_SHA" \
            --slurpfile producer evidence/candidate-provenance.json \
            '.sourceSha == $sourceSha and .sourceTreeSha == $sourceTreeSha and .producer == $producer[0].producer' \
            evidence/release-candidate.json >/dev/null
          args=(
            --verify "$GITHUB_WORKSPACE/evidence/release-candidate.json"
            --source-sha "$SOURCE_SHA"
          )
          if [ -n "$EXPECTED_PACKAGES" ]; then
            args+=(--expected-packages "$EXPECTED_PACKAGES")
          fi
          (cd .release/controller && bun scripts/release-candidate.ts "${args[@]}")
          release_version="$(jq -er .releaseVersion evidence/release-candidate.json)"
          source_version="$(cd .release/controller && bun scripts/release-version.ts "$GITHUB_WORKSPACE/deploy/helm/opengeni/Chart.yaml")"
          [ "$release_version" = "$source_version" ]

      - name: Install admitted source dependencies
        run: bun install --frozen-lockfile

      - name: Run source package gates
        run: |
          set -euo pipefail
          bun run typecheck
          bun run build:packages
          (cd packages/sdk && bun test test/contract-parity.test.ts)
          bun run test:runtime-embedding-consumer
          bun run test:publish-consumer

      - name: Restore the controller after source verification
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.controller_sha }}
          path: .release/controller
          fetch-depth: 1
          clean: true
          persist-credentials: false

      - name: Verify publish closure from the restored controller
        run: cd .release/controller && bun scripts/publish-closure-guard.ts

  release:
    name: Publish exact packages, chart, images, and BOM
    needs: source-verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: embedded-release
    if: ${{ vars.RELEASE_ENABLED == 'true' && inputs.confirm_distribution }}
    env:
      OPENGENI_RELEASE_OCI_PREFIX: ${{ vars.OPENGENI_RELEASE_OCI_PREFIX || 'ghcr.io/cloudgeni-ai' }}
      OPENGENI_RELEASE_REGISTRY_AUTH: ${{ vars.OPENGENI_RELEASE_REGISTRY_AUTH || 'github' }}
    permissions:
      contents: write
      id-token: write
      packages: write
      actions: read
    steps:
      - name: Check out evidence-bound source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Check out exact release controller
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.controller_sha }}
          path: .release/controller
          fetch-depth: 1
          persist-credentials: false

      - name: Validate exact released source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          CONTROLLER_SHA: ${{ inputs.controller_sha }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          EXPECTED_PACKAGES: ${{ inputs.expected_packages }}
          PACKAGE_SOURCE_SHA: ${{ inputs.package_source_sha }}
          PACKAGE_RUN_ID: ${{ inputs.package_run_id }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "source_sha must be a 40-character lowercase git SHA" >&2
            exit 1
          }
          [[ "$CANDIDATE_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]] || {
            echo "candidate_run_id must be a positive workflow run ID" >&2
            exit 1
          }
          [[ "$CONTROLLER_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "controller_sha must be a 40-character lowercase git SHA" >&2
            exit 1
          }
          [ "$(git -C .release/controller rev-parse HEAD)" = "$CONTROLLER_SHA" ] || {
            echo "release controller checkout differs from controller_sha" >&2
            exit 1
          }
          if [ -z "$EXPECTED_PACKAGES" ]; then
            [[ "$PACKAGE_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
              echo "application-only releases require package_source_sha" >&2
              exit 1
            }
            [[ "$PACKAGE_RUN_ID" =~ ^[1-9][0-9]{0,19}$ ]] || {
              echo "application-only releases require package_run_id" >&2
              exit 1
            }
          elif [ -n "$PACKAGE_SOURCE_SHA" ] || [ -n "$PACKAGE_RUN_ID" ]; then
            echo "source-bound package publication cannot also select package BOM evidence" >&2
            exit 1
          fi
          [ "$(git rev-parse HEAD)" = "$SOURCE_SHA" ] || {
            echo "checked-out source does not match source_sha" >&2
            exit 1
          }
          expected_ref="refs/tags/opengeni-release-head-$CONTROLLER_SHA"
          [ "$GITHUB_REF" = "$expected_ref" ] || {
            echo "embedded release is not running from the retained controller ref" >&2
            exit 1
          }
          [ "$GITHUB_SHA" = "$CONTROLLER_SHA" ] || {
            echo "embedded release dispatch ref differs from controller_sha" >&2
            exit 1
          }
          [ "$GITHUB_WORKFLOW_SHA" = "$CONTROLLER_SHA" ] || {
            echo "embedded release workflow graph differs from controller_sha" >&2
            exit 1
          }
          [ "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/release-embedded.yml@$expected_ref" ] || {
            echo "unexpected embedded release workflow identity: $GITHUB_WORKFLOW_REF" >&2
            exit 1
          }
          git fetch --no-tags origin production
          git merge-base --is-ancestor "$SOURCE_SHA" origin/production || {
            echo "source_sha must be reachable from origin/production; promote main first" >&2
            exit 1
          }
          if [ -n "$PACKAGE_SOURCE_SHA" ]; then
            git merge-base --is-ancestor "$PACKAGE_SOURCE_SHA" origin/production || {
              echo "package_source_sha must be reachable from origin/production; promote main first" >&2
              exit 1
            }
          fi
          if find .changeset -maxdepth 1 -type f -name '*.md' ! -name README.md -print -quit | grep -q .; then
            echo "pending changesets remain; merge the generated Version PR first" >&2
            exit 1
          fi

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Resolve trusted candidate provenance
        id: candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          CONTROLLER_SHA: ${{ inputs.controller_sha }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          set -euo pipefail
          mkdir -p evidence
          (
            cd .release/controller
            bun scripts/verify-release-provenance.ts \
              --kind candidate \
              --source-sha "$SOURCE_SHA" \
              --controller-sha "$CONTROLLER_SHA" \
              --run-id "$CANDIDATE_RUN_ID" \
              --output ../../evidence/candidate-provenance.json \
              --output-prefix candidate
          )

      - name: Resolve trusted package publication provenance
        if: ${{ inputs.expected_packages == '' }}
        id: package
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PACKAGE_SOURCE_SHA: ${{ inputs.package_source_sha }}
          PACKAGE_RUN_ID: ${{ inputs.package_run_id }}
        run: |
          set -euo pipefail
          (
            cd .release/controller
            bun scripts/verify-release-provenance.ts \
              --kind package \
              --source-sha "$PACKAGE_SOURCE_SHA" \
              --run-id "$PACKAGE_RUN_ID" \
              --output ../../evidence/package-provenance.json \
              --output-prefix package
          )

      - name: Download immutable package publication evidence
        if: ${{ inputs.expected_packages == '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PACKAGE_ARTIFACT_ID: ${{ steps.package.outputs.package_artifact_id }}
          PACKAGE_ARTIFACT_DIGEST: ${{ steps.package.outputs.package_artifact_digest }}
        run: |
          set -euo pipefail
          mkdir -p .release/package-artifact
          gh api \
            --header 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${PACKAGE_ARTIFACT_ID}/zip" \
            > .release/package-artifact.zip
          printf '%s  %s\n' \
            "${PACKAGE_ARTIFACT_DIGEST#sha256:}" \
            .release/package-artifact.zip \
            | sha256sum --check --strict -
          unzip -q .release/package-artifact.zip -d .release/package-artifact
          mapfile -t package_receipts < <(find .release/package-artifact -type f -name release-packages-verified.json)
          [ "${#package_receipts[@]}" = 1 ] || {
            echo "package publication artifact must contain exactly one verified receipt" >&2
            exit 1
          }
          cp "${package_receipts[0]}" evidence/package-publication-verified.json

      - name: Download and validate immutable candidate
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          EXPECTED_PACKAGES: ${{ inputs.expected_packages }}
          GITHUB_TOKEN: ${{ github.token }}
          CANDIDATE_ARTIFACT_ID: ${{ steps.candidate.outputs.candidate_artifact_id }}
          CANDIDATE_ARTIFACT_DIGEST: ${{ steps.candidate.outputs.candidate_artifact_digest }}
          CANDIDATE_SOURCE_TREE_SHA: ${{ steps.candidate.outputs.candidate_source_tree_sha }}
        run: |
          set -euo pipefail
          mkdir -p evidence .release/candidate-artifact .release
          gh api \
            --header 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${CANDIDATE_ARTIFACT_ID}/zip" \
            > .release/candidate-artifact.zip
          printf '%s  %s\n' \
            "${CANDIDATE_ARTIFACT_DIGEST#sha256:}" \
            .release/candidate-artifact.zip \
            | sha256sum --check --strict -
          unzip -q .release/candidate-artifact.zip -d .release/candidate-artifact
          candidate_path="$(find .release/candidate-artifact -type f -name release-candidate.json -print -quit)"
          receipt_sidecar_path="$(find .release/candidate-artifact -type f -name release-candidate.sha256 -print -quit)"
          chart_sidecar_path="$(find .release/candidate-artifact -type f -name release-chart.sha256 -print -quit)"
          test -n "$candidate_path" -a -n "$receipt_sidecar_path" -a -n "$chart_sidecar_path"
          cp "$candidate_path" evidence/release-candidate.json
          chart_artifact="$(jq -er '.chart.artifact' evidence/release-candidate.json)"
          chart_path="$(find .release/candidate-artifact -type f -name "$chart_artifact" -print -quit)"
          test -n "$chart_path"
          cp "$chart_path" ".release/$chart_artifact"
          receipt_sha256="$(sha256sum evidence/release-candidate.json | awk '{print $1}')"
          [ "$(awk 'NF { print $1; exit }' "$receipt_sidecar_path")" = "$receipt_sha256" ]
          chart_sha256="$(sha256sum ".release/$chart_artifact" | awk '{print $1}')"
          [ "$(awk 'NF { print $1; exit }' "$chart_sidecar_path")" = "$chart_sha256" ]
          [ "$chart_sha256" = "$(jq -er '.chart.bytesSha256' evidence/release-candidate.json)" ]
          jq -e \
            --arg sourceSha "$SOURCE_SHA" \
            --arg sourceTreeSha "$CANDIDATE_SOURCE_TREE_SHA" \
            --slurpfile producer evidence/candidate-provenance.json \
            '.sourceSha == $sourceSha and .sourceTreeSha == $sourceTreeSha and .producer == $producer[0].producer' \
            evidence/release-candidate.json >/dev/null
          candidate_verify_args=(
            --verify "$GITHUB_WORKSPACE/evidence/release-candidate.json"
            --source-sha "$SOURCE_SHA"
          )
          if [ -n "$EXPECTED_PACKAGES" ]; then
            candidate_verify_args+=(--expected-packages "$EXPECTED_PACKAGES")
          fi
          (cd .release/controller && bun scripts/release-candidate.ts "${candidate_verify_args[@]}")
          release_version="$(jq -er '.releaseVersion' evidence/release-candidate.json)"
          [ "$release_version" = "$(cd .release/controller && bun scripts/release-version.ts "$GITHUB_WORKSPACE/deploy/helm/opengeni/Chart.yaml")" ] || {
            echo "candidate release version differs from the source-controlled chart version" >&2
            exit 1
          }

      - name: Prepare admitted package bytes for publication
        run: |
          set -euo pipefail
          bun install --frozen-lockfile
          bun run build:packages

      - name: Download and verify source-bound artifact runtime inputs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
        run: |
          set -euo pipefail
          artifact_name="artifact-runtime-containers-${SOURCE_SHA}"
          runtime_root=".release/artifact-runtime"
          archive=".release/opengeni-artifact-runtime-${SOURCE_SHA}.tgz"
          rm -rf "$runtime_root"
          gh run download "$CANDIDATE_RUN_ID" \
            --name "$artifact_name" \
            --dir "$runtime_root"
          for architecture in amd64 arm64; do
            bun scripts/verify-artifact-runtime-container-inputs.ts \
              --root "$GITHUB_WORKSPACE/$runtime_root" \
              --source-sha "$SOURCE_SHA" \
              --architecture "$architecture"
          done
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -C .release -cf - artifact-runtime \
            | gzip -n > "$archive"
          printf '%s  %s\n' \
            "$(sha256sum "$archive" | awk '{print $1}')" \
            "$(basename "$archive")" \
            > "${archive}.sha256"

      - name: Restore the controller after package preparation
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.controller_sha }}
          path: .release/controller
          fetch-depth: 1
          clean: true
          persist-credentials: false

      - name: Resolve distribution version
        id: meta
        run: |
          set -euo pipefail
          version="$(jq -er .releaseVersion evidence/release-candidate.json)"
          [ "$version" = "$(cd .release/controller && bun scripts/release-version.ts "$GITHUB_WORKSPACE/deploy/helm/opengeni/Chart.yaml")" ] || {
            echo "candidate release version differs from the source-controlled chart version" >&2
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5

      - name: Log in to the public OCI registry
        id: registry-auth
        uses: ./.release/controller/.github/actions/public-oci-login
        with:
          oci-prefix: ${{ env.OPENGENI_RELEASE_OCI_PREFIX }}
          auth: ${{ env.OPENGENI_RELEASE_REGISTRY_AUTH }}
          github-username: ${{ github.actor }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Reconcile existing distribution aliases before publication
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          for role in api worker web relay sandbox artifact-materializer artifact-outbox-dispatcher; do
            name="$(jq -er --arg role "$role" '.images[$role].name' evidence/release-candidate.json)"
            expected="$(jq -er --arg role "$role" '.images[$role].digest' evidence/release-candidate.json)"
            for tag in "$RELEASE_VERSION" "sha-${SOURCE_SHA}"; do
              resolved="$(cd .release/controller && bun scripts/resolve-optional-oci-manifest.ts "${name}:${tag}")"
              if [ -n "$resolved" ] && [ "$resolved" != "$expected" ]; then
                echo "${name}:${tag} resolves to ${resolved}, not accepted ${expected}" >&2
                exit 1
              fi
            done
          done

      - name: Reconcile an existing distribution chart before publication
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          chart_ref="${OPENGENI_RELEASE_OCI_PREFIX}/charts/opengeni/opengeni:${RELEASE_VERSION}"
          chart_oci="oci://${OPENGENI_RELEASE_OCI_PREFIX}/charts/opengeni"
          chart_pull_oci="${chart_oci}/opengeni"
          chart_path=".release/opengeni-${RELEASE_VERSION}.tgz"
          resolved="$(cd .release/controller && bun scripts/resolve-optional-oci-manifest.ts "$chart_ref")"
          if [ -n "$resolved" ]; then
            mkdir -p .release/chart-preflight
            helm pull "$chart_pull_oci" \
              --version "$RELEASE_VERSION" \
              --destination .release/chart-preflight
            cmp "$chart_path" ".release/chart-preflight/opengeni-${RELEASE_VERSION}.tgz" || {
              echo "existing distribution chart bytes differ from the accepted candidate" >&2
              exit 1
            }
          fi

      - name: Plan exact package publication
        id: package-plan
        env:
          OPENGENI_RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
          OPENGENI_EXPECTED_PACKAGES: ${{ inputs.expected_packages }}
          OPENGENI_RELEASE_PACKAGE_CLOSURE_ROOT: ${{ github.workspace }}
          OPENGENI_RELEASE_PACKAGE_BOM_RECEIPT: ${{ inputs.expected_packages == '' && format('{0}/evidence/package-publication-verified.json', github.workspace) || '' }}
          OPENGENI_RELEASE_PACKAGE_BOM_SOURCE_SHA: ${{ inputs.package_source_sha }}
          OPENGENI_RELEASE_PACKAGE_PHASE: plan
          OPENGENI_RELEASE_PACKAGE_RECEIPT: ${{ github.workspace }}/evidence/release-packages-plan.json
        run: cd .release/controller && bun scripts/verify-release-packages.ts

      - name: Set up Node for npm provenance
        if: steps.package-plan.outputs.needs_publish == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Publish source-bound packages
        if: steps.package-plan.outputs.needs_publish == 'true'
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
        with:
          publish: bun run release:publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      - name: Restore the controller after source publication
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.controller_sha }}
          path: .release/controller
          fetch-depth: 1
          clean: true
          persist-credentials: false

      - name: Reconcile npm package identity
        id: registry
        env:
          OPENGENI_RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
          OPENGENI_EXPECTED_PACKAGES: ${{ inputs.expected_packages }}
          OPENGENI_RELEASE_PACKAGE_CLOSURE_ROOT: ${{ github.workspace }}
          OPENGENI_RELEASE_PACKAGE_BOM_RECEIPT: ${{ inputs.expected_packages == '' && format('{0}/evidence/package-publication-verified.json', github.workspace) || '' }}
          OPENGENI_RELEASE_PACKAGE_BOM_SOURCE_SHA: ${{ inputs.package_source_sha }}
          OPENGENI_RELEASE_PACKAGE_PHASE: verify
          OPENGENI_RELEASE_PACKAGE_RECEIPT: ${{ github.workspace }}/evidence/release-packages-verified.json
        run: cd .release/controller && bun scripts/verify-release-packages.ts

      - name: Verify complete package evidence
        env:
          VERIFIED_PACKAGES: ${{ steps.registry.outputs.verified_packages }}
          BOM_PACKAGES: ${{ steps.registry.outputs.bom_packages }}
        run: |
          set -euo pipefail
          jq -e 'type == "array" and all(.[]; .state == "published" and (.integrity | startswith("sha512-")))' \
            <<<"$VERIFIED_PACKAGES" >/dev/null
          jq -e 'type == "array" and length > 0 and all(.[]; .state == "published" and (.integrity | startswith("sha512-")))' \
            <<<"$BOM_PACKAGES" >/dev/null

      - name: Publish or reconcile the exact candidate chart
        id: release-chart
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          chart_ref="${OPENGENI_RELEASE_OCI_PREFIX}/charts/opengeni/opengeni:${RELEASE_VERSION}"
          chart_oci="oci://${OPENGENI_RELEASE_OCI_PREFIX}/charts/opengeni"
          chart_pull_oci="${chart_oci}/opengeni"
          chart_path=".release/opengeni-${RELEASE_VERSION}.tgz"
          expected_bytes="$(jq -er .chart.bytesSha256 evidence/release-candidate.json)"
          printf '%s  %s\n' "$expected_bytes" "$chart_path" | sha256sum --check --strict -
          resolved_manifest="$(cd .release/controller && bun scripts/resolve-optional-oci-manifest.ts "$chart_ref")"
          if [ -n "$resolved_manifest" ]; then
            mkdir -p .release/chart-reconcile
            helm pull "$chart_pull_oci" \
              --version "$RELEASE_VERSION" \
              --destination .release/chart-reconcile
            cmp "$chart_path" ".release/chart-reconcile/opengeni-${RELEASE_VERSION}.tgz"
          else
            helm push "$chart_path" "$chart_oci"
            resolved_manifest=""
            for attempt in $(seq 1 10); do
              resolved_manifest="$(cd .release/controller && bun scripts/resolve-optional-oci-manifest.ts "$chart_ref")"
              if [[ "$resolved_manifest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                break
              fi
              if [ "$attempt" -lt 10 ]; then
                sleep 2
              fi
            done
          fi
          [[ "$resolved_manifest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "official OCI chart manifest digest was not resolved" >&2
            exit 1
          }
          chart_json="$(jq -cn \
            --arg version "$RELEASE_VERSION" \
            --arg manifestDigest "$resolved_manifest" \
            --arg bytesSha256 "$expected_bytes" \
            --arg artifact "opengeni-${RELEASE_VERSION}.tgz" \
            --arg reference "$chart_pull_oci" \
            '{reference:$reference,version:$version,manifestDigest:$manifestDigest,bytesSha256:$bytesSha256,artifact:$artifact}')"
          {
            echo 'json<<RELEASE_CHART_JSON'
            echo "$chart_json"
            echo 'RELEASE_CHART_JSON'
            echo "manifest_digest=$resolved_manifest"
          } >> "$GITHUB_OUTPUT"

      - name: Write complete source-bound BOM
        id: release-bom
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          BOM_PACKAGES: ${{ steps.registry.outputs.bom_packages }}
          RELEASE_CHART: ${{ steps.release-chart.outputs.json }}
        run: |
          set -euo pipefail
          images="$(jq -c '[.images | to_entries[] | .value]' evidence/release-candidate.json)"
          (
            export OPENGENI_RELEASE_BOM_SOURCE_SHA="$SOURCE_SHA"
            export OPENGENI_RELEASE_BOM_VERSION="$RELEASE_VERSION"
            export OPENGENI_RELEASE_BOM_PACKAGES="$BOM_PACKAGES"
            export OPENGENI_RELEASE_BOM_IMAGES="$images"
            export OPENGENI_RELEASE_BOM_CHART="$RELEASE_CHART"
            cd .release/controller
            bun scripts/release-bom.ts
          )
          printf '%s  %s\n' \
            "$(sha256sum evidence/release-bom.json | awk '{print $1}')" \
            release-bom.json \
            > evidence/release-bom.sha256

      - name: Compare an existing immutable distribution before image mutation
        id: release-preflight
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          tag="opengeni-embedded-release-${SOURCE_SHA}"
          state="$(cd .release/controller && bun scripts/resolve-github-release-state.ts "$tag")"
          release_exists="$(jq -er '.releaseExists | if type == "boolean" then tostring else error("releaseExists must be boolean") end' <<<"$state")"
          tag_sha="$(jq -r '.tagSha // ""' <<<"$state")"
          [ -z "$tag_sha" ] || [ "$tag_sha" = "$SOURCE_SHA" ] || {
            echo "existing release tag resolves to ${tag_sha}, expected ${SOURCE_SHA}" >&2
            exit 1
          }
          if [ "$release_exists" = "true" ]; then
            mkdir -p .release/existing-release
            gh release download "$tag" \
              --dir .release/existing-release/assets \
              --pattern release-bom.json \
              --pattern release-bom.sha256 \
              --pattern "opengeni-artifact-runtime-${SOURCE_SHA}.tgz" \
              --pattern "opengeni-artifact-runtime-${SOURCE_SHA}.tgz.sha256" \
              --pattern "opengeni-${RELEASE_VERSION}.tgz"
            cmp evidence/release-bom.json .release/existing-release/assets/release-bom.json
            cmp evidence/release-bom.sha256 .release/existing-release/assets/release-bom.sha256
            cmp ".release/opengeni-artifact-runtime-${SOURCE_SHA}.tgz" \
              ".release/existing-release/assets/opengeni-artifact-runtime-${SOURCE_SHA}.tgz"
            cmp ".release/opengeni-artifact-runtime-${SOURCE_SHA}.tgz.sha256" \
              ".release/existing-release/assets/opengeni-artifact-runtime-${SOURCE_SHA}.tgz.sha256"
            cmp ".release/opengeni-${RELEASE_VERSION}.tgz" \
              ".release/existing-release/assets/opengeni-${RELEASE_VERSION}.tgz"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif [ "$release_exists" = "false" ]; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "GitHub release-state resolver returned an invalid state" >&2
            exit 1
          fi

      - name: Promote exact candidate manifests
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          for role in api worker web relay sandbox artifact-materializer artifact-outbox-dispatcher; do
            name="$(jq -er --arg role "$role" '.images[$role].name' evidence/release-candidate.json)"
            digest="$(jq -er --arg role "$role" '.images[$role].digest' evidence/release-candidate.json)"
            source="${name}@${digest}"
            docker buildx imagetools create \
              --prefer-index=false \
              --tag "${name}:${RELEASE_VERSION}" \
              --tag "${name}:sha-${SOURCE_SHA}" \
              "$source"
            for tag in "${RELEASE_VERSION}" "sha-${SOURCE_SHA}"; do
              promoted="$(docker buildx imagetools inspect "${name}:${tag}" --format '{{.Manifest.Digest}}')"
              [ "$promoted" = "$digest" ] || {
                echo "${name}:${tag} resolved to ${promoted}, expected ${digest}" >&2
                exit 1
              }
            done
          done

      - name: Verify anonymous distribution pulls
        env:
          REGISTRY: ${{ steps.registry-auth.outputs.registry }}
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          CHART_MANIFEST_DIGEST: ${{ steps.release-chart.outputs.manifest_digest }}
        run: |
          set -euo pipefail
          docker logout "$REGISTRY"
          for role in api worker web relay sandbox artifact-materializer artifact-outbox-dispatcher; do
            name="$(jq -er --arg role "$role" '.images[$role].name' evidence/release-candidate.json)"
            expected="$(jq -er --arg role "$role" '.images[$role].digest' evidence/release-candidate.json)"
            for tag in "$RELEASE_VERSION" "sha-${SOURCE_SHA}"; do
              resolved=""
              for attempt in 1 2 3 4 5; do
                resolved="$(docker buildx imagetools inspect "${name}:${tag}" --format '{{.Manifest.Digest}}' 2>/dev/null || true)"
                [ "$resolved" = "$expected" ] && break
                sleep "$((attempt * 2))"
              done
              [ "$resolved" = "$expected" ] || {
                echo "anonymous pull failed for ${name}:${tag}" >&2
                exit 1
              }
            done
          done
          helm registry logout "$REGISTRY"
          mkdir -p .release/anonymous-chart
          helm pull "oci://${OPENGENI_RELEASE_OCI_PREFIX}/charts/opengeni/opengeni" \
            --version "$RELEASE_VERSION" \
            --destination .release/anonymous-chart
          cmp ".release/opengeni-${RELEASE_VERSION}.tgz" \
            ".release/anonymous-chart/opengeni-${RELEASE_VERSION}.tgz"
          [ "$(cd .release/controller && bun scripts/resolve-optional-oci-manifest.ts \
            "${OPENGENI_RELEASE_OCI_PREFIX}/charts/opengeni/opengeni:${RELEASE_VERSION}")" \
            = "$CHART_MANIFEST_DIGEST" ]

      - name: Upload release BOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: embedded-release-bom-${{ inputs.source_sha }}
          path: |
            evidence/release-bom.json
            evidence/release-bom.sha256
            evidence/release-candidate.json
            evidence/candidate-provenance.json
            evidence/package-provenance.json
            evidence/package-publication-verified.json
            evidence/release-packages-verified.json
            .release/opengeni-${{ steps.meta.outputs.version }}.tgz
            .release/opengeni-artifact-runtime-${{ inputs.source_sha }}.tgz
            .release/opengeni-artifact-runtime-${{ inputs.source_sha }}.tgz.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Publish immutable source-bound release receipt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          RELEASE_EXISTS: ${{ steps.release-preflight.outputs.exists }}
        run: |
          set -euo pipefail
          tag="opengeni-embedded-release-${SOURCE_SHA}"
          if [ "$RELEASE_EXISTS" = "true" ]; then
            resolved="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${tag}" --jq .sha)"
            [ "$resolved" = "$SOURCE_SHA" ] || {
              echo "existing release tag resolves to ${resolved}, expected ${SOURCE_SHA}" >&2
              exit 1
            }
          elif [ "$RELEASE_EXISTS" = "false" ]; then
            gh release create "$tag" \
              evidence/release-bom.json \
              evidence/release-bom.sha256 \
              ".release/opengeni-${RELEASE_VERSION}.tgz" \
              ".release/opengeni-artifact-runtime-${SOURCE_SHA}.tgz" \
              ".release/opengeni-artifact-runtime-${SOURCE_SHA}.tgz.sha256" \
              --target "$SOURCE_SHA" \
              --title "OpenGeni embedded distribution ${RELEASE_VERSION} (${SOURCE_SHA::12})" \
              --notes "Source-bound npm packages, Helm chart, images, native runtime build inputs, and BOM for embedded consumers." \
              --latest=false
          else
            echo "immutable distribution preflight produced an invalid state" >&2
            exit 1
          fi
