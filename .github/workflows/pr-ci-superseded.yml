name: Cancel superseded PR CI
on:
  pull_request_target:
    branches: [main]
    types: [synchronize]
permissions:
  contents: read
  pull-requests: read
  actions: write
jobs:
  superseded:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Trusted base code only; never execute or check out the incoming PR here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Cancel only superseded PR heads
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun scripts/ci/github-pr-ci.ts superseded
