name: Cancel superseded PR CI
on:
  pull_request_target:
    branches: [main]
    types: [synchronize]
permissions:
  contents: read
  pull-requests: read
  actions: write
jobs:
  superseded:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Trusted base code only; never execute or check out the incoming PR here.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Cancel only superseded PR heads
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bun scripts/ci/github-pr-ci.ts superseded
