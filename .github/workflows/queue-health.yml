name: Queue and main health
on:
  workflow_run:
    workflows: [Merge queue, Batch CI, CI]
    types: [completed]
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: write
  issues: write

jobs:
  report:
    # Filter before claiming a concurrency slot: cheap PR-entry completions must
    # neither consume runners nor displace the hourly reconciliation.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.event == 'merge_group' || (github.event.workflow_run.event == 'push' && startsWith(github.event.workflow_run.head_branch, 'queue/') && github.event.workflow_run.path == '.github/workflows/batch-ci.yml') || (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.path == '.github/workflows/ci.yml') }}
    concurrency:
      group: queue-health-${{ github.event_name == 'workflow_run' && 'event' || 'reconcile' }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # workflow_run is privileged: never execute the triggering PR's code or
      # download/execute its artifacts. Only current trusted default-branch code.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Record stage timings and report failed full main CI
        env:
          GH_TOKEN: ${{ github.token }}
          # Reconciliation is the only public-comment writer. Default off keeps
          # landing instrumentation inert; enable separately at rollout.
          QUEUE_HEALTH_ALERTS: ${{ vars.QUEUE_HEALTH_ALERTS == 'true' && github.event_name != 'workflow_run' && 'true' || 'false' }}
        run: bun scripts/ci/queue-health.ts
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: queue-health-${{ github.run_id }}
          path: queue-health.json
          if-no-files-found: error
          retention-days: 30
