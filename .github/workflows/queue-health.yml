name: Queue and main health
on:
  workflow_run:
    workflows: [Merge queue, CI]
    types: [completed]
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:

# A single writer deduplicates incident comments/issues. It never cancels a
# report already in progress. Pending reports may coalesce; hourly collection
# reconstructs all queue timings from provider history.
concurrency:
  group: queue-health-report
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  pull-requests: write
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # workflow_run is privileged: never execute the triggering PR's code or
      # download/execute its artifacts. Only current trusted default-branch code.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - name: Record stage timings and report failed full main CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun scripts/ci/queue-health.ts
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: queue-health-${{ github.run_id }}
          path: queue-health.json
          if-no-files-found: error
          retention-days: 30
