name: Windows x64 release proof
on:
  push:
    branches: [verify/windows-x64-agent-release]
permissions:
  contents: read
jobs:
  proof:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: agent
          key: x86_64-pc-windows-msvc
      - run: bun install --frozen-lockfile
      - name: Build the Windows x64 agent and interaction runtime
        shell: bash
        run: bash scripts/build-windows-agent-release.sh x64
