name: Publish browser extension

# Builds the browser extension store ZIP from main and submits the version in
# apps/browser-extension/package.json to the Chrome Web Store for review.
# It runs by itself when main changes that file, so every extension version
# that lands is submitted; rerunning for an already submitted or published
# version is a no-op. An automatic run replaces an older version still waiting
# for review: the newer one contains it. The submission waits until a released
# agent supports the extension's protocol (bridge-compat.json), and a failed
# run opens an issue so a refused submission is not missed. Each completed
# agent release runs it again, so an extension that waited for its agent is
# submitted once that agent is out.
# Authentication is keyless: the job's OIDC token is exchanged through Google
# Workload Identity Federation for a service account that is a member of the
# Web Store publisher.
on:
  push:
    branches: [main]
    paths:
      - apps/browser-extension/package.json
  workflow_run:
    workflows: ["Agent Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      publish_type:
        description: "DEFAULT_PUBLISH goes live after review; STAGED_PUBLISH waits for a manual publish."
        required: true
        type: choice
        default: DEFAULT_PUBLISH
        options:
          - DEFAULT_PUBLISH
          - STAGED_PUBLISH
      cancel_pending:
        description: "Cancel a different version that is still pending review and submit this one instead."
        required: true
        type: boolean
        default: false

concurrency:
  group: publish-browser-extension
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    name: Submit to the Chrome Web Store
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      issues: write
    steps:
      - name: Admit protected main
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REPOSITORY" == "Cloudgeni-ai/opengeni" ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]]

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test publisher
        working-directory: apps/browser-extension
        run: bun test test/publish-store.test.ts test/manifest.test.ts test/bridge-compat.test.ts

      - name: Build store ZIP
        working-directory: apps/browser-extension
        run: bun run build:store

      - name: Upload and submit
        working-directory: apps/browser-extension
        env:
          CWS_PUBLISHER_ID: ${{ vars.CWS_PUBLISHER_ID }}
          CWS_ITEM_ID: ${{ vars.CWS_ITEM_ID }}
          CWS_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.CWS_WORKLOAD_IDENTITY_PROVIDER }}
          CWS_SERVICE_ACCOUNT: ${{ vars.CWS_SERVICE_ACCOUNT }}
          CWS_PUBLISH_TYPE: ${{ inputs.publish_type || 'DEFAULT_PUBLISH' }}
          CWS_CANCEL_PENDING: ${{ github.event_name != 'workflow_dispatch' || inputs.cancel_pending }}
          GITHUB_TOKEN: ${{ github.token }}
        run: bun scripts/publish-store.ts

      - name: Close the failed-publish issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          title="Chrome Web Store publish failed"
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')"
          [ -z "$number" ] || gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "Published or submitted by $RUN_URL."

      - name: Report a failed publish
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          title="Chrome Web Store publish failed"
          version="$(jq -r .version apps/browser-extension/package.json)"
          body="Submitting browser extension $version failed: $RUN_URL. Fix the cause (for example a permission justification the store dashboard asks for) and rerun the workflow."
          number="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi
