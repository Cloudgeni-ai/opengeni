name: CI

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      automation_pr_number:
        description: Exact github-actions[bot] Version PR number.
        required: true
        type: string
      automation_head_sha:
        description: Exact Version PR head SHA to admit and test.
        required: true
        type: string
      automation_base_sha:
        description: Exact current main SHA from which the Version PR was generated.
        required: true
        type: string
      source_release_run_id:
        description: Push-triggered Release run that created or updated the Version PR.
        required: true
        type: string
      source_release_run_attempt:
        description: Exact attempt of the source Release run.
        required: true
        type: string

concurrency:
  # A Version PR has one authoritative latest head. When a newer main push
  # regenerates that head, continuing to build the superseded head can only
  # waste capacity and produce a predictably stale terminal-main failure.
  # Ordinary push/PR CI remains independent and is never cancelled here.
  group: ${{ github.event_name == 'workflow_dispatch' && format('ci-automation-{0}', inputs.automation_pr_number) || format('ci-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

permissions:
  contents: read

jobs:
  automation-admission:
    name: Admit automation Version PR
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read # authenticate the exact push-triggered Release run
      checks: write # publish idempotent checks on the candidate head SHA
      contents: write # retain the exact head before any check can make the Version PR mergeable
      pull-requests: read # authenticate the bot PR and provider projection
    env:
      AUTOMATION_PR_NUMBER: ${{ inputs.automation_pr_number }}
      AUTOMATION_HEAD_SHA: ${{ inputs.automation_head_sha }}
      AUTOMATION_BASE_SHA: ${{ inputs.automation_base_sha }}
      AUTOMATION_SOURCE_RUN_ID: ${{ inputs.source_release_run_id }}
      AUTOMATION_SOURCE_RUN_ATTEMPT: ${{ inputs.source_release_run_attempt }}
    steps:
      # workflow_dispatch is sent to ref=main. Pin the checkout again so helper
      # and dependency bytes are the exact trusted base, never candidate bytes.
      - name: Check out trusted workflow source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Begin exact-head automation checks
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-release-pr-automation.mjs begin-version-checks

      - name: Admit trusted dispatch and exact source tree
        id: admission
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-release-pr-automation.mjs admit-version-ci

      - name: Set up Bun
        if: ${{ steps.admission.outcome == 'success' }}
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install trusted-base dependencies
        if: ${{ steps.admission.outcome == 'success' }}
        run: bun install --frozen-lockfile

      # The Changesets action force-resets its branch from the source run SHA.
      # Reproduce the version command using only admitted-base code and compare
      # complete Git trees before any candidate checkout or script execution.
      - name: Reproduce deterministic Version PR tree
        id: version_tree
        if: ${{ steps.admission.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          [ "$GITHUB_SHA" = "$AUTOMATION_BASE_SHA" ]
          git fetch --no-tags origin "$AUTOMATION_HEAD_SHA"
          [ "$(git rev-parse HEAD)" = "$AUTOMATION_BASE_SHA" ]

          expected="$RUNNER_TEMP/changeset-version-expected"
          git worktree add --detach "$expected" "$AUTOMATION_BASE_SHA"
          trap 'git worktree remove --force "$expected"' EXIT
          (
            cd "$expected"
            bun "$GITHUB_WORKSPACE/node_modules/@changesets/cli/bin.js" version
            bun scripts/build-artifact-kernel-wasm-packages.ts --refresh-package-identities
            git add -A
            git diff --cached --check
          )

          expected_tree="$(git -C "$expected" write-tree)"
          actual_tree="$(git rev-parse "$AUTOMATION_HEAD_SHA^{tree}")"
          if [ "$actual_tree" != "$expected_tree" ]; then
            echo "::error::Version PR tree does not exactly reproduce 'changeset version' from admitted main"
            git diff --stat "$expected_tree" "$actual_tree"
            exit 1
          fi

      - name: Complete exact-head source-admission check
        if: ${{ always() }}
        env:
          AUTOMATION_CHECK_KIND: source-admission
          AUTOMATION_CHECK_CONCLUSION: ${{ steps.admission.outcome == 'success' && steps.version_tree.outcome == 'success' && 'success' || 'failure' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-release-pr-automation.mjs complete-version-check

  plan:
    name: Explain change impact
    needs: automation-admission
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || needs.automation-admission.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      unit_count: ${{ steps.plan.outputs.unit_count }}
      integration_count: ${{ steps.plan.outputs.integration_count }}
      e2e_count: ${{ steps.plan.outputs.e2e_count }}
      build_count: ${{ steps.plan.outputs.build_count }}
      unit_matrix: ${{ steps.plan.outputs.unit_matrix }}
      integration_matrix: ${{ steps.plan.outputs.integration_matrix }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.automation_head_sha || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pinned Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install exact dependency tree
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/opengeni-bun-store
        run: >-
          bun scripts/ci/profile-command.ts
          --name dependencies
          --output ci-profile/dependencies.json
          --timeout-seconds 600
          -- bash -euo pipefail -c
          'rm -rf node_modules "$BUN_INSTALL_CACHE_DIR";
          bun install --frozen-lockfile --backend=copyfile'

      - name: Build fail-closed impact plan
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            bun scripts/ci/impact.ts --base "$BASE_SHA" --head "$HEAD_SHA" --output impact-plan.json
          else
            # Main, scheduled, and exact-head automation CI are the mapping-drift
            # safety net and therefore never trust change selection.
            bun scripts/ci/impact.ts --full --output impact-plan.json
          fi
          jq '{schemaVersion, mode, changedCount:(.changedFiles|length), affectedPackageCount:(.affectedPackages|length), typecheckProjectCount:(.typecheckProjects|length), unitCount:(.unitTests|length), integrationCount:(.integrationTests|length), e2eCount:(.e2eTests|length), buildCount:(.buildPackages|length), exampleBuildCount:(.exampleBuildProjects|length), guardCount:(.guards|length), reasonCount:(.reasons|length)}' impact-plan.json
          echo "mode=$(jq -r .mode impact-plan.json)" >> "$GITHUB_OUTPUT"
          echo "unit_count=$(jq '.unitTests | length' impact-plan.json)" >> "$GITHUB_OUTPUT"
          echo "integration_count=$(jq '.integrationTests | length' impact-plan.json)" >> "$GITHUB_OUTPUT"
          echo "e2e_count=$(jq '.e2eTests | length' impact-plan.json)" >> "$GITHUB_OUTPUT"
          echo "build_count=$(jq '.buildPackages | length' impact-plan.json)" >> "$GITHUB_OUTPUT"
          matrix() {
            local selected="$1" maximum="$2" total
            total="$selected"
            if [ "$total" -gt "$maximum" ]; then total="$maximum"; fi
            # A skipped job still needs a syntactically non-empty matrix. The
            # corresponding count guard prevents this sentinel from running.
            if [ "$total" -eq 0 ]; then total=1; fi
            jq -cn --argjson total "$total" \
              '[range(0; $total) | {index: ., number: (. + 1), total: $total}]'
          }
          echo "unit_matrix=$(matrix "$(jq '.unitTests | length' impact-plan.json)" 4)" >> "$GITHUB_OUTPUT"
          echo "integration_matrix=$(matrix "$(jq '.integrationTests | length' impact-plan.json)" 6)" >> "$GITHUB_OUTPUT"
          {
            echo '### Change-impact plan'
            echo
            echo '```json'
            jq '{mode, changedFiles, affectedPackages, reasons, typecheckProjects, unitCount:(.unitTests|length), integrationTests, e2eTests, buildPackages, exampleBuildProjects}' impact-plan.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record dependency cache outcome
        if: ${{ always() }}
        run: |
          set -euo pipefail
          [ -f ci-profile/dependencies.json ] || exit 0
          jq \
            '.cache = {kind:"fresh-bun-package-store", hit:false, cleanInstall:true, backend:"copyfile"}' \
            ci-profile/dependencies.json > ci-profile/dependencies.json.tmp
          mv ci-profile/dependencies.json.tmp ci-profile/dependencies.json

      - name: Upload exact impact plan
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ci-impact-plan
          path: impact-plan.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload dependency resource profile
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ci-profile-dependencies
          path: ci-profile/dependencies.json
          if-no-files-found: error
          retention-days: 14

  source-contracts:
    name: Source and type contracts
    needs: [automation-admission, plan]
    if: ${{ always() && needs.plan.result == 'success' && (github.event_name != 'workflow_dispatch' || needs.automation-admission.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.automation_head_sha || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache Bun dependencies
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download exact impact plan
        uses: actions/download-artifact@v4
        with:
          name: ci-impact-plan
          path: ${{ runner.temp }}/ci-impact-plan

      - name: Validate changeset release plan
        shell: bash
        env:
          AUTOMATION_BASE_SHA: ${{ inputs.automation_base_sha }}
          AUTOMATION_HEAD_SHA: ${{ inputs.automation_head_sha }}
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/changeset-status.json"
          git fetch --no-tags origin refs/heads/main:refs/remotes/origin/main
          git update-ref refs/heads/main refs/remotes/origin/main

          # `changeset status` deliberately exits non-zero on the generated
          # Version PR: its package files changed and the consumed changeset is
          # gone. Prove that special branch by reproducing `changeset version`
          # from the exact base tree and comparing complete Git trees instead
          # of skipping release-plan validation.
          is_version_pr=false
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ] && [ "${GITHUB_HEAD_REF:-}" = "changeset-release/main" ]; then
            is_version_pr=true
          elif [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            [ "$(git rev-parse refs/remotes/origin/main)" = "$AUTOMATION_BASE_SHA" ]
            [ "$(git rev-parse HEAD)" = "$AUTOMATION_HEAD_SHA" ]
            is_version_pr=true
          fi
          if [ "$is_version_pr" = "true" ]; then
            expected="$RUNNER_TEMP/changeset-version-expected"
            git worktree add --detach "$expected" refs/remotes/origin/main
            trap 'git worktree remove --force "$expected"' EXIT

            (
              cd "$expected"
              bun "$GITHUB_WORKSPACE/node_modules/@changesets/cli/bin.js" version
              bun scripts/build-artifact-kernel-wasm-packages.ts --refresh-package-identities
              git add -A
              git diff --cached --check
            )

            expected_tree="$(git -C "$expected" write-tree)"
            actual_tree="$(git rev-parse 'HEAD^{tree}')"
            if [ "$actual_tree" != "$expected_tree" ]; then
              echo "::error::Version PR tree does not exactly reproduce 'changeset version' from origin/main"
              git -C "$expected" diff --cached --stat
              exit 1
            fi
            exit 0
          fi

          bunx changeset status --output "$plan"
          changeset_count="$(jq -er '.changesets | length' "$plan")"
          release_count="$(jq -er '.releases | length' "$plan")"
          if [ "$changeset_count" -gt 0 ] && [ "$release_count" -eq 0 ]; then
            echo "::error::pending changesets target only ignored/private packages and cannot produce a Version PR"
            exit 1
          fi

      - name: Profile impacted TypeScript 7 projects
        run: >-
          bun scripts/ci/profile-command.ts
          --name typecheck
          --output ci-profile/typecheck.json
          --timeout-seconds 600
          -- bun scripts/ci/run-typecheck-plan.ts
          --plan ${{ runner.temp }}/ci-impact-plan/impact-plan.json

      - name: Run exactly the explained source guards
        run: >-
          bun scripts/ci/profile-command.ts
          --name guards
          --output ci-profile/guards.json
          --timeout-seconds 900
          -- bun scripts/ci/run-guards-plan.ts
          --plan ${{ runner.temp }}/ci-impact-plan/impact-plan.json
          --exclude publish-closure

      - name: Impact, resource, and profiling contracts
        run: >-
          bun test
          scripts/ci/impact.test.ts
          scripts/ci/profile-command.test.ts
          scripts/ci/resource-budget.test.ts
          scripts/ci/summarize-profiles.test.ts

      - name: Upload source-contract resource profiles
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ci-profile-source-contracts
          path: |
            ci-profile/typecheck.json
            ci-profile/guards.json
          if-no-files-found: error
          retention-days: 14

  unit-shards:
    name: Unit tests (shard ${{ matrix.number }}/${{ matrix.total }})
    needs: [automation-admission, plan]
    if: ${{ always() && needs.plan.result == 'success' && github.event_name == 'pull_request' && needs.plan.outputs.unit_count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.unit_matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.automation_head_sha || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache Bun dependencies
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download exact impact plan
        uses: actions/download-artifact@v4
        with:
          name: ci-impact-plan

      - name: Unit test shard
        env:
          # The per-subject FORCE-RLS/OCC suite remains fail-closed on every shard.
          OPENGENI_REQUIRE_REAL_DB: "1"
        run: >-
          bun scripts/ci/profile-command.ts
          --name unit-${{ matrix.number }}
          --output ci-profile/unit-${{ matrix.number }}.json
          --timeout-seconds 1200
          -- bun scripts/ci/run-unit-shard.ts --plan impact-plan.json
          --shard ${{ matrix.index }} --shards ${{ matrix.total }}

      - name: Upload unit resource profile
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ci-profile-unit-${{ matrix.number }}
          path: ci-profile/unit-${{ matrix.number }}.json
          if-no-files-found: error
          retention-days: 14

  unit-safety:
    name: Unit tests (monolithic safety)
    needs: [automation-admission, plan]
    if: ${{ always() && needs.plan.result == 'success' && github.event_name != 'pull_request' && needs.plan.outputs.unit_count != '0' && (github.event_name != 'workflow_dispatch' || needs.automation-admission.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.automation_head_sha || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache Bun dependencies
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download exact impact plan
        uses: actions/download-artifact@v4
        with:
          name: ci-impact-plan

      - name: Test
        env:
          # Main pushes and trusted dispatches retain the complete monolithic safety net.
          OPENGENI_REQUIRE_REAL_DB: "1"
        run: >-
          bun scripts/ci/profile-command.ts
          --name unit-safety
          --output ci-profile/unit-safety.json
          --timeout-seconds 1800
          -- bun scripts/ci/run-unit-shard.ts --plan impact-plan.json
          --shard 0 --shards 1

      - name: Upload unit-safety resource profile
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ci-profile-unit-safety
          path: ci-profile/unit-safety.json
          if-no-files-found: error
          retention-days: 14

  integration-shards:
    name: Real-service shard ${{ matrix.number }}/${{ matrix.total }}
    needs: [automation-admission, plan]
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.integration_count != '0' && (github.event_name != 'workflow_dispatch' || needs.automation-admission.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.integration_matrix) }}
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.automation_head_sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download exact impact plan
        uses: actions/download-artifact@v4
        with:
          name: ci-impact-plan

      - name: Run real PostgreSQL, pgvector, Temporal, NATS, and object-storage tests
        run: >-
          bun scripts/ci/profile-command.ts
          --name integration-${{ matrix.number }}
          --output ci-profile/integration-${{ matrix.number }}.json
          --timeout-seconds 1800
          -- bun scripts/ci/run-test-shard.ts --plan impact-plan.json --tier integration
          --shard ${{ matrix.index }} --shards ${{ matrix.total }}
          --file-profile ci-profile/integration-${{ matrix.number }}-files.json

      - name: Upload integration resource profile
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ci-profile-integration-${{ matrix.number }}
          path: |
            ci-profile/integration-${{ matrix.number }}.json
            ci-profile/integration-${{ matrix.number }}-files.json
          if-no-files-found: error
          retention-days: 14

  test-suite:
    name: Real-service and recovery tests
    needs: [automation-admission, plan]
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.mode != 'docs' && (github.event_name != 'workflow_dispatch' || needs.automation-admission.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.automation_head_sha || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache Bun dependencies
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: React warning-free test gate
        run: bun run test:react:clean

      - name: Real workspace capture acceptance
        run: >-
          bun test --max-concurrency=1 --timeout 420000
          --test-name-pattern
          'captures a real turn-end multi-repository workspace through the public API'
          ./test/e2e/sandbox.e2e.ts

      # The escaped MCP timeout and stale-input-token regressions cross the
      # activity/DB/event boundary. Keep both explicit incident gates so a future
      # suite split cannot silently drop either the exactly-once/active-goal proof
      # or the real-Postgres shrink proof.
      - name: Recovery integration regressions
        run: |
          bun test --timeout 30000 \
            --test-name-pattern \
            'an MCP stream timeout after a successful tool output checkpoints once and recovers the same turn' \
            ./test/integration/worker-activity.integration.ts
          bun test --timeout 180000 \
            --test-name-pattern \
            'forced overflow compaction proves shrink against active history, not stale input tokens' \
            ./apps/worker/test/context-compaction-activity.test.ts

  browser-acceptance:
    name: Browser and visual acceptance (${{ matrix.lane }})
    needs: [automation-admission, plan]
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.mode != 'docs' && (github.event_name != 'workflow_dispatch' || needs.automation-admission.result == 'success') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lane: [interaction, knowledge, workbench]
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.automation_head_sha || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache Bun dependencies
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install pinned Playwright browser runtimes
        run: bun x playwright install --with-deps chromium firefox webkit

      - name: Editable artifact browser acceptance
        if: ${{ matrix.lane == 'workbench' }}
        run: |
          bun scripts/run-browser-e2e.ts \
            ./test/e2e/artifact-spreadsheet-canvas.browser.e2e.ts \
            ./test/e2e/artifact-spreadsheet-scroll.browser.e2e.ts \
            ./test/e2e/artifact-static-renderer.browser.e2e.ts

      - name: Install pinned artifact native toolchain
        if: ${{ matrix.lane == 'workbench' }}
        working-directory: packages/artifact-tool/kernel
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup show active-toolchain

      - name: Editable artifact full-stack browser acceptance
        if: ${{ matrix.lane == 'workbench' }}
        id: editable_artifact_browser
        env:
          OPENGENI_EDITABLE_ARTIFACT_EVIDENCE_DIR: /tmp/opengeni-editable-artifact-evidence
        run: bun scripts/run-browser-e2e.ts ./test/e2e/editable-artifacts.browser.e2e.ts

      - name: Codex quota Codex quota and entitlement browser acceptance
        if: ${{ matrix.lane == 'interaction' }}
        env:
          # Human-only redemption recovery and allocator independence require
          # the real FORCE-RLS/OCC/PostgreSQL boundary; no skipped green path.
          OPENGENI_REQUIRE_REAL_DB: "1"
          OPENGENI_CODEX_QUOTA_EVIDENCE_DIR: /tmp/codex-quota-evidence
        run: bun scripts/run-browser-e2e.ts ./test/e2e/codex-overview.e2e.ts

      - name: Queue surface browser acceptance
        if: ${{ matrix.lane == 'interaction' }}
        id: queue_surface_browser
        run: bun scripts/run-browser-e2e.ts ./test/e2e/queue-surface.browser.e2e.ts

      - name: Long user-message disclosure browser acceptance
        if: ${{ matrix.lane == 'interaction' }}
        run: bun scripts/run-browser-e2e.ts ./test/e2e/user-message-disclosure.browser.e2e.ts

      - name: Public realtime SDK demo browser acceptance
        if: ${{ matrix.lane == 'interaction' }}
        env:
          OPENGENI_REALTIME_DEMO_EVIDENCE_DIR: /tmp/opengeni-realtime-demo-evidence
        run: bun scripts/run-browser-e2e.ts ./test/e2e/realtime-demo.browser.e2e.ts

      - name: Session pin browser acceptance
        if: ${{ matrix.lane == 'knowledge' }}
        id: session_pin_browser
        env:
          # This browser gate must fail when its real PostgreSQL boundary is unavailable.
          OPENGENI_REQUIRE_REAL_DB: "1"
        run: bun test --max-concurrency=1 --timeout 180000 ./test/e2e/session-pins.browser.e2e.ts

      - name: Responsive knowledge surfaces browser acceptance
        if: ${{ matrix.lane == 'knowledge' }}
        env:
          # This gate traverses the public configured-principal API and must fail
          # rather than skip when its real PostgreSQL boundary is unavailable.
          OPENGENI_REQUIRE_REAL_DB: "1"
        run: bun test --max-concurrency=1 --timeout 300000 ./test/e2e/knowledge-surfaces.browser.e2e.ts

      - name: Workbench browser acceptance
        if: ${{ matrix.lane == 'workbench' }}
        id: workbench_browser
        run: bun test --max-concurrency=1 --timeout 180000 ./test/e2e/workbench.browser.e2e.ts

      - name: Upload session pin visual evidence
        # A preceding repository-wide gate may fail before the browser command
        # starts. In that case there are no screenshots to upload, and turning
        # that skipped command into a second artifact failure obscures the real
        # cause. Once the browser gate actually runs, preserve its visual
        # evidence on both green and red outcomes; a failure report is needed
        # to diagnose a browser regression just as much as a passing capture.
        # `if-no-files-found: error` remains mandatory in either case.
        if: >-
          ${{ always() &&
          matrix.lane == 'knowledge' &&
          (steps.session_pin_browser.outcome == 'success' ||
          steps.session_pin_browser.outcome == 'failure') }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: sessionpin-session-pin-visual-evidence
          if-no-files-found: error
          retention-days: 14
          path: |
            /tmp/sessionpin-session-pin-desktop-light.png
            /tmp/sessionpin-session-pin-desktop-dark.png
            /tmp/sessionpin-session-pin-mobile-light.png
            /tmp/sessionpin-session-pin-mobile-dark.png
            /tmp/sessionpin-session-pin-mobile-375-light.png
            /tmp/sessionpin-session-pin-mobile-375-dark.png

      - name: Upload Codex quota visual evidence
        if: ${{ always() && matrix.lane == 'interaction' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: codex-quota-codex-quota-entitlement-visual-evidence
          if-no-files-found: error
          retention-days: 14
          path: |
            /tmp/codex-quota-evidence/codex-quota-desktop-light.png
            /tmp/codex-quota-evidence/codex-quota-desktop-dark.png
            /tmp/codex-quota-evidence/codex-quota-mobile-light.png
            /tmp/codex-quota-evidence/codex-quota-mobile-dark.png

      - name: Upload responsive knowledge-surface evidence
        if: ${{ always() && matrix.lane == 'knowledge' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: responsive-knowledge-surface-evidence
          if-no-files-found: error
          retention-days: 14
          path: |
            /tmp/knowledge-surfaces-320-light-memory.png
            /tmp/knowledge-surfaces-320-dark-memory.png
            /tmp/knowledge-surfaces-375-light-variable-sets.png
            /tmp/knowledge-surfaces-375-dark-variable-sets.png
            /tmp/knowledge-surfaces-768-light-documents.png
            /tmp/knowledge-surfaces-768-dark-documents.png
            /tmp/knowledge-surfaces-desktop-light-memory.png
            /tmp/knowledge-surfaces-desktop-dark-memory.png

      - name: Upload workbench visual evidence
        if: >-
          ${{ always() &&
          matrix.lane == 'workbench' &&
          (steps.workbench_browser.outcome == 'success' ||
          steps.workbench_browser.outcome == 'failure') }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: workbench-visual-evidence
          if-no-files-found: error
          retention-days: 14
          path: |
            /tmp/workbench-mobile-dark-dense.png
            /tmp/workbench-tablet-light-offline.png
            /tmp/workbench-desktop-dark-changes.png
            /tmp/workbench-desktop-light-files.png

      - name: Upload editable artifact visual evidence
        if: >-
          ${{ always() &&
          matrix.lane == 'workbench' &&
          (steps.editable_artifact_browser.outcome == 'success' ||
          steps.editable_artifact_browser.outcome == 'failure') }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: editable-artifact-visual-evidence
          if-no-files-found: error
          retention-days: 14
          path: |
            /tmp/opengeni-editable-artifact-evidence/editable-artifact-document-dark.png
            /tmp/opengeni-editable-artifact-evidence/editable-artifact-spreadsheet-dark.png
            /tmp/opengeni-editable-artifact-evidence/editable-artifact-presentation-dark.png

  package-contracts:
    name: Package and bundle contracts
    needs: [automation-admission, plan]
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.build_count != '0' && (github.event_name != 'workflow_dispatch' || needs.automation-admission.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.automation_head_sha || github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache Bun dependencies
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download exact impact plan
        uses: actions/download-artifact@v4
        with:
          name: ci-impact-plan

      - name: Install pinned artifact-kernel build toolchain
        working-directory: packages/artifact-tool/kernel
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup show active-toolchain

      - name: Production native artifact contracts
        env:
          ARTIFACT_NATIVE_TEST_ROOT: ${{ runner.temp }}/artifact-native-test
        run: |
          set -euo pipefail
          bun scripts/build-artifact-runtime-target.ts \
            --target linux-x64-gnu \
            --output "$ARTIFACT_NATIVE_TEST_ROOT"
          OPENGENI_ARTIFACT_KERNEL_NATIVE_PATH="$ARTIFACT_NATIVE_TEST_ROOT/native/linux-x64-gnu/opengeni_artifact_kernel.node" \
            bun run --cwd packages/artifact-tool test:production-native

      - name: Build client packages (contracts + SDK + React)
        env:
          OPENGENI_BUILD_CACHE_REPORT: ci-profile/package-cache.json
        run: >-
          bun scripts/ci/profile-command.ts
          --name packages
          --output ci-profile/packages.json
          --timeout-seconds 1200
          -- bun scripts/ci/run-build-plan.ts --plan impact-plan.json

      - name: React Native Metro to Hermes session bundle
        run: bun run test:react-native-hermes-bundle

      - name: Reproduce committed modality WASM packages from clean Rust sources
        run: bun scripts/rebuild-artifact-kernel-wasm-packages.ts --check

      - name: Install Chromium for packed WASM package proof
        run: bun x playwright install --with-deps --only-shell chromium

      - name: Packed SDK Worker and modality WASM packages
        run: bun run test:artifact-kernel-wasm-consumer

      - name: Publish closure guard
        run: bun scripts/publish-closure-guard.ts

      - name: Clean published consumer
        run: bun run test:publish-consumer

      - name: Runtime embedding consumer
        run: bun run test:runtime-embedding-consumer

      - name: Portable ogtool package
        run: bun run test:ogtool-package

      - name: Build React demo harness
        run: cd packages/react && bun run demo:build

      - name: Web bundle budget
        run: bun run --cwd apps/web build

      - name: Upload package-build resource profile
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ci-profile-packages
          path: |
            ci-profile/packages.json
            ci-profile/package-cache.json
          if-no-files-found: error
          retention-days: 14

  test:
    name: Typecheck and unit tests
    needs: [plan, source-contracts, unit-shards, unit-safety, integration-shards, test-suite, browser-acceptance, package-contracts, deployment, images]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require successful impact planning before candidate execution
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
        run: test "$PLAN_RESULT" = "success"

      - name: Check out exact aggregate source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.automation_head_sha || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Require every split CI lane
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          MODE: ${{ needs.plan.outputs.mode }}
          UNIT_COUNT: ${{ needs.plan.outputs.unit_count }}
          INTEGRATION_COUNT: ${{ needs.plan.outputs.integration_count }}
          BUILD_COUNT: ${{ needs.plan.outputs.build_count }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request|push|workflow_dispatch|schedule) ;;
            *) echo "::error::unsupported CI event $EVENT_NAME"; exit 1 ;;
          esac
          jq . <<<"$RESULTS"
          jq -e \
            --arg event "$EVENT_NAME" \
            --arg mode "$MODE" \
            --argjson unit "$UNIT_COUNT" \
            --argjson integration "$INTEGRATION_COUNT" \
            --argjson build "$BUILD_COUNT" \
            -f scripts/ci/required-results.jq \
            <<<"$RESULTS"

  deployment:
    name: Deployment artifacts
    needs: [automation-admission, plan]
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.mode != 'docs' && (github.event_name != 'workflow_dispatch' || needs.automation-admission.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.automation_head_sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Cache Bun dependencies
        uses: actions/cache@v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set up Helm
        uses: azure/setup-helm@v5

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Validate deployment profiles
        run: |
          bun run deployment:profiles
          bun run deployment:preflight -- --profile azure-existing-services --json
          bun run deployment:preflight -- --profile azure-managed --json
          bun run deployment:preflight -- --profile aws-existing-services --json
          bun run deployment:preflight -- --profile aws-managed --json
          bun run deployment:preflight -- --profile gcp-existing-services --json
          bun run deployment:preflight -- --profile gcp-managed --json
          bun run deployment:preflight -- --profile single-node-kubernetes --json
          bun run deployment:preflight -- --profile preview-pr --json
          bun run deployment:preflight -- --profile preview-branch --json

      - name: Validate Helm chart
        run: |
          if grep -R -nE '(:|tag:[[:space:]]*"?)latest($|")' docker-compose.yml deploy/helm/opengeni deploy/observability; then
            echo "floating latest tag found in deployment manifests" >&2
            exit 1
          fi
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm dependency build deploy/observability
          helm lint deploy/observability
          helm template opengeni-observability deploy/observability \
            --namespace observability \
            --set-string opengeni.sourceRevision=ci \
            --set-string 'kube-prometheus-stack.grafana.podAnnotations.opengeni\.ai/source-revision=ci' \
            >/tmp/opengeni-observability-rendered.yaml
          bun run check:observability-render -- \
            --manifest /tmp/opengeni-observability-rendered.yaml \
            --source-revision ci
          helm template opengeni-observability-production deploy/observability \
            --namespace observability \
            --values deploy/observability/values.production.example.yaml \
            --set-string opengeni.sourceRevision=ci \
            --set-string 'kube-prometheus-stack.grafana.podAnnotations.opengeni\.ai/source-revision=ci' \
            >/tmp/opengeni-observability-production-rendered.yaml
          bun run check:observability-render -- \
            --manifest /tmp/opengeni-observability-production-rendered.yaml \
            --source-revision ci
          helm lint deploy/helm/opengeni
          helm template opengeni deploy/helm/opengeni \
            --namespace opengeni \
            --set nats.enabled=true \
            --set secret.create=true \
            --set secret.stringData.OPENGENI_DATABASE_URL=postgres://placeholder \
            --set secret.stringData.OPENGENI_TEMPORAL_HOST=temporal:7233 \
            --set secret.stringData.OPENGENI_OPENAI_API_KEY=placeholder \
            --set secret.stringData.OPENGENI_OBJECT_STORAGE_ENDPOINT=http://minio:9000 \
            >/tmp/opengeni-rendered.yaml
          helm template opengeni-digest deploy/helm/opengeni \
            --namespace opengeni \
            --set global.imageRegistry=registry.example.com \
            --set api.image.tag=ci \
            --set api.image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --set worker.image.tag=ci \
            --set worker.image.digest=sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb \
            --set web.image.tag=ci \
            --set web.image.digest=sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc \
            --set migrations.image.tag=ci \
            --set migrations.image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            >/tmp/opengeni-digest-rendered.yaml
          helm template opengeni-azure deploy/helm/opengeni \
            --namespace opengeni \
            -f deploy/helm/opengeni/values.azure-managed.example.yaml \
            >/tmp/opengeni-azure-rendered.yaml
          helm template opengeni-azure-existing deploy/helm/opengeni \
            --namespace opengeni \
            -f deploy/helm/opengeni/values.azure-existing-services.example.yaml \
            >/tmp/opengeni-azure-existing-rendered.yaml
          helm template opengeni-aws deploy/helm/opengeni \
            --namespace opengeni \
            -f deploy/helm/opengeni/values.aws-managed.example.yaml \
            >/tmp/opengeni-aws-rendered.yaml
          helm template opengeni-gcp deploy/helm/opengeni \
            --namespace opengeni \
            -f deploy/helm/opengeni/values.gcp-managed.example.yaml \
            >/tmp/opengeni-gcp-rendered.yaml
          helm template opengeni-preview deploy/helm/opengeni \
            --namespace opengeni-preview \
            -f deploy/helm/opengeni/values.preview-managed.example.yaml \
            >/tmp/opengeni-preview-rendered.yaml
          helm template opengeni-single deploy/helm/opengeni \
            --namespace opengeni \
            -f deploy/helm/opengeni/values.single-node.example.yaml \
            >/tmp/opengeni-single-rendered.yaml
          helm template opengeni-observed deploy/helm/opengeni \
            --namespace opengeni \
            --api-versions monitoring.coreos.com/v1 \
            -f deploy/observability/opengeni.values.example.yaml \
            >/tmp/opengeni-observed-rendered.yaml
          if grep -qE '^kind: (HorizontalPodAutoscaler|PodDisruptionBudget)$' /tmp/opengeni-single-rendered.yaml; then
            echo "single-node profile rendered an autoscaler or disruption budget" >&2
            exit 1
          fi
          if grep -q '^          resources:' /tmp/opengeni-single-rendered.yaml; then
            echo "single-node profile rendered container resource partitions" >&2
            exit 1
          fi
          if grep -q 'OPENGENI_POSTGRES_PASSWORD' /tmp/opengeni-single-rendered.yaml; then
            echo "single-node workloads received the Postgres owner password" >&2
            exit 1
          fi
          test "$(grep -c '^kind: PriorityClass$' /tmp/opengeni-single-rendered.yaml)" -eq 4
          test "$(grep -c '^      priorityClassName: \"opengeni-single-presentation\"$' /tmp/opengeni-single-rendered.yaml)" -eq 2
          test "$(grep -c '^      priorityClassName: \"opengeni-single-execution\"$' /tmp/opengeni-single-rendered.yaml)" -eq 1
          test "$(grep -c '^      priorityClassName: \"opengeni-single-control\"$' /tmp/opengeni-single-rendered.yaml)" -eq 3
          test "$(grep -c '^      priorityClassName: \"opengeni-single-durable\"$' /tmp/opengeni-single-rendered.yaml)" -eq 5
          test "$(grep -c '^  replicas: 1$' /tmp/opengeni-single-rendered.yaml)" -eq 9
          test "$(grep -c '^      nodePort:' /tmp/opengeni-single-rendered.yaml)" -eq 5
          for node_port in 30080 30081 30222 30443 30900; do
            grep -q "^      nodePort: $node_port$" /tmp/opengeni-single-rendered.yaml
          done
          for component in api worker-control worker-turns web; do
            if awk -v name="opengeni-preview-$component" '
              $1 == "kind:" && $2 == "PodDisruptionBudget" { pdb = 1; next }
              pdb && $1 == "name:" && $2 == name { found = 1 }
              /^---$/ { pdb = 0 }
              END { exit(found ? 0 : 1) }
            ' /tmp/opengeni-preview-rendered.yaml; then
              echo "single-replica preview component unexpectedly rendered a blocking PDB: $component" >&2
              exit 1
            fi
          done

      - name: Validate Terraform
        run: |
          terraform -chdir=deploy/terraform/azure fmt -check
          terraform -chdir=deploy/terraform/azure init -backend=false
          terraform -chdir=deploy/terraform/azure validate
          terraform -chdir=deploy/terraform/azure test
          terraform -chdir=deploy/terraform/aws fmt -check
          terraform -chdir=deploy/terraform/aws init -backend=false
          terraform -chdir=deploy/terraform/aws validate
          terraform -chdir=deploy/terraform/gcp fmt -check
          terraform -chdir=deploy/terraform/gcp init -backend=false
          terraform -chdir=deploy/terraform/gcp validate

  artifact-runtime:
    name: Build exact artifact runtime inputs
    needs: [automation-admission, plan]
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.mode != 'docs' && (github.event_name != 'workflow_dispatch' || needs.automation-admission.result == 'success') }}
    uses: ./.github/workflows/artifact-runtime.yml
    with:
      source_sha: ${{ github.event_name == 'workflow_dispatch' && inputs.automation_head_sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

  api-image:
    name: Build API workload image
    needs: [automation-admission, plan, artifact-runtime]
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.mode != 'docs' && needs.artifact-runtime.result == 'success' && (github.event_name != 'workflow_dispatch' || needs.automation-admission.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the immutable exact-main-SHA dogfood image; PR and automation runs remain build-only
    outputs:
      api_digest: ${{ steps.api_image.outputs.digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.automation_head_sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Download exact artifact runtime inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.artifact-runtime.outputs.artifact_name }}
          path: .release/artifact-runtime

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build API image
        id: api_image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: docker/opengeni.Dockerfile
          target: api
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ github.event_name == 'push' && format('ghcr.io/cloudgeni-ai/opengeni-api:dogfood-sha-{0}', github.sha) || 'opengeni-api:ci' }}
          cache-from: type=gha,scope=opengeni-ci-api
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=min,scope=opengeni-ci-api,ignore-error=true' || '' }}
          build-args: |
            OPENGENI_SERVER_VERSION=sha-${{ github.event_name == 'workflow_dispatch' && inputs.automation_head_sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

  worker-web-images:
    name: Build worker and web workload images
    needs: [automation-admission, plan]
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.mode != 'docs' && (github.event_name != 'workflow_dispatch' || needs.automation-admission.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the immutable exact-main-SHA dogfood image; PR and automation runs remain build-only
    outputs:
      worker_digest: ${{ steps.worker_image.outputs.digest }}
      web_digest: ${{ steps.web_image.outputs.digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.automation_head_sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build worker image
        id: worker_image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: docker/opengeni.Dockerfile
          target: worker
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ github.event_name == 'push' && format('ghcr.io/cloudgeni-ai/opengeni-worker:dogfood-sha-{0}', github.sha) || 'opengeni-worker:ci' }}
          cache-from: type=gha,scope=opengeni-ci-worker
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=min,scope=opengeni-ci-worker,ignore-error=true' || '' }}
          build-args: |
            OPENGENI_SERVER_VERSION=sha-${{ github.event_name == 'workflow_dispatch' && inputs.automation_head_sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Build web image
        id: web_image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: docker/opengeni.Dockerfile
          target: web
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ github.event_name == 'push' && format('ghcr.io/cloudgeni-ai/opengeni-web:dogfood-sha-{0}', github.sha) || 'opengeni-web:ci' }}
          cache-from: type=gha,scope=opengeni-ci-web
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=min,scope=opengeni-ci-web,ignore-error=true' || '' }}
          build-args: |
            OPENGENI_SERVER_VERSION=sha-${{ github.event_name == 'workflow_dispatch' && inputs.automation_head_sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
            OPENGENI_DEPLOYMENT_REVISION=${{ github.event_name == 'workflow_dispatch' && inputs.automation_head_sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

  artifact-materializer-image:
    name: Build artifact materializer workload image
    needs: [automation-admission, plan, artifact-runtime]
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.mode != 'docs' && needs.artifact-runtime.result == 'success' && (github.event_name != 'workflow_dispatch' || needs.automation-admission.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the immutable exact-main-SHA dogfood image; PR and automation runs remain build-only
    outputs:
      artifact_materializer_digest: ${{ steps.artifact_materializer_image.outputs.digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.automation_head_sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Download exact artifact runtime inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.artifact-runtime.outputs.artifact_name }}
          path: .release/artifact-runtime

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build artifact materializer image
        id: artifact_materializer_image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: docker/opengeni.Dockerfile
          target: artifact-materializer
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ github.event_name == 'push' && format('ghcr.io/cloudgeni-ai/opengeni-artifact-materializer:dogfood-sha-{0}', github.sha) || 'opengeni-artifact-materializer:ci' }}
          cache-from: type=gha,scope=opengeni-ci-artifact-materializer
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=min,scope=opengeni-ci-artifact-materializer,ignore-error=true' || '' }}
          build-args: |
            OPENGENI_SERVER_VERSION=sha-${{ github.event_name == 'workflow_dispatch' && inputs.automation_head_sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

  artifact-outbox-dispatcher-image:
    name: Build artifact outbox dispatcher workload image
    needs: [automation-admission, plan]
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.mode != 'docs' && (github.event_name != 'workflow_dispatch' || needs.automation-admission.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the immutable exact-main-SHA dogfood image; PR and automation runs remain build-only
    outputs:
      artifact_outbox_dispatcher_digest: ${{ steps.artifact_outbox_dispatcher_image.outputs.digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.automation_head_sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build artifact outbox dispatcher image
        id: artifact_outbox_dispatcher_image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: docker/opengeni.Dockerfile
          target: artifact-outbox-dispatcher
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ github.event_name == 'push' && format('ghcr.io/cloudgeni-ai/opengeni-artifact-outbox-dispatcher:dogfood-sha-{0}', github.sha) || 'opengeni-artifact-outbox-dispatcher:ci' }}
          cache-from: type=gha,scope=opengeni-ci-artifact-outbox-dispatcher
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=min,scope=opengeni-ci-artifact-outbox-dispatcher,ignore-error=true' || '' }}
          build-args: |
            OPENGENI_SERVER_VERSION=sha-${{ github.event_name == 'workflow_dispatch' && inputs.automation_head_sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

  relay-image:
    name: Build relay workload image
    needs: [automation-admission, plan]
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.mode != 'docs' && (github.event_name != 'workflow_dispatch' || needs.automation-admission.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the immutable exact-main-SHA dogfood image; PR and automation runs remain build-only
    outputs:
      relay_digest: ${{ steps.relay_image.outputs.digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.automation_head_sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build relay image
        id: relay_image
        uses: docker/build-push-action@v7.3.0
        with:
          context: agent
          file: agent/crates/opengeni-relay/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ github.event_name == 'push' && format('ghcr.io/cloudgeni-ai/opengeni-relay:dogfood-sha-{0}', github.sha) || 'opengeni-relay:ci' }}
          cache-from: type=gha,scope=opengeni-ci-relay
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=min,scope=opengeni-ci-relay,ignore-error=true' || '' }}
  sandbox-image:
    name: Build headless sandbox workload image
    needs: [automation-admission, plan, artifact-runtime]
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.mode != 'docs' && needs.artifact-runtime.result == 'success' && (github.event_name != 'workflow_dispatch' || needs.automation-admission.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the immutable exact-main-SHA dogfood image; PR and automation runs remain build-only
    outputs:
      sandbox_digest: ${{ steps.sandbox_image.outputs.digest }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.automation_head_sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Download exact artifact runtime inputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.artifact-runtime.outputs.artifact_name }}
          path: .release/artifact-runtime
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build headless sandbox image
        id: sandbox_image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: docker/sandbox.Dockerfile
          platforms: linux/amd64,linux/arm64
          build-args: OPENGENI_SOURCE_SHA=${{ github.event_name == 'workflow_dispatch' && inputs.automation_head_sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ github.event_name == 'push' && format('ghcr.io/cloudgeni-ai/opengeni-sandbox:dogfood-sha-{0}', github.sha) || 'opengeni-sandbox:ci' }}
          cache-from: type=gha,scope=opengeni-ci-sandbox
          cache-to: ${{ github.event_name == 'push' && 'type=gha,mode=min,scope=opengeni-ci-sandbox,ignore-error=true' || '' }}

  images:
    name: Workload image builds
    needs:
      - automation-admission
      - plan
      - api-image
      - worker-web-images
      - artifact-materializer-image
      - artifact-outbox-dispatcher-image
      - relay-image
      - sandbox-image
    if: ${{ always() && needs.plan.result == 'success' && needs.plan.outputs.mode != 'docs' && (github.event_name != 'workflow_dispatch' || needs.automation-admission.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require every workload image build
        env:
          API_IMAGE_RESULT: ${{ needs.api-image.result }}
          WORKER_WEB_IMAGES_RESULT: ${{ needs.worker-web-images.result }}
          ARTIFACT_MATERIALIZER_IMAGE_RESULT: ${{ needs.artifact-materializer-image.result }}
          ARTIFACT_OUTBOX_DISPATCHER_IMAGE_RESULT: ${{ needs.artifact-outbox-dispatcher-image.result }}
          RELAY_IMAGE_RESULT: ${{ needs.relay-image.result }}
          SANDBOX_IMAGE_RESULT: ${{ needs.sandbox-image.result }}
        run: |
          set -euo pipefail
          test "$API_IMAGE_RESULT" = "success"
          test "$WORKER_WEB_IMAGES_RESULT" = "success"
          test "$ARTIFACT_MATERIALIZER_IMAGE_RESULT" = "success"
          test "$ARTIFACT_OUTBOX_DISPATCHER_IMAGE_RESULT" = "success"
          test "$RELAY_IMAGE_RESULT" = "success"
          test "$SANDBOX_IMAGE_RESULT" = "success"

      - name: Check out exact aggregate source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.automation_head_sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Write exact-main-SHA dogfood receipt
        if: ${{ github.event_name == 'push' }}
        env:
          API_DIGEST: ${{ needs.api-image.outputs.api_digest }}
          WORKER_DIGEST: ${{ needs.worker-web-images.outputs.worker_digest }}
          WEB_DIGEST: ${{ needs.worker-web-images.outputs.web_digest }}
          SANDBOX_DIGEST: ${{ needs.sandbox-image.outputs.sandbox_digest }}
          RELAY_DIGEST: ${{ needs.relay-image.outputs.relay_digest }}
          ARTIFACT_MATERIALIZER_DIGEST: ${{ needs.artifact-materializer-image.outputs.artifact_materializer_digest }}
          ARTIFACT_OUTBOX_DISPATCHER_DIGEST: ${{ needs.artifact-outbox-dispatcher-image.outputs.artifact_outbox_dispatcher_digest }}
        run: |
          set -euo pipefail
          for digest in \
            "$API_DIGEST" \
            "$WORKER_DIGEST" \
            "$WEB_DIGEST" \
            "$SANDBOX_DIGEST" \
            "$RELAY_DIGEST" \
            "$ARTIFACT_MATERIALIZER_DIGEST" \
            "$ARTIFACT_OUTBOX_DISPATCHER_DIGEST"; do
            printf '%s\n' "$digest" \
              | grep -Eq '^sha256:[0-9a-f]{64}$'
          done

          chart_version="$(awk '$1 == "version:" { print $2 }' deploy/helm/opengeni/Chart.yaml)"
          test -n "$chart_version"
          jq -n \
            --arg sourceSha "${GITHUB_SHA}" \
            --arg sourceRef "${GITHUB_REF}" \
            --arg sourceRepository "${GITHUB_REPOSITORY}" \
            --arg runId "${GITHUB_RUN_ID}" \
            --arg runAttempt "${GITHUB_RUN_ATTEMPT}" \
            --arg chartVersion "$chart_version" \
            --arg tag "dogfood-sha-${GITHUB_SHA}" \
            --arg apiDigest "$API_DIGEST" \
            --arg workerDigest "$WORKER_DIGEST" \
            --arg webDigest "$WEB_DIGEST" \
            --arg sandboxDigest "$SANDBOX_DIGEST" \
            --arg relayDigest "$RELAY_DIGEST" \
            --arg artifactMaterializerDigest "$ARTIFACT_MATERIALIZER_DIGEST" \
            --arg artifactOutboxDispatcherDigest "$ARTIFACT_OUTBOX_DISPATCHER_DIGEST" \
            '{
              schemaVersion: 1,
              source: {
                repository: $sourceRepository,
                ref: $sourceRef,
                sha: $sourceSha
              },
              producer: {
                workflow: ".github/workflows/ci.yml",
                runId: $runId,
                runAttempt: $runAttempt
              },
              chartVersion: $chartVersion,
              imageTag: $tag,
              images: {
                api: { repository: "ghcr.io/cloudgeni-ai/opengeni-api", digest: $apiDigest },
                worker: { repository: "ghcr.io/cloudgeni-ai/opengeni-worker", digest: $workerDigest },
                web: { repository: "ghcr.io/cloudgeni-ai/opengeni-web", digest: $webDigest },
                sandbox: { repository: "ghcr.io/cloudgeni-ai/opengeni-sandbox", digest: $sandboxDigest },
                relay: { repository: "ghcr.io/cloudgeni-ai/opengeni-relay", digest: $relayDigest },
                "artifact-materializer": { repository: "ghcr.io/cloudgeni-ai/opengeni-artifact-materializer", digest: $artifactMaterializerDigest },
                "artifact-outbox-dispatcher": { repository: "ghcr.io/cloudgeni-ai/opengeni-artifact-outbox-dispatcher", digest: $artifactOutboxDispatcherDigest }
              }
            }' > dogfood-images.json
          sha256sum dogfood-images.json > dogfood-images.sha256

      - name: Upload exact-main-SHA dogfood receipt
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dogfood-images-${{ github.sha }}
          path: |
            dogfood-images.json
            dogfood-images.sha256
          if-no-files-found: error
          retention-days: 30

  automation-report:
    name: Report exact-head automation CI
    needs: [automation-admission, test, deployment, images]
    if: ${{ always() && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      pull-requests: read
    env:
      AUTOMATION_PR_NUMBER: ${{ inputs.automation_pr_number }}
      AUTOMATION_HEAD_SHA: ${{ inputs.automation_head_sha }}
      AUTOMATION_BASE_SHA: ${{ inputs.automation_base_sha }}
      AUTOMATION_SOURCE_RUN_ID: ${{ inputs.source_release_run_id }}
      AUTOMATION_SOURCE_RUN_ATTEMPT: ${{ inputs.source_release_run_attempt }}
    steps:
      - name: Check out trusted workflow source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Complete exact-head automation CI check
        env:
          AUTOMATION_CHECK_KIND: automation-ci
          AUTOMATION_CHECK_CONCLUSION: ${{ needs.automation-admission.result == 'success' && needs.test.result == 'success' && needs.deployment.result == 'success' && needs.images.result == 'success' && 'success' || 'failure' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-release-pr-automation.mjs complete-version-check
