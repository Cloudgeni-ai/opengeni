name: Local startup

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/local-startup.yml"
      - ".bun-version"
      - ".dockerignore"
      - ".env.example"
      - "bun.lock"
      - "package.json"
      - "docker-compose.yml"
      - "docker/**"
      - "scripts/*development*"
      - "scripts/dev-*"
      - "scripts/run-development-relay.sh"
      - "scripts/bun-version.ts"
      - "scripts/ci/local-startup*"
      - ".github/actions/playwright-browsers/**"
      - "packages/db/**"
      - "packages/config/**"
      - "apps/browser-extension/**"
      - "docs-site/run-locally.mdx"
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

concurrency:
  group: local-startup-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: Fresh Docker startup and restart
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OPENGENI_DEV_BACKEND: docker
      OPENGENI_COMPOSE_PROJECT: opengeni-startup-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Check startup ownership and prerequisite regressions
        timeout-minutes: 2
        run: bun test scripts/check-development-prerequisites.test.ts scripts/dev-stack-lock.test.ts scripts/run-development-stack.test.ts
      - name: Start the documented stack from a clean checkout
        timeout-minutes: 50
        run: bash scripts/ci/local-startup.sh first
      - name: Install startup browser runtime
        uses: ./.github/actions/playwright-browsers
        timeout-minutes: 17
        with:
          browsers: chromium
      - name: Verify rendered startup and restart
        timeout-minutes: 15
        run: |
          bash scripts/ci/local-startup.sh verify
          bash scripts/ci/local-startup.sh restart
          bash scripts/ci/local-startup.sh verify
      - name: Clean only the acceptance project
        if: always()
        timeout-minutes: 3
        run: bash scripts/ci/local-startup.sh clean
      - name: Retain startup logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: local-startup-logs
          path: ${{ runner.temp }}/opengeni-startup-*.log
          retention-days: 7
