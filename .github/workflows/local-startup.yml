name: Local startup

on:
  workflow_dispatch:
  # Pull-request checks are disabled; retained triggers run below.
  schedule:
    - cron: "0 5 * * 1"

permissions:
  contents: read

concurrency:
  group: local-startup-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  platform-preflight:
    # Skip the main -> production promotion PR: its head already ran as a main push.
    if: ${{ !(github.event_name == 'pull_request' && github.head_ref == 'main' && github.base_ref == 'production') }}
    name: Setup prerequisites (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Verify host prerequisite contracts
        timeout-minutes: 2
        run: bun test scripts/check-development-prerequisites.test.ts

  docker:
    # Skip the main -> production promotion PR: its head already ran as a main push.
    if: ${{ !(github.event_name == 'pull_request' && github.head_ref == 'main' && github.base_ref == 'production') }}
    name: Fresh Docker startup and restart
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OPENGENI_DEV_BACKEND: docker
      OPENGENI_COMPOSE_PROJECT: opengeni-startup-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Check startup ownership and prerequisite regressions
        timeout-minutes: 2
        run: bun test scripts/check-development-prerequisites.test.ts scripts/dev-stack-lock.test.ts scripts/run-development-stack.test.ts scripts/dev-stack-backend.test.ts
      - name: Verify the runner Docker dependency
        timeout-minutes: 1
        run: timeout 30s docker info
      - name: Start the documented stack from a clean checkout
        timeout-minutes: 50
        run: bash scripts/ci/local-startup.sh first
      - name: Install startup browser runtime
        uses: ./.github/actions/playwright-browsers
        timeout-minutes: 17
        with:
          browsers: chromium
      - name: Verify rendered startup and restart
        timeout-minutes: 15
        run: |
          bash scripts/ci/local-startup.sh verify
          bash scripts/ci/local-startup.sh restart
          bash scripts/ci/local-startup.sh verify
      - name: Clean only the acceptance project
        if: always()
        timeout-minutes: 3
        run: bash scripts/ci/local-startup.sh clean
      - name: Retain startup logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: local-startup-logs
          path: ${{ runner.temp }}/opengeni-startup-*.log
          retention-days: 7
