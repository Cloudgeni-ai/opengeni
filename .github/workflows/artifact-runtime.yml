name: Artifact runtime inputs

on:
  workflow_call:
    inputs:
      source_sha:
        description: Exact source SHA whose native runtime is being assembled.
        required: true
        type: string
    outputs:
      artifact_name:
        description: Run-local artifact containing verified amd64/arm64 Docker inputs.
        value: ${{ jobs.aggregate.outputs.artifact_name }}

permissions:
  contents: read

jobs:
  native:
    name: Native smoke receipt (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-x64
            runner: macos-26-intel
          - target: darwin-arm64
            runner: macos-26
          - target: linux-x64-gnu
            runner: ubuntu-24.04
          - target: linux-arm64-gnu
            runner: ubuntu-24.04-arm
          - target: win32-x64-msvc
            runner: windows-latest
    steps:
      - name: Check out exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Verify exact source
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [ "$(git rev-parse HEAD)" = "$SOURCE_SHA" ]

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.0 --profile minimal --no-self-update
          rustup default 1.97.0

      - name: Build and smoke exact target
        shell: bash
        env:
          OUTPUT_ROOT: ${{ runner.temp }}/artifact-runtime-assets
          TARGET: ${{ matrix.target }}
        run: bun scripts/build-artifact-runtime-target.ts --target "$TARGET" --output "$OUTPUT_ROOT"

      - name: Upload exact target receipt and asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: artifact-runtime-target-${{ inputs.source_sha }}-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 3
          path: ${{ runner.temp }}/artifact-runtime-assets

  musl:
    name: Native smoke receipt (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64-musl
            runner: ubuntu-24.04
            platform: linux/amd64
            bun_archive: bun-linux-x64-musl.zip
            bun_sha256: 14bd9aedeebf1dba67e8def9531c89bc989ecfdf1de42e5bfcaf1b8cd9294719
          - target: linux-arm64-musl
            runner: ubuntu-24.04-arm
            platform: linux/arm64
            bun_archive: bun-linux-aarch64-musl.zip
            bun_sha256: b98e0ad3625c5c00d1d5b5ff55605c7adddbfae151861e68ade57b2d3b8703bb
    steps:
      - name: Check out exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Verify exact source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [ "$(git rev-parse HEAD)" = "$SOURCE_SHA" ]

      - name: Build and smoke in exact musl userspace
        env:
          OUTPUT_ROOT: ${{ runner.temp }}/artifact-runtime-assets
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
          BUN_ARCHIVE: ${{ matrix.bun_archive }}
          BUN_SHA256: ${{ matrix.bun_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_ROOT"
          docker run --rm --platform "$PLATFORM" \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -v "$OUTPUT_ROOT:/output" \
            -w /workspace \
            -e TARGET \
            -e BUN_ARCHIVE \
            -e BUN_SHA256 \
            rust:1.97.0-alpine3.23@sha256:ca0daf101eef0c8cd1e49dfc137154a220efb8c458c85a3eacacc7dfd5d9e04c \
            sh -euc '
              apk add --no-cache bash build-base curl libstdc++ unzip
              curl --proto "=https" --tlsv1.2 -fL \
                "https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/$BUN_ARCHIVE" \
                -o /tmp/bun.zip
              printf "%s  %s\n" "$BUN_SHA256" /tmp/bun.zip | sha256sum -c -
              unzip -q /tmp/bun.zip -d /tmp/bun
              install -m 0755 "/tmp/bun/${BUN_ARCHIVE%.zip}/bun" /usr/local/bin/bun
              test "$(bun --version)" = 1.3.14
              test "$(rustc --version | cut -d" " -f2)" = 1.97.0
              bun install --frozen-lockfile
              bun scripts/build-artifact-runtime-target.ts --target "$TARGET" --output /output/runtime
              chmod -R a+rX /output/runtime
            '

      - name: Upload exact target receipt and asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: artifact-runtime-target-${{ inputs.source_sha }}-${{ matrix.target }}
          if-no-files-found: error
          retention-days: 3
          path: ${{ runner.temp }}/artifact-runtime-assets/runtime

  wasm:
    name: WASM smoke receipt
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Verify exact source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [ "$(git rev-parse HEAD)" = "$SOURCE_SHA" ]

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install pinned WASM toolchain
        run: |
          set -euo pipefail
          rustup toolchain install 1.97.0 --profile minimal --no-self-update
          rustup default 1.97.0
          rustup target add wasm32-unknown-unknown
          cargo install --locked wasm-bindgen-cli --version 0.2.127

      - name: Build and smoke exact target
        env:
          OUTPUT_ROOT: ${{ runner.temp }}/artifact-runtime-assets
        run: bun scripts/build-artifact-runtime-target.ts --target wasm-web --output "$OUTPUT_ROOT"

      - name: Upload exact target receipt and assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: artifact-runtime-target-${{ inputs.source_sha }}-wasm-web
          if-no-files-found: error
          retention-days: 3
          path: ${{ runner.temp }}/artifact-runtime-assets

  aggregate:
    name: Assemble and prove container runtime inputs
    needs: [native, musl, wasm]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      artifact_name: ${{ steps.identity.outputs.artifact_name }}
    steps:
      - name: Check out exact source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false

      - name: Verify exact source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [ "$(git rev-parse HEAD)" = "$SOURCE_SHA" ]

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download all exact target receipts and assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: artifact-runtime-target-${{ inputs.source_sha }}-*
          path: ${{ runner.temp }}/artifact-runtime-assets
          merge-multiple: true

      - name: Require the complete target receipt matrix
        env:
          ASSET_ROOT: ${{ runner.temp }}/artifact-runtime-assets
        run: |
          set -euo pipefail
          for target in \
            darwin-x64 darwin-arm64 \
            linux-x64-gnu linux-arm64-gnu \
            linux-x64-musl linux-arm64-musl \
            win32-x64-msvc; do
            test -f "$ASSET_ROOT/native/$target/artifact-kernel-build-receipt.json"
            test -f "$ASSET_ROOT/native/$target/opengeni_artifact_kernel.node"
          done
          test -f "$ASSET_ROOT/wasm-web/artifact-kernel-build-receipt.json"
          test "$(find "$ASSET_ROOT" -name artifact-kernel-build-receipt.json -type f | wc -l)" -eq 8

      - name: Build and pack exact artifact-tool
        id: pack
        env:
          PACK_ROOT: ${{ runner.temp }}/artifact-tool-pack
        run: |
          set -euo pipefail
          bun run --cwd packages/contracts build
          bun run --cwd packages/artifact-tool build
          mkdir -p "$PACK_ROOT"
          packed="$(cd packages/artifact-tool && bun pm pack --ignore-scripts --quiet --destination "$PACK_ROOT")"
          tarball="$(find "$PACK_ROOT" -maxdepth 1 -type f -name '*.tgz' -print)"
          test -n "$tarball"
          test "$(printf '%s\n' "$tarball" | wc -l)" -eq 1
          integrity="$(bun -e 'import { createHash } from "node:crypto"; const bytes = new Uint8Array(await Bun.file(process.argv[1]).arrayBuffer()); process.stdout.write(`sha512-${createHash("sha512").update(bytes).digest("base64")}`)' "$tarball")"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "integrity=$integrity" >> "$GITHUB_OUTPUT"

      - name: Materialize complete release matrix
        env:
          ASSET_ROOT: ${{ runner.temp }}/artifact-runtime-assets
          INTEGRITY: ${{ steps.pack.outputs.integrity }}
        run: |
          set -euo pipefail
          version="$(jq -er '.version' packages/artifact-tool/package.json)"
          bun scripts/materialize-artifact-kernel-packages.ts \
            --asset-root "$ASSET_ROOT" \
            --output "$RUNNER_TEMP/artifact-runtime-packages" \
            --artifact-tool-version "$version" \
            --artifact-tool-integrity "$INTEGRITY" \
            --target all

      - name: Assemble exact OCI architecture inputs
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          set -euo pipefail
          bun scripts/assemble-artifact-runtime-container-inputs.ts \
            --release-manifest "$RUNNER_TEMP/artifact-runtime-packages/artifact-runtime-release-manifest.json" \
            --materialized-packages-root "$RUNNER_TEMP/artifact-runtime-packages" \
            --artifact-tool-tarball "$TARBALL" \
            --output "$GITHUB_WORKSPACE/.release/artifact-runtime"

      - name: Strict host locator and doctor
        env:
          NODE_ENV: production
          OPENGENI_ARTIFACT_RUNTIME_MANIFEST: ${{ github.workspace }}/.release/artifact-runtime/amd64/installation.json
          OPENGENI_ARTIFACT_TOOL_ENTRY: ${{ github.workspace }}/.release/artifact-runtime/amd64/skill-facade-entry.mjs
        run: bun packages/artifact-tool/src/runtime-cli-entry.ts doctor --json

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Prove Docker target mapping and doctor on both architectures
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file docker/opengeni.Dockerfile \
            --target artifact-runtime-base \
            --build-arg OPENGENI_SERVER_VERSION=sha-${{ inputs.source_sha }} \
            .

      - name: Name run-local runtime input artifact
        id: identity
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: echo "artifact_name=artifact-runtime-containers-$SOURCE_SHA" >> "$GITHUB_OUTPUT"

      - name: Upload verified runtime inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: artifact-runtime-containers-${{ inputs.source_sha }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 3
          path: .release/artifact-runtime
