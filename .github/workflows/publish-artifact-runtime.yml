name: Publish native artifact runtime

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: publish-artifact-runtime-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish:
    name: Retain verified exact-source native runtimes
    if: >-
      github.repository == 'Cloudgeni-ai/opengeni' &&
      github.event.workflow_run.repository.id == 1212552738 &&
      github.event.workflow_run.head_repository.id == 1212552738 &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      # workflow_run executes trusted default-branch controller code, not artifact code.
      - name: Check out trusted publication controller
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Check out exact successful source as data
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: .release/runtime-source
          persist-credentials: false

      - name: Set up controller Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Install controller dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Verify and retain all seven native archives without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_SOURCE_ROOT: ${{ github.workspace }}/.release/runtime-source
        run: bun scripts/publish-artifact-runtime.ts