name: Migration online safety

on:
  pull_request:
    branches: [main]
    paths:
      - "packages/db/drizzle/**"
      - "packages/db/src/migration-*.ts"
      - "scripts/*migration*.ts"
      - "scripts/ci/**"
      - ".github/workflows/migration-online-safety.yml"
      - ".bun-version"
  push:
    branches: [main]
    paths:
      - "packages/db/drizzle/**"
      - "scripts/*migration*.ts"
      - ".github/workflows/migration-online-safety.yml"

permissions:
  contents: read

concurrency:
  group: migration-online-safety-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  online-safety:
    name: Migration online-safety lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      # These guards import only Bun/Node builtins; no full-stack install needed.
      - run: bun test scripts/check-migration-online-safety.test.ts scripts/check-migration-deployment-mode.test.ts
      - run: bun run check:migration-online-safety
