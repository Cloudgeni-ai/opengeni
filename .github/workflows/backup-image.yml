name: Backup image

on:
  push:
    branches: [main]
    paths:
      - scripts/backup.ts
      - scripts/backup/**
      - docker/backup.Dockerfile
      - .github/workflows/backup-image.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-image-${{ github.sha }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Install restic
        timeout-minutes: 2
        env:
          RESTIC_VERSION: 0.19.1
          RESTIC_SHA256: f415415624dcc452f2a02b8c33641791a8c6d6d3b65bbb3543fcf9a25151585c
        run: |
          curl -fsSL -o "$RUNNER_TEMP/restic.bz2" \
            "https://github.com/restic/restic/releases/download/v${RESTIC_VERSION}/restic_${RESTIC_VERSION}_linux_amd64.bz2"
          echo "$RESTIC_SHA256  $RUNNER_TEMP/restic.bz2" | sha256sum -c -
          bunzip2 -c "$RUNNER_TEMP/restic.bz2" > "$RUNNER_TEMP/restic"
          sudo install -m 0755 "$RUNNER_TEMP/restic" /usr/local/bin/restic
          restic version
      - name: Test operator runner
        timeout-minutes: 5
        run: bun test scripts/backup/backup.test.ts --timeout 120000
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish exact revision
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/backup.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/cloudgeni-ai/opengeni-backup:sha-${{ github.sha }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          provenance: true
      - name: Retain digest receipt
        timeout-minutes: 1
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          test -n "$IMAGE_DIGEST"
          jq -n --arg revision "$GITHUB_SHA" --arg digest "$IMAGE_DIGEST" \
            '{sourceRevision: $revision, repository: "ghcr.io/cloudgeni-ai/opengeni-backup", digest: $digest, platforms: ["linux/amd64"]}' > backup-image-receipt.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backup-image-receipt
          path: backup-image-receipt.json
