name: Browser and visual acceptance

# One job definition for the curated browser acceptance lanes. ci.yml (main and
# merge-batcher batches) and pr-ci.yml both call it with the lanes their impact
# plan selects (scripts/ci/impact.ts browserAcceptanceLanes), so a PR's own
# deterministic browser failure shows on the PR instead of failing a batch.
on:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to check out and test.
        required: true
        type: string
      matrix:
        description: JSON list of {lane, engine} entries.
        required: true
        type: string

permissions:
  contents: read

jobs:
  browser-acceptance:
    name: Browser and visual acceptance (${{ matrix.lane }})
    runs-on: ubuntu-24.04
    timeout-minutes: 71
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.matrix) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1
          persist-credentials: false

      - name: Restore complete checkout history without listing refs
        shell: bash
        timeout-minutes: 5
        env:
          EXPECTED_CHECKOUT_SHA: ${{ inputs.ref }}
          EXPECTED_SELECTED_PULL_REF: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || '' }}
        run: |
          set -euo pipefail
          checked_out_sha="$(git rev-parse HEAD 2>/dev/null)"
          fetch_args=()
          if [ "$(git rev-parse --is-shallow-repository 2>/dev/null)" = true ]; then
            fetch_args+=(--unshallow)
          fi
          selected_fetch="$checked_out_sha"
          if [ -n "${EXPECTED_SELECTED_PULL_REF:-}" ]; then
            if [[ ! "$EXPECTED_SELECTED_PULL_REF" =~ ^refs/pull/[0-9]+/head$ ]]; then
              echo "::error::Selected checkout identity changed"
              exit 1
            fi
            selected_fetch="+$EXPECTED_SELECTED_PULL_REF:refs/remotes/origin/selected-pull"
          fi
          if ! git fetch --quiet --no-tags --prune --no-recurse-submodules "${fetch_args[@]}" origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/production:refs/remotes/origin/production' \
            '+refs/tags/*:refs/tags/*' \
            "$selected_fetch" >/dev/null 2>&1; then
            echo "::error::Could not restore complete repository history"
            exit 1
          fi
          if [ "$(git rev-parse --is-shallow-repository 2>/dev/null)" != false ] ||
             [ "$(git rev-parse HEAD 2>/dev/null)" != "$checked_out_sha" ]; then
            echo "::error::Repository history or source identity changed"
            exit 1
          fi
          if [ -n "${EXPECTED_SELECTED_PULL_REF:-}" ] &&
             [ "$(git rev-parse refs/remotes/origin/selected-pull 2>/dev/null)" != "$checked_out_sha" ]; then
            echo "::error::Selected checkout identity changed"
            exit 1
          fi
          if [ -n "${EXPECTED_CHECKOUT_SHA:-}" ] &&
             [ "$checked_out_sha" != "$EXPECTED_CHECKOUT_SHA" ]; then
            echo "::error::Selected checkout identity changed"
            exit 1
          fi
          if [ -n "${EXPECTED_CHECKOUT_REF:-}" ] &&
             [ "$(git rev-parse "$EXPECTED_CHECKOUT_REF" 2>/dev/null)" != "$checked_out_sha" ]; then
            echo "::error::Selected checkout identity changed"
            exit 1
          fi
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Cache Bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Stabilize Ubuntu package downloads
        run: |
          for source_file in \
            /etc/apt/apt-mirrors.txt \
            /etc/apt/sources.list \
            /etc/apt/sources.list.d/ubuntu.sources; do
            if [[ -f "$source_file" ]]; then
              sudo sed -i \
                -e 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
                -e 's|https://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' \
                "$source_file"
            fi
          done
          printf '%s\n' \
            'Acquire::Retries "3";' \
            'Acquire::http::Timeout "30";' \
            'Acquire::https::Timeout "30";' \
            | sudo tee /etc/apt/apt.conf.d/99opengeni-ci-network >/dev/null

      - name: Install pinned lane browser runtimes
        uses: ./.github/actions/playwright-browsers
        timeout-minutes: 17
        with:
          browsers: ${{ matrix.lane == 'workbench' && 'chromium firefox webkit' || matrix.lane == 'accounts' && matrix.engine || 'chromium' }}

      - name: Browser account session-set acceptance
        if: ${{ matrix.lane == 'accounts' }}
        id: browser_accounts
        timeout-minutes: 14
        env:
          # This lane must prove the migrated owner plus restricted opengeni_app
          # FORCE-RLS boundary. A missing real database is a hard failure.
          OPENGENI_REQUIRE_REAL_DB: "1"
          OPENGENI_ACCOUNT_BROWSER_ENGINE: ${{ matrix.engine }}
          OPENGENI_ACCOUNT_EVIDENCE_DIR: /tmp/opengeni-account-acceptance
        run: |
          bun test --max-concurrency=1 --timeout 180000 \
            ./packages/db/test/managed-auth-session-sets.test.ts \
            ./apps/api/test/managed-auth-session-sets.integration.test.ts
          if [ "$OPENGENI_ACCOUNT_BROWSER_ENGINE" = "chromium" ]; then
            bun scripts/run-browser-e2e.ts ./test/e2e/browser-account-request-observation.browser.e2e.ts
          fi
          bun scripts/run-browser-e2e.ts \
            ./test/e2e/browser-accounts-acceptance.e2e.ts

      - name: Editable artifact browser acceptance
        if: ${{ matrix.lane == 'workbench' }}
        run: |
          bun scripts/run-browser-e2e.ts \
            ./test/e2e/artifact-spreadsheet-canvas.browser.e2e.ts \
            ./test/e2e/artifact-spreadsheet-scroll.browser.e2e.ts \
            ./test/e2e/artifact-static-renderer.browser.e2e.ts

      - name: Install pinned artifact native toolchain
        if: ${{ matrix.lane == 'workbench' }}
        working-directory: packages/artifact-tool/kernel
        run: |
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup show active-toolchain

      - name: Editable artifact full-stack browser acceptance
        if: ${{ matrix.lane == 'workbench' }}
        id: editable_artifact_browser
        env:
          OPENGENI_EDITABLE_ARTIFACT_EVIDENCE_DIR: /tmp/opengeni-editable-artifact-evidence
        run: bun scripts/run-browser-e2e.ts ./test/e2e/editable-artifacts.browser.e2e.ts

      - name: Codex quota and entitlement browser acceptance
        if: ${{ matrix.lane == 'interaction' }}
        env:
          # Human-only redemption recovery and allocator independence require
          # the real FORCE-RLS/OCC/PostgreSQL boundary; no skipped green path.
          OPENGENI_REQUIRE_REAL_DB: "1"
          OPENGENI_CODEX_QUOTA_EVIDENCE_DIR: /tmp/codex-quota-evidence
        run: bun scripts/run-browser-e2e.ts ./test/e2e/codex-overview.e2e.ts

      - name: Capabilities control-center browser acceptance
        if: ${{ matrix.lane == 'interaction' }}
        run: |
          bun scripts/run-browser-e2e.ts \
            ./test/e2e/custom-api-control-center.browser.e2e.ts \
            ./test/e2e/source-packages-control-center.browser.e2e.ts

      - name: Compact session-search header browser acceptance
        if: ${{ matrix.lane == 'interaction' }}
        id: session_search_header_browser
        timeout-minutes: 8
        env:
          OPENGENI_REQUIRE_REAL_DB: "1"
          OPENGENI_SESSION_SEARCH_ARTIFACT_DIR: /tmp/session-search-header-evidence
        run: >-
          bun test --max-concurrency=1 --timeout 300000
          --test-name-pattern 'desktop expanded header keeps icon-only search inline|restores.*focus|mobile result navigation'
          ./test/e2e/session-search.browser.e2e.ts

      - name: Queue surface browser acceptance
        if: ${{ matrix.lane == 'interaction' }}
        id: queue_surface_browser
        run: bun scripts/run-browser-e2e.ts ./test/e2e/queue-surface.browser.e2e.ts

      - name: Long user-message disclosure browser acceptance
        if: ${{ matrix.lane == 'interaction' }}
        run: bun scripts/run-browser-e2e.ts ./test/e2e/user-message-disclosure.browser.e2e.ts

      - name: Timeline pagination and tip-follow browser regressions
        if: ${{ matrix.lane == 'interaction' }}
        run: |
          bun scripts/run-browser-e2e.ts \
            ./test/e2e/timeline-scroll.browser.e2e.ts \
            ./test/e2e/timeline-tip-follow.browser.e2e.ts \
            ./test/e2e/timeline-exchange-fold.browser.e2e.ts

      - name: Public realtime SDK demo browser acceptance
        if: ${{ matrix.lane == 'interaction' }}
        env:
          OPENGENI_REALTIME_DEMO_EVIDENCE_DIR: /tmp/opengeni-realtime-demo-evidence
        run: bun scripts/run-browser-e2e.ts ./test/e2e/realtime-demo.browser.e2e.ts

      - name: Session pin browser acceptance
        if: ${{ matrix.lane == 'knowledge' }}
        id: session_pin_browser
        # Includes a production web build, real PostgreSQL setup, and 29 serial
        # browser cases. Runs on 17c5f19e and b8fd5140 passed all 29 cases but
        # hit the old 6m cap at 362s (337s tests, 25s setup/teardown). Allow
        # bounded suite headroom without changing individual test deadlines.
        timeout-minutes: 8
        env:
          # This browser gate must fail when its real PostgreSQL boundary is unavailable.
          OPENGENI_REQUIRE_REAL_DB: "1"
        run: bun test --max-concurrency=1 --timeout 180000 ./test/e2e/session-pins.browser.e2e.ts

      - name: Responsive knowledge surfaces browser acceptance
        if: ${{ matrix.lane == 'knowledge' }}
        id: knowledge_surfaces_browser
        timeout-minutes: 6
        env:
          # This gate traverses the public configured-principal API and must fail
          # rather than skip when its real PostgreSQL boundary is unavailable.
          OPENGENI_REQUIRE_REAL_DB: "1"
        run: bun test --max-concurrency=1 --timeout 300000 ./test/e2e/knowledge-surfaces.browser.e2e.ts

      - name: Organization onboarding lifecycle acceptance
        if: ${{ matrix.lane == 'onboarding' }}
        id: organization_onboarding
        timeout-minutes: 8
        env:
          # The owner migration principal, opengeni_app FORCE-RLS boundary, and
          # durable invitation state are mandatory. A missing database must fail.
          OPENGENI_REQUIRE_REAL_DB: "1"
          OPENGENI_ONBOARDING_EVIDENCE_DIR: /tmp/opengeni-onboarding-evidence
        run: >-
          bun scripts/run-browser-e2e.ts
          ./test/e2e/organization-onboarding-acceptance.e2e.ts

      - name: Workbench browser acceptance
        if: ${{ matrix.lane == 'workbench' }}
        id: workbench_browser
        timeout-minutes: 4
        run: bun test --max-concurrency=1 --timeout 180000 ./test/e2e/workbench.browser.e2e.ts

      - name: Upload browser account acceptance evidence
        if: >-
          ${{ always() && matrix.lane == 'accounts' &&
          (steps.browser_accounts.outcome == 'success' ||
          steps.browser_accounts.outcome == 'failure') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-account-acceptance-${{ matrix.engine }}
          if-no-files-found: error
          retention-days: 14
          path: /tmp/opengeni-account-acceptance

      - name: Upload session pin visual evidence
        # A preceding repository-wide gate may fail before the browser command
        # starts. In that case there are no screenshots to upload, and turning
        # that skipped command into a second artifact failure obscures the real
        # cause. Once the browser gate actually runs, preserve its visual
        # evidence on both green and red outcomes; a failure report is needed
        # to diagnose a browser regression just as much as a passing capture.
        # `if-no-files-found: error` remains mandatory in either case.
        if: >-
          ${{ always() &&
          matrix.lane == 'knowledge' &&
          (steps.session_pin_browser.outcome == 'success' ||
          steps.session_pin_browser.outcome == 'failure') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sessionpin-session-pin-visual-evidence
          if-no-files-found: error
          retention-days: 14
          path: |
            /tmp/sessionpin-session-pin-desktop-light.png
            /tmp/sessionpin-session-pin-desktop-dark.png
            /tmp/sessionpin-session-pin-mobile-light.png
            /tmp/sessionpin-session-pin-mobile-dark.png
            /tmp/sessionpin-session-pin-mobile-375-light.png
            /tmp/sessionpin-session-pin-mobile-375-dark.png

      - name: Upload compact session-search header evidence
        if: >-
          ${{ always() && matrix.lane == 'interaction' &&
          (steps.session_search_header_browser.outcome == 'success' ||
          steps.session_search_header_browser.outcome == 'failure') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: session-search-header-evidence
          if-no-files-found: error
          retention-days: 14
          path: /tmp/session-search-header-evidence

      - name: Upload Codex quota visual evidence
        if: ${{ always() && matrix.lane == 'interaction' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codex-quota-codex-quota-entitlement-visual-evidence
          if-no-files-found: error
          retention-days: 14
          path: |
            /tmp/codex-quota-evidence/codex-quota-desktop-light.png
            /tmp/codex-quota-evidence/codex-quota-desktop-dark.png
            /tmp/codex-quota-evidence/codex-quota-mobile-light.png
            /tmp/codex-quota-evidence/codex-quota-mobile-dark.png

      - name: Upload responsive knowledge-surface evidence
        if: ${{ always() && matrix.lane == 'knowledge' && (steps.knowledge_surfaces_browser.outcome == 'success' || steps.knowledge_surfaces_browser.outcome == 'failure') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: responsive-knowledge-surface-evidence
          if-no-files-found: error
          retention-days: 14
          path: |
            /tmp/knowledge-surfaces-320-light-memory.png
            /tmp/knowledge-surfaces-320-dark-memory.png
            /tmp/knowledge-surfaces-375-light-variable-sets.png
            /tmp/knowledge-surfaces-375-dark-variable-sets.png
            /tmp/knowledge-surfaces-768-light-documents.png
            /tmp/knowledge-surfaces-768-dark-documents.png
            /tmp/knowledge-surfaces-desktop-light-memory.png
            /tmp/knowledge-surfaces-desktop-dark-memory.png
            /tmp/agent-knowledge-320-light-overview.png
            /tmp/agent-knowledge-375-dark-overview.png
            /tmp/agent-knowledge-768-light-overview.png
            /tmp/agent-knowledge-desktop-dark-overview.png

      - name: Upload organization onboarding evidence
        if: >-
          ${{ always() &&
          matrix.lane == 'onboarding' &&
          (steps.organization_onboarding.outcome == 'success' ||
          steps.organization_onboarding.outcome == 'failure') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: organization-onboarding-acceptance-evidence
          if-no-files-found: error
          retention-days: 14
          path: |
            /tmp/opengeni-onboarding-evidence/organization-onboarding-evidence.json
            /tmp/opengeni-onboarding-evidence/onboarding-owner-desktop-1440.png
            /tmp/opengeni-onboarding-evidence/onboarding-setup-mobile-390.png
            /tmp/opengeni-onboarding-evidence/onboarding-registered-mobile-320.png
            /tmp/opengeni-onboarding-evidence/contrast-failure.json
            /tmp/opengeni-onboarding-evidence/contrast-failure.png

      - name: Upload workbench visual evidence
        if: >-
          ${{ always() &&
          matrix.lane == 'workbench' &&
          (steps.workbench_browser.outcome == 'success' ||
          steps.workbench_browser.outcome == 'failure') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workbench-visual-evidence
          if-no-files-found: error
          retention-days: 14
          path: |
            /tmp/workbench-mobile-dark-dense.png
            /tmp/workbench-tablet-light-offline.png
            /tmp/workbench-desktop-dark-changes.png
            /tmp/workbench-desktop-light-files.png

      - name: Upload editable artifact visual evidence
        if: >-
          ${{ always() &&
          matrix.lane == 'workbench' &&
          (steps.editable_artifact_browser.outcome == 'success' ||
          steps.editable_artifact_browser.outcome == 'failure') }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: editable-artifact-visual-evidence
          if-no-files-found: error
          retention-days: 14
          path: |
            /tmp/opengeni-editable-artifact-evidence/editable-artifact-document-dark.png
            /tmp/opengeni-editable-artifact-evidence/editable-artifact-spreadsheet-dark.png
            /tmp/opengeni-editable-artifact-evidence/editable-artifact-presentation-dark.png
