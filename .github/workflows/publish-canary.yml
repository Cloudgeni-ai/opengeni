name: Publish canary packages

# Lockstep {next-patch}-canary.N to dist-tag canary. Does not consume
# changeset files, does not commit, never moves latest.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact lowercase 40-character protected-main SHA to publish as canary."
        required: true
        type: string

concurrency:
  group: publish-canary
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish canary.N
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Admit protected main source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]
          [[ "$GITHUB_REPOSITORY" == "Cloudgeni-ai/opengeni" ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_SHA" == "$GITHUB_SHA" ]]
          [[ "$GITHUB_WORKFLOW_SHA" == "$GITHUB_SHA" ]]
          [[ "$GITHUB_WORKFLOW_REF" == "$GITHUB_REPOSITORY/.github/workflows/publish-canary.yml@refs/heads/main" ]]

      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: "${{ github.sha }}"
          persist-credentials: false
          fetch-depth: 0

      - name: Verify exact source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" == "$GITHUB_SHA" ]]
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Publish canary versions
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          OPENGENI_RELEASE: "1"
        # The checked-out source and workflow identity must match the attested commit.
        run: bun scripts/publish-canary.ts

      - name: Retain exact Site package pins for this deployment
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: site-package-versions-${{ inputs.source_sha }}
          path: .release/site-package-versions.json
          if-no-files-found: error

      - name: Retain bounded publication and registry receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: canary-publication-receipts-${{ inputs.source_sha }}
          path: .release/canary-receipts
          if-no-files-found: warn
          retention-days: 7
