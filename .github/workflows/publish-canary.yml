name: Publish canary packages

# Custom per-package {version}-canary.N to dist-tag canary. Does not consume
# changeset files, does not commit, never moves latest.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact lowercase 40-character protected-main SHA to publish as canary."
        required: true
        type: string

concurrency:
  group: publish-canary
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish canary.N
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Admit protected main source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]
          [[ "$GITHUB_REPOSITORY" == "Cloudgeni-ai/opengeni" ]]
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_SHA" == "$GITHUB_SHA" ]]
          [[ "$GITHUB_WORKFLOW_SHA" == "$GITHUB_SHA" ]]
          [[ "$GITHUB_WORKFLOW_REF" == "$GITHUB_REPOSITORY/.github/workflows/publish-canary.yml@refs/heads/main" ]]

      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: "${{ github.sha }}"
          persist-credentials: false

      - name: Verify exact source
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "$SOURCE_SHA" ]]

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Publish canary versions
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
          OPENGENI_RELEASE: "1"
        run: bun scripts/publish-canary.ts
